openapi: 3.1.0
info:
  title: CRM Silmer API
  version: 1.0.0
  description: Contratos versionados de identidade e domínio do CRM Silmer.
servers:
  - url: /api/v1
paths:
  /bootstrap/identity:
    post:
      operationId: bootstrapIdentity
      summary: Cria o único Admin inicial e seu MFA
      parameters:
        - $ref: '#/components/parameters/BootstrapToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '201':
          description: Admin e material MFA emitidos uma única vez
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /invitations:
    post:
      operationId: createInvitation
      summary: Cria convite por Admin autenticado com MFA
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
      responses:
        '201':
          description: Convite criado; o token é exibido uma vez
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Consome um convite e cria o usuário atomicamente
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string, minLength: 1 }
                password: { type: string, minLength: 12 }
      responses:
        '201':
          description: Conta ativada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /sessions:
    post:
      operationId: createSession
      summary: Autentica sem enumerar contas e cria cookies separados
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessão criada; nenhum token integra o corpo
          headers:
            Set-Cookie:
              description: crm_session HttpOnly e crm_csrf legível pelo cliente
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/Throttled' }
  /sessions/current:
    get:
      operationId: getCurrentSession
      summary: Retorna o usuário da sessão e toca a expiração ociosa
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Sessão atual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionView' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
    delete:
      operationId: deleteCurrentSession
      summary: Revoga a sessão atual
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204': { description: Sessão revogada e cookies expirados }
        '403': { $ref: '#/components/responses/Forbidden' }
  /mfa/enrollments:
    post:
      operationId: enrollMfa
      summary: Emite segredo TOTP e oito códigos de recuperação uma vez
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '201':
          description: Material MFA emitido uma única vez
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaEnrollment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /capabilities/{change}:
    post:
      operationId: changeCapability
      summary: Concede ou revoga capacidade e audita a mudança
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - name: change
          in: path
          required: true
          schema: { type: string, enum: [grant, revoke] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityRequest'
      responses:
        '200':
          description: Mudança confirmada
          content:
            application/json:
              schema:
                type: object
                required: [changed]
                properties:
                  changed: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /kanban:
    get:
      operationId: getKanban
      summary: Projeta as cinco colunas do Kanban a partir de Negócios ativos
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - {
            name: assignedUserId,
            in: query,
            schema: { type: string, minLength: 1 },
          }
        - { name: hasOverdueTask, in: query, schema: { type: boolean } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        '200':
          description: Colunas com paginação independente; Backlog não integra o Kanban
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
            Vary: { schema: { type: string, const: 'Origin, Cookie' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KanbanBoard' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /kanban/cards:
    get:
      operationId: getKanbanCards
      summary: Pagina uma etapa do Kanban por updatedAt e Deal id
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - {
            name: stage,
            in: query,
            required: true,
            schema: { $ref: '#/components/schemas/DealStage' },
          }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - {
            name: assignedUserId,
            in: query,
            schema: { type: string, minLength: 1 },
          }
        - { name: hasOverdueTask, in: query, schema: { type: boolean } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        '200':
          description: Página da coluna solicitada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KanbanColumn' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /deals/{dealId}:
    get:
      operationId: getDealDetail
      summary: Retorna detalhe operacional pseudônimo do Negócio
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/HumanReadOrigin'
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        '200':
          description: Negócio, qualificação, tarefas, gates, histórico e handoffs sem texto cifrado
          headers:
            ETag: { schema: { type: string } }
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
            Vary: { schema: { type: string, const: 'Origin, Cookie' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DealDetail' }
        '304': { description: Representação composta não mudou }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /events:
    get:
      operationId: streamKanbanEvents
      summary: Reproduz invalidações do Kanban em ordem total durável
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - {
            name: topic,
            in: query,
            required: true,
            schema: { type: string, const: kanban },
          }
        - { name: after, in: query, schema: { type: integer, minimum: 0 } }
        - {
            name: Last-Event-ID,
            in: header,
            schema: { type: integer, minimum: 0 },
          }
      responses:
        '200':
          description: >-
            text/event-stream. Emite kanban.card.changed, stream.reset e
            heartbeats; nenhum payload livre de domínio é transportado.
          content:
            text/event-stream: { schema: { type: string } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          description: Limite de aberturas por origem ou de streams simultâneos excedido
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 } }
  /conversations/{conversationId}/convert:
    post:
      operationId: convertConversation
      summary: Vincula o Contato e cria exatamente um Negócio em Produto
      description: >-
        Fecha a conversa como convertida_em_lead na mesma transação da promoção
        do Contato, criação do Negócio, idempotência e auditoria. Aceita o ator
        técnico do n8n ou uma sessão humana de Atendimento/Vendedor.
      security:
        - automationBasic: []
          idempotencyKey: []
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/OriginOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationConversionRequest'
      responses:
        '201':
          description: Conversão criada ou resposta original reproduzida
          headers:
            Location:
              description: URL canônica do Negócio criado
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationConversionResponse'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /deals/{dealId}/transitions:
    post:
      operationId: transitionDeal
      summary: Avança ou retorna exatamente uma etapa do Negócio
      description: >-
        O destino é sempre derivado da etapa atual. O avanço persiste a
        avaliação do gate, o histórico e o evento canônico na mesma transação.
        O executor técnico deve informar a conversa ativa e seu automationEpoch.
      security:
        - automationBasic: []
          idempotencyKey: []
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/OriginOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DealTransitionRequest' }
      responses:
        '200':
          description: Transição aplicada ou resposta original reproduzida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DealCommandResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /deals/{dealId}/lose:
    post:
      operationId: loseDeal
      summary: Marca o Negócio como perdido com motivo cifrado
      description: Exclusivo para Atendimento ou Vendedor autenticado.
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DealLossRequest' }
      responses:
        '200':
          description: Perda registrada ou resposta original reproduzida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DealCommandResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /deals/{dealId}/fields:
    patch:
      operationId: patchDealFields
      summary: Atualiza campos oficiais da Ficha do Negócio
      description: >-
        Patch idempotente de seções fechadas. Incrementa a versão raiz uma vez
        e retorna atomicamente à primeira etapa anterior incompleta. O executor
        técnico deve provar conversa ativa e automationEpoch na mesma transação.
      security:
        - automationBasic: []
          idempotencyKey: []
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/OriginOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DealFieldsPatchRequest' }
      responses:
        '200':
          description: Campos persistidos ou resposta original reproduzida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DealFieldsPatchResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /deals/{dealId}/assign:
    post:
      operationId: assignDeal
      summary: Atribui um Negócio a Atendimento ou Vendedor ativo
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DealAssignmentRequest' }
      responses:
        '200': { description: Atribuição persistida ou replay idempotente }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /deals/{dealId}/tasks:
    post:
      operationId: createFollowUpTask
      summary: Cria tarefa humana de follow-up com texto cifrado
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreateRequest' }
      responses:
        '201': { description: Tarefa criada ou replay idempotente }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /tasks/{taskId}/{action}:
    post:
      operationId: transitionFollowUpTask
      summary: Inicia, conclui ou cancela uma tarefa de follow-up
      description: Tarefas vinculadas a handoff não podem ser canceladas isoladamente.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [start, complete, cancel] }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskActionRequest' }
      responses:
        '200': { description: Tarefa atualizada ou replay idempotente }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /deals/{dealId}/handoffs:
    post:
      operationId: createHumanHandoff
      summary: Cria handoff humano e sua única tarefa atomicamente
      description: AUTOMATION_EXECUTOR deve informar contexto n8n e fence da conversa.
      security:
        - automationBasic: []
          idempotencyKey: []
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/OriginOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandoffCreateRequest' }
      responses:
        '201': { description: Handoff e tarefa criados ou replay idempotente }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /handoffs/{handoffId}/{action}:
    post:
      operationId: transitionHumanHandoff
      summary: Aceita, transfere ou resolve um handoff humano
      description: Transferência preserva dueAt; nenhuma ação reativa a automação.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - name: handoffId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [accept, transfer, resolve] }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandoffActionRequest' }
      responses:
        '200':
          { description: Handoff e tarefa atualizados ou replay idempotente }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    automationBasic:
      type: http
      scheme: basic
      description: Credencial exclusiva e rotacionável do AUTOMATION_EXECUTOR.
    sessionCookie:
      type: apiKey
      in: cookie
      name: crm_session
      description: Cookie opaco HttpOnly, Secure e SameSite=Lax.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Deve corresponder ao cookie Secure crm_csrf.
    idempotencyKey:
      type: apiKey
      in: header
      name: Idempotency-Key
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema: { type: string, format: uri }
    OriginOptional:
      name: Origin
      in: header
      required: false
      description: Obrigatório para autenticação humana; não usado pelo ator técnico.
      schema: { type: string, format: uri }
    HumanReadOrigin:
      name: Origin
      in: header
      required: false
      description: >-
        Se presente, deve pertencer à allowlist. Se ausente, o navegador deve
        enviar Sec-Fetch-Site same-origin ou none.
      schema: { type: string, format: uri }
    BootstrapToken:
      name: X-Bootstrap-Token
      in: header
      required: true
      schema: { type: string, minLength: 32 }
    DealId:
      name: dealId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    DealStage:
      type: string
      enum: [produto, especificacao, estampa, logistica, fechamento]
    OperationalUserRef:
      type: object
      additionalProperties: false
      required: [id, functionName]
      properties:
        id: { type: string }
        functionName: { type: string, enum: [Atendimento, Vendedor] }
    TaskView:
      type: object
      additionalProperties: false
      required: [id, type, status, assignedUserId, dueAt, version]
      properties:
        id: { type: string }
        type: { type: string, enum: [follow_up, human_handoff] }
        status: { type: string, enum: [pending, in_progress] }
        assignedUserId: { type: string }
        dueAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    KanbanCard:
      type: object
      additionalProperties: false
      required:
        [
          id,
          stage,
          status,
          version,
          updatedAt,
          stageEnteredAt,
          totalQuantity,
          assignedUser,
          nextTask,
          nextPendingField,
        ]
      properties:
        id:
          {
            type: string,
            description: O próprio Deal id; Card não é entidade persistida.,
          }
        stage: { $ref: '#/components/schemas/DealStage' }
        status: { type: string, const: active }
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
        stageEnteredAt: { type: string, format: date-time }
        totalQuantity: { type: integer, minimum: 0 }
        assignedUser:
          oneOf:
            [
              { type: 'null' },
              { $ref: '#/components/schemas/OperationalUserRef' },
            ]
        nextTask:
          oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/TaskView' }]
        nextPendingField:
          oneOf: [{ type: 'null' }, { type: string }]
    KanbanColumn:
      type: object
      additionalProperties: false
      required: [stage, label, count, cards, nextCursor]
      properties:
        stage: { $ref: '#/components/schemas/DealStage' }
        label:
          {
            type: string,
            enum: [Produto, Especificação, Estampa, Logística, Fechamento],
          }
        count: { type: integer, minimum: 0 }
        cards:
          { type: array, items: { $ref: '#/components/schemas/KanbanCard' } }
        nextCursor:
          oneOf: [{ type: 'null' }, { type: string, maxLength: 1024 }]
    KanbanBoard:
      type: object
      additionalProperties: false
      required: [columns]
      properties:
        columns:
          type: array
          minItems: 5
          maxItems: 5
          items: { $ref: '#/components/schemas/KanbanColumn' }
    HandoffView:
      type: object
      additionalProperties: false
      required:
        [
          id,
          conversationId,
          assignedUserId,
          status,
          version,
          reasonCode,
          dueAt,
          slaMinutes,
          slaPolicyVersion,
          createdAt,
          updatedAt,
          resolvedAt,
          dealVersion,
          conversationVersion,
          taskId,
          taskVersion,
        ]
      properties:
        id: { type: string }
        conversationId: { type: string }
        assignedUserId: { type: string }
        status: { type: string, enum: [pending, accepted, resolved] }
        version: { type: integer, minimum: 1 }
        reasonCode: { type: string }
        dueAt: { type: string, format: date-time }
        slaMinutes: { type: integer, minimum: 5, maximum: 10080 }
        slaPolicyVersion: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resolvedAt:
          { oneOf: [{ type: 'null' }, { type: string, format: date-time }] }
        dealVersion: { type: integer, minimum: 1 }
        conversationVersion: { type: integer, minimum: 1 }
        taskId: { type: string }
        taskVersion: { type: integer, minimum: 1 }
    DealDetail:
      type: object
      additionalProperties: false
      required: [deal, qualification, tasks, nextTask, gates, history, handoffs]
      properties:
        deal:
          type: object
          additionalProperties: true
          required:
            [id, contactRef, stage, status, version, updatedAt, assignedUser]
        qualification:
          type: object
          description: Dados estruturados e indicadores de presença; texto cifrado nunca é exposto.
          additionalProperties: true
        tasks:
          type: array
          items: { $ref: '#/components/schemas/TaskView' }
        nextTask:
          oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/TaskView' }]
        gates:
          { type: array, items: { type: object, additionalProperties: true } }
        history:
          { type: array, items: { type: object, additionalProperties: true } }
        handoffs:
          { type: array, items: { $ref: '#/components/schemas/HandoffView' } }
    User:
      type: object
      additionalProperties: false
      required: [id, functionName, capabilities]
      properties:
        id: { type: string }
        functionName: { type: string, enum: [Atendimento, Vendedor] }
        capabilities:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Capability' }
    Capability:
      type: string
      enum: [COMMERCIAL_ADMIN, PRIVACY_OFFICER, TECHNICAL_PRIVACY_EXECUTOR]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12 }
        totpCode: { type: string, pattern: '^[0-9]{6}$' }
        recoveryCode: { type: string, minLength: 1 }
    SessionView:
      type: object
      additionalProperties: false
      required: [mfaVerified, user]
      properties:
        mfaVerified: { type: boolean }
        user: { $ref: '#/components/schemas/User' }
    BootstrapRequest:
      type: object
      additionalProperties: false
      required: [email, functionName, password, reason]
      properties:
        email: { type: string, format: email }
        functionName: { type: string, enum: [Atendimento, Vendedor] }
        password: { type: string, minLength: 12 }
        reason: { type: string, minLength: 1 }
    BootstrapResponse:
      type: object
      required: [user, mfa]
      properties:
        user: { $ref: '#/components/schemas/User' }
        mfa: { $ref: '#/components/schemas/MfaEnrollment' }
    MfaEnrollment:
      type: object
      additionalProperties: false
      required: [algorithm, digits, period, secret, recoveryCodes]
      properties:
        algorithm: { type: string, const: SHA1 }
        digits: { type: integer, const: 6 }
        period: { type: integer, const: 30 }
        secret: { type: string, pattern: '^[A-Z2-7]+$' }
        recoveryCodes:
          type: array
          minItems: 8
          maxItems: 8
          items: { type: string }
    InvitationRequest:
      type: object
      additionalProperties: false
      required: [email, functionName, expiresAt, reason]
      properties:
        email: { type: string, format: email }
        functionName: { type: string, enum: [Atendimento, Vendedor] }
        expiresAt: { type: string, format: date-time }
        reason: { type: string, minLength: 1 }
    InvitationResponse:
      type: object
      additionalProperties: false
      required: [token, expiresAt]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
    CapabilityRequest:
      type: object
      additionalProperties: false
      required: [targetId, capability, reason]
      properties:
        targetId: { type: string, minLength: 1 }
        capability: { $ref: '#/components/schemas/Capability' }
        reason: { type: string, minLength: 1 }
    ConversationConversionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        automationEpoch:
          type: integer
          minimum: 0
          description: >-
            Obrigatório para AUTOMATION_EXECUTOR e rejeitado se estiver obsoleto
            ou se uma pessoa tiver assumido a conversa. Omitido por humanos.
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1 }
    ConversationConversionResponse:
      type: object
      additionalProperties: false
      required: [contact, conversation, deal]
      properties:
        contact:
          type: object
          additionalProperties: false
          required: [id, provisional, version]
          properties:
            id: { type: string }
            provisional: { type: boolean, const: false }
            version: { type: integer, minimum: 1 }
        conversation:
          type: object
          required: [id, state, terminalAt, version]
          properties:
            id: { type: string }
            state: { type: string, const: convertida_em_lead }
            terminalAt: { type: string, format: date-time }
            version: { type: integer, minimum: 2 }
        deal:
          type: object
          additionalProperties: false
          required: [id, contactId, sourceConversationId, stage, version]
          properties:
            id: { type: string }
            contactId: { type: string }
            sourceConversationId: { type: string }
            stage: { type: string, const: produto }
            version: { type: integer, const: 1 }
    DealTransitionRequest:
      type: object
      additionalProperties: false
      required: [direction, expectedVersion, reason]
      properties:
        direction: { type: string, enum: [advance, retreat] }
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1 }
        conversationId:
          type: string
          minLength: 1
          description: Obrigatório e exclusivo para AUTOMATION_EXECUTOR.
        automationEpoch:
          type: integer
          minimum: 0
          description: Obrigatório e exclusivo para AUTOMATION_EXECUTOR.
    DealLossRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason:
          type: string
          minLength: 1
          description: Motivo sensível cifrado antes da persistência.
    DealFieldsPatchRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, fields, reasonCode]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reasonCode:
          type: string
          enum:
            [
              customer_update,
              correction,
              qualification_review,
              automation_extraction,
            ]
        reasonDetail:
          type: string
          minLength: 1
          maxLength: 2048
          description: Detalhe sensível cifrado; eventos e auditoria recebem somente código e hash.
        conversationId: { type: string, minLength: 1 }
        automationEpoch: { type: integer, minimum: 0 }
        fields:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            order:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                customer: { type: string, minLength: 1 }
                name: { type: string, minLength: 1 }
                commercialIntent: { type: boolean, const: true }
            items:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/DealItemFields' }
            artwork: { $ref: '#/components/schemas/DealArtworkFields' }
            logistics: { $ref: '#/components/schemas/DealLogisticsFields' }
            observations:
              type: array
              items: { type: string, minLength: 1 }
            assessments:
              type: array
              items: { $ref: '#/components/schemas/FieldAssessment' }
    DealItemFields:
      type: object
      additionalProperties: false
      required: [id]
      minProperties: 2
      properties:
        id: { type: string, minLength: 1 }
        operation: { type: string, enum: [upsert, remove] }
        catalogVersionId: { type: string, minLength: 1 }
        productCode: { type: string, minLength: 1 }
        modelCode: { type: string, minLength: 1 }
        estimatedQuantity: { type: integer, minimum: 1 }
        fabrics:
          type: array
          items: { type: string, minLength: 1 }
        colors:
          type: object
          additionalProperties: false
          properties:
            front: { type: string, minLength: 1 }
            back: { type: string, minLength: 1 }
            rightSleeve: { type: string, minLength: 1 }
            leftSleeve: { type: string, minLength: 1 }
            collarTrim: { type: string, minLength: 1 }
            sleeveTrim: { type: string, minLength: 1 }
        grade:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [size, quantity]
            properties:
              size: { type: string, minLength: 1 }
              quantity: { type: integer, minimum: 1 }
              duplicateSizeReason: { type: string, minLength: 1 }
    DealArtworkFields:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status:
          {
            type: string,
            enum:
              [ready, customer_will_send, silmer_will_create, not_applicable],
          }
        catalogVersionId: { type: string, minLength: 1 }
        responsibility: { type: string, minLength: 1 }
        techniqueCode: { type: string, minLength: 1 }
        locations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id: { type: string, minLength: 1 }
              name: { type: string, minLength: 1 }
        files:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [attachmentId, itemId, locationId]
            properties:
              attachmentId:
                type: object
                additionalProperties: false
                required: [messageId, transientMediaId]
                properties:
                  messageId: { type: string, minLength: 1, maxLength: 64 }
                  transientMediaId:
                    { type: string, minLength: 1, maxLength: 64 }
              itemId: { type: string, minLength: 1 }
              locationId: { type: string, minLength: 1 }
        colors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [locationId, values]
            properties:
              locationId: { type: string, minLength: 1 }
              values:
                type: array
                minItems: 1
                items: { type: string, minLength: 1 }
    DealLogisticsFields:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        desiredDate: { type: string, format: date }
        purpose: { type: string, minLength: 1 }
        purchaseProfile: { type: string, minLength: 1 }
        mode: { type: string, enum: [delivery, pickup] }
        city: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        pickupLocation: { type: string, minLength: 1 }
    FieldAssessment:
      type: object
      additionalProperties: false
      required: [field, status]
      properties:
        field: { type: string, minLength: 1 }
        status:
          {
            type: string,
            enum: [preenchido, nao_aplicavel, pendente, divergente],
          }
        reason: { type: string, minLength: 1 }
    DealFieldsPatchResponse:
      type: object
      additionalProperties: false
      required: [deal, readiness, totalQuantity]
      properties:
        deal:
          { $ref: '#/components/schemas/DealCommandResponse/properties/deal' }
        readiness:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required: [complete, blockers]
            properties:
              complete: { type: boolean }
              blockers: { type: array, items: { type: string } }
              nextPendingField: { type: string }
        totalQuantity:
          type: integer
          minimum: 0
          description: Soma derivada das quantidades estimadas de todos os itens.
    DealCommandResponse:
      type: object
      additionalProperties: false
      required: [deal]
      properties:
        deal:
          type: object
          additionalProperties: true
          required: [id, stage, status, version]
          properties:
            id: { type: string }
            stage:
              type: string
              enum: [produto, especificacao, estampa, logistica, fechamento]
            status: { type: string, enum: [active, lost] }
            version: { type: integer, minimum: 2 }
        gate:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [dealId, fromStage, version, blockers, evaluatedAt]
              properties:
                dealId: { type: string }
                fromStage:
                  type: string
                  enum: [produto, especificacao, estampa, logistica]
                version: { type: integer, minimum: 1 }
                blockers:
                  type: array
                  maxItems: 0
                evaluatedAt: { type: string, format: date-time }
    DealAssignmentRequest:
      type: object
      additionalProperties: false
      required: [assignedUserId, expectedDealVersion, reasonCode]
      properties:
        assignedUserId: { type: string, minLength: 1 }
        expectedDealVersion: { type: integer, minimum: 1 }
        reasonCode: { type: string, enum: [manual_assignment] }
    TaskCreateRequest:
      type: object
      additionalProperties: false
      required:
        [assignedUserId, dueAt, expectedDealVersion, reasonCode, text, type]
      properties:
        assignedUserId: { type: string, minLength: 1 }
        dueAt: { type: string, format: date-time }
        expectedDealVersion: { type: integer, minimum: 1 }
        reasonCode: { type: string, enum: [manual_follow_up] }
        text: { type: string, minLength: 1, maxLength: 4096 }
        type: { type: string, const: follow_up }
    TaskActionRequest:
      type: object
      additionalProperties: false
      required: [expectedTaskVersion, reasonCode]
      properties:
        expectedTaskVersion: { type: integer, minimum: 1 }
        reasonCode:
          { type: string, enum: [task_started, task_completed, task_cancelled] }
    HandoffCreateRequest:
      type: object
      additionalProperties: false
      required:
        [
          assignedUserId,
          conversationId,
          expectedConversationVersion,
          expectedDealVersion,
          reasonCode,
          summary,
        ]
      properties:
        assignedUserId: { type: string, minLength: 1 }
        conversationId: { type: string, minLength: 1 }
        expectedConversationVersion: { type: integer, minimum: 1 }
        expectedDealVersion: { type: integer, minimum: 1 }
        reasonCode:
          type: string
          enum:
            [
              customer_requested_human,
              price_before_quote,
              unresolved_blocker,
              low_confidence,
            ]
        summary: { type: string, minLength: 1, maxLength: 8192 }
        automationEpoch: { type: integer, minimum: 0 }
        automationContext:
          type: object
          additionalProperties: false
          required: [executionId, workflowKey, workflowVersion]
          properties:
            executionId: { type: string, minLength: 1 }
            workflowKey: { type: string, minLength: 1 }
            workflowVersion: { type: string, minLength: 1 }
    HandoffActionRequest:
      type: object
      additionalProperties: false
      required:
        [
          expectedConversationVersion,
          expectedDealVersion,
          expectedHandoffVersion,
          expectedTaskVersion,
          reasonCode,
        ]
      properties:
        assignedUserId:
          type: string
          minLength: 1
          description: Obrigatório somente em transfer.
        expectedConversationVersion: { type: integer, minimum: 1 }
        expectedDealVersion: { type: integer, minimum: 1 }
        expectedHandoffVersion: { type: integer, minimum: 1 }
        expectedTaskVersion: { type: integer, minimum: 1 }
        reasonCode:
          {
            type: string,
            enum: [handoff_accepted, manual_transfer, handoff_resolved],
          }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code: { type: string }
  responses:
    InvalidRequest:
      description: Entrada inválida sem eco de dados recebidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidCredentials:
      description: Credenciais inválidas, sem indicar se a conta existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Origem, CSRF, sessão, MFA ou autorização inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Pessoa alvo da mudança de capacidade não encontrada
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Chave idempotente divergente ou bootstrap já consumido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Throttled:
      description: Bloqueio progressivo ativo
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Dependência de autenticação ou persistência indisponível
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
