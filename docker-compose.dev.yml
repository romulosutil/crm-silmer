name: crm-silmer-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: crm_silmer
      POSTGRES_PASSWORD: crm_silmer_dev
      POSTGRES_USER: crm_silmer
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm_silmer -d crm_silmer']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - crm-silmer-postgres-data:/var/lib/postgresql/data

  n8n-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD: n8n_local_only
      POSTGRES_USER: n8n
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U n8n -d n8n']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    volumes:
      - crm-silmer-n8n-postgres-data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:2.38.7
    depends_on:
      n8n-postgres:
        condition: service_healthy
    environment:
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PASSWORD: n8n_local_only
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_USER: n8n
      DB_TYPE: postgresdb
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_EDITOR_BASE_URL: http://127.0.0.1:5678
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_HOST: 127.0.0.1
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_PUSH_BACKEND: websocket
      N8N_SECURE_COOKIE: 'false'
      N8N_TEMPLATES_ENABLED: 'false'
      N8N_WEBHOOK_URL: http://127.0.0.1:5678/
      SILMER_LOCAL_N8N_TO_CRM_AUTHORIZATION: ${SILMER_LOCAL_N8N_TO_CRM_AUTHORIZATION:-}
      SILMER_PANEL_BASE_URL: ${SILMER_LOCAL_PANEL_BASE_URL:-http://host.docker.internal:3000}
    ports:
      - '127.0.0.1:5678:5678'
    volumes:
      - crm-silmer-n8n-data:/home/node/.n8n
      - ./ops/n8n/workflows:/workflows:ro
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        marker=/home/node/.n8n/silmer-local-workflow-imported
        if [ ! -f "$$marker" ]; then
          n8n import:workflow --input=/workflows/0S5ZS1xeDCSoWovs-local-test.sanitized.json
          touch "$$marker"
        fi
        exec n8n start

volumes:
  crm-silmer-postgres-data:
  crm-silmer-n8n-data:
  crm-silmer-n8n-postgres-data:
