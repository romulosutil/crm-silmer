        street: { type: [string, 'null'], maxLength: 150 }
        district: { type: [string, 'null'], maxLength: 80 }
        city: { type: [string, 'null'], maxLength: 80 }
        state: { type: [string, 'null'], minLength: 2, maxLength: 2 }
    DealStage:
