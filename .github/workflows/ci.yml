name: CI and immutable images

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tests, E2E and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject merge commits in pull request history
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merge_commits="$(git rev-list --merges "$PR_BASE_SHA..$PR_HEAD_SHA")"
          if [[ -n "$merge_commits" ]]; then
            echo '::error::PR branch contains merge commits. Rebase it onto the current base branch.'
            git log --oneline --merges "$PR_BASE_SHA..$PR_HEAD_SHA"
            exit 1
          fi
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run static, unit and build gates
        run: npm run validate
      - name: Run E2E and accessibility gates
        run: npm run test:e2e
      - name: Scan production dependencies
        run: npm audit --audit-level=high
      - name: Reject generated diff
        run: git diff --check && test -z "$(git status --short)"
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  images:
    name: Build and scan ${{ matrix.image }}
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: edge-web
            dockerfile: docker/edge-web.Dockerfile
          - image: runtime
            dockerfile: docker/runtime.Dockerfile
    steps:
      - name: Check out approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: |
            image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Build one local OCI layout
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          provenance: ${{ github.event_name == 'push' && 'mode=max' || false }}
          pull: true
          sbom: ${{ github.event_name == 'push' }}
          outputs: type=oci,dest=/tmp/${{ matrix.image }}-oci,tar=false
          tags: crm-silmer/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Scan local OCI layout with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          input: /tmp/${{ matrix.image }}-oci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
      - name: Log in to GHCR after the scan passes
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the scanned OCI layout without rebuilding
        if: github.event_name == 'push'
        id: release
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          OCI_LAYOUT: /tmp/${{ matrix.image }}-oci
          RELEASE_TAG: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
        run: |
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          skopeo copy --all --preserve-digests \
            "oci:$OCI_LAYOUT" "docker://$RELEASE_TAG"
          release_digest="$(docker buildx imagetools inspect "$RELEASE_TAG" | awk '/^Digest:/ { print $2; exit }')"
          test "$release_digest" = "$EXPECTED_DIGEST"
          printf 'digest=%s\n' "$release_digest" >> "$GITHUB_OUTPUT"
      - name: Record immutable digest
        if: github.event_name == 'push'
        shell: bash
        run: |
          test "${{ steps.release.outputs.digest }}" != ""
          printf '%s=%s@%s\n' '${{ matrix.image }}' \
            'ghcr.io/${{ github.repository }}/${{ matrix.image }}' \
            '${{ steps.release.outputs.digest }}' | tee digest.env
      - name: Upload digest reference
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.image }}-${{ github.sha }}
          path: digest.env
          if-no-files-found: error
          retention-days: 30
