                Cadastro explícito parcial ou null. Documento válido por tipo;
                cadastro incompleto salva rascunho e retorna issues. Empresa exige
                IE ou ISENTO declarado para completude. Não aceita nome/telefone
                substitutos nem vincula Contato.
    StoreOrderSourceApplication:
      type: object
      additionalProperties: false
      required: [groupId, application]
      properties:
        groupId: { type: string, format: uuid }
        application: { type: [string, 'null'], minLength: 1, maxLength: 200 }
    StoreOrderSourceDetails:
