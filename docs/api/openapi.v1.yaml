                  INVALID_STATE,
                  INVALID_STREET,
                  INVALID_DISTRICT,
                  INVALID_ADDRESS_NUMBER,
                  INVALID_COMPLEMENT,
                ]
            field:
              type: string
              enum:
                [
                  personType,
                  document,
                  legalName,
                  instagram,
                  stateRegistration,
                  postalCode,
                  city,
                  state,
                  street,
                  district,
                  number,
                  complement,
                ]
    PostalCodeSuggestion:
      type: object
