            - { $ref: '#/components/schemas/SizePricingSummary' }
            - { type: 'null' }
        issues:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, field]
            properties:
              code: { type: string }
              field: { type: string }
        updatedBy: { type: [string, 'null'] }
        updatedAt: { type: [string, 'null'], format: date-time }
        details:
          description: Apenas no modo store; revisão obsoleta pode exibir rascunho sem validá-lo.
          oneOf:
            - { $ref: '#/components/schemas/StoreOrderSourceDetails' }
            - { type: 'null' }
        buyer:
          description: Apenas no modo store; null quando ausente/obsoleto. Nome/telefone vêm do checkout.
          oneOf:
            - type: object
              additionalProperties: false
              required: [name, phone, registration]
              properties:
                name: { type: string }
                phone: { type: string }
                registration:
                  oneOf:
                    - { $ref: '#/components/schemas/ContactRegistration' }
                    - { type: 'null' }
            - { type: 'null' }
    OrderConfirmRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, paymentCondition]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Versão atual do pedido.
        amountText:
          type: string
          minLength: 1
          maxLength: 32
          description: >-
            Compatibilidade com cliente antigo: declaração opcional em reais
            no formato brasileiro (ex.: 4.820,00), aceita somente se igual ao
            total calculado com todos os subtotais revisados. Omitir usa a soma.
            Divergência retorna 422 SIZE_PRICING_AMOUNT_MISMATCH; não há fallback
            de preço livre. Sem composição completa retorna ORDER_NOT_CONFIRMABLE.
        paymentCondition: { $ref: '#/components/schemas/PaymentCondition' }
    OrderReopenRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Versão atual do pedido.
    OrderMilestonesRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, paidOn]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Versão atual do pedido.
        paidOn: { type: [string, 'null'], format: date }
        paymentReviewed:
          type: boolean
          description: Declaração explícita de quitação integral que libera data manual legada, mesmo se inalterada.
        deliveredOn:
          type: [string, 'null']
          format: date
          description: Obrigatório para pedido com conversa; proibido para manual sem conversa.
    OrderOrigin:
      type: string
      enum: [atendimento, loja]
    StoreFicha:
      type: object
      additionalProperties: false
      readOnly: true
      required: [telefone, produto, comprovanteUrl]
      description: >-
        Pedido da loja do site (ADRs 027 e 028): o que o registro trouxe além
        do item e do cliente. Fica dentro da ficha cifrada.
      properties:
        telefone: { type: string, description: E.164 brasileiro sem "+". }
        produto:
          type: object
          additionalProperties: false
          required: [slug, nome]
          properties:
            slug: { type: string }
            nome: { type: string }
        comprovanteUrl:
          type: [string, 'null']
          format: uri
          description: Link do comprovante da InfinitePay, quando houver.
    GatewayPayment:
      type: object
      additionalProperties: false
      readOnly: true
      required:
        [
          source,
          confirmedAt,
          paidAmountCents,
          transactionNsu,
          invoiceSlug,
          receiptUrl,
        ]
      description: >-
        Pedido da loja (ADR 028): o pagamento que a InfinitePay confirmou.
      properties:
        source: { type: string, const: infinitepay }
        confirmedAt: { type: string, format: date-time }
        paidAmountCents: { type: integer, minimum: 1 }
        transactionNsu: { type: string }
        invoiceSlug: { type: string }
        receiptUrl: { type: [string, 'null'], format: uri }
    StoreOrderRecord:
      type: object
      additionalProperties: false
      description: >-
        ADR 028: o pedido pago que o workflow n8n da loja registra depois do
        payment_check. Todas as chaves listadas em required são obrigatórias;
        entrega é opcional para envio. Nenhuma outra chave é aceita
        (UNKNOWN_REQUEST_FIELD).
      required:
        [
          schema_version,
          pedido_id,
          numero_loja,
          teste,
          produto,
          item,
          valor_centavos,
          cliente,
          pagamento,
        ]
      properties:
        schema_version: { type: string, const: '1.0' }
        pedido_id:
          type: string
          format: uuid
          description: UUID v4 gerado pelo site; é o order_nsu da InfinitePay.
        numero_loja:
          type: string
          pattern: '^LJ-[0-9A-F]{8}$'
          description: LJ- e os 8 primeiros hexadecimais de pedido_id, em maiúsculas.
        teste:
          type: boolean
          description: >-
            Aceito só com STORE_ORDERS_ACCEPT_TEST=true (senão 422
            TEST_REFUSED); o pedido fica fora do Dashboard.
        produto:
          type: object
          additionalProperties: false
          required: [slug]
          properties:
            slug: { type: string, example: camisa-masculina-lisa }
        item:
          type: object
          additionalProperties: false
          required: [cor_id, tamanho_id, quantidade, prazo_dias]
          properties:
            cor_id: { type: string, enum: [branca, chumbo, preta] }
            tamanho_id:
              { type: string, enum: [pp, p, m, g, gg, eg, xg, xx, jeg] }
            quantidade: { type: integer, const: 10 }
            prazo_dias:
              type: integer
              description: Dias úteis da cor — branca 0, chumbo e preta 10.
        valor_centavos:
          type: integer
          description: >-
            18000; 100 só num pedido de teste aceito. Conferido com o catálogo
            do CRM, que grava o próprio preço.
        cliente:
          type: object
          additionalProperties: false
          required: [nome, telefone]
          properties:
            nome: { type: string, minLength: 2, maxLength: 80 }
            telefone:
              type: string
              pattern: '^55[1-9]{2}(?:9[0-9]{8}|[2-5][0-9]{7})$'
              description: E.164 brasileiro sem "+".
        entrega:
          type: object
          additionalProperties: false
          description: >-
            Somente para envio. O CRM grava o CEP e a instrução de contato em
            Observações do pedido. Omitir para retirada na loja.
          required: [tipo, cep]
          properties:
            tipo: { type: string, const: envio }
            cep: { type: string, pattern: '^(?!00000-000$)[0-9]{5}-[0-9]{3}$' }
        pagamento:
          type: object
          additionalProperties: false
          required:
            [
              gateway,
              forma,
              transaction_nsu,
              invoice_slug,
              valor_pago_centavos,
              pago_em,
              receipt_url,
            ]
          properties:
            gateway: { type: string, const: infinitepay }
            forma: { type: string, const: pix }
            transaction_nsu: { type: string, pattern: '^[\x21-\x7e]{1,128}$' }
            invoice_slug: { type: string, pattern: '^[\x21-\x7e]{1,128}$' }
            valor_pago_centavos:
              type: integer
              minimum: 1
              description: Maior ou igual a valor_centavos (senão 422 AMOUNT_BELOW_PRICE).
            pago_em:
              type: string
              format: date-time
              description: >-
                ISO 8601 em UTC (sufixo Z), no máximo 5 minutos à frente do
                relógio do CRM e 30 dias atrás.
            receipt_url:
              type: [string, 'null']
              format: uri
              description: >-
                Nulo, ou https em infinitepay.io, *.infinitepay.io,
                infinitepay.com.br ou *.infinitepay.com.br, sem porta nem
                credencial.
    StoreOrderRecorded:
      type: object
      additionalProperties: false
      required:
        [
          numero,
          numero_loja,
          pedido_id,
          criado,
          comprovante_registrado,
          pedido_url,
          ficha_url,
        ]
      properties:
        numero: { type: string, pattern: '^[0-9]{2,}-CRM$' }
        numero_loja: { type: string, pattern: '^LJ-[0-9A-F]{8}$' }
        pedido_id:
          type: string
          description: Id do pedido no CRM (não é o pedido_id do site).
        criado: { type: boolean }
        comprovante_registrado: { type: boolean }
        pedido_url:
          type: string
          description: APP_BASE_URL + /pedidos/{id}; relativa sem APP_BASE_URL.
        ficha_url:
          type: string
          description: >-
            APP_BASE_URL + /api/v1/orders/{id}/print?download=1; exige sessão
            do CRM.
    OrderError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code:
              type: string
              enum:
                [
                  ORDER_NOT_FOUND,
                  VERSION_CONFLICT,
                  ORDER_NOT_CONFIRMED,
                  ORDER_NOT_CONFIRMABLE,
                  INVALID_AMOUNT,
                  INVALID_GRADE,
                  ORDER_SOURCE_INVALID,
                  ORDER_SOURCE_STALE,
                  ORDER_SOURCE_LOCKED,
                  ORDER_OLIST_LOCKED,
                  ORDER_OLIST_SNAPSHOT_MISMATCH,
                  SIZE_PRICING_INVALID,
                  SIZE_PRICING_OVERFLOW,
                  SIZE_PRICING_ALREADY_INITIALIZED,
                  SIZE_PRICING_NOT_INITIALIZED,
                  SIZE_PRICING_LEGACY_REQUIRES_ADAPTER,
                  SIZE_PRICING_ITEMS_MANAGED,
                  SIZE_PRICING_AMOUNT_MISMATCH,
                  INVALID_DATE,
                  ORDER_STATUS_CONFLICT,
                  ORDER_CANCELLED,
                  ORDER_CANCELLATION_BLOCKED,
                  EMPTY_FILE,
                  FILE_CONTENT_MISMATCH,
                  FILE_LIMIT_REACHED,
                  FILE_NOT_FOUND,
                  FILE_TOO_LARGE,
                  FILE_TYPE_NOT_ALLOWED,
                  INVALID_FILE_NAME,
                  INVALID_FILE_SLOT,
                  INVALID_THUMBNAIL,
                  ORDER_LOCKED,
                ]
            fields:
              type: array
              description: >-
                Campos recusados em ORDER_NOT_CONFIRMABLE (as chaves de
                Order.missingFields) e INVALID_DATE.
              items: { type: string }
            index:
              type: integer
              minimum: 0
              description: Índice da linha recusada em INVALID_GRADE.
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code: { type: string }
  responses:
    LeadOutcomeProblem:
      description: >-
        application/problem+json com `code` público: INVALID_REQUEST,
        INVALID_IDEMPOTENCY_KEY, INVALID_LOSS_REASON, INVALID_LOSS_NOTE,
        INVALID_CREDENTIALS, FORBIDDEN, CSRF_INVALID, CONVERSATION_NOT_FOUND, LEAD_NOT_ELIGIBLE,
        LEAD_HAS_ORDER, LEAD_AWAITING_REPLY, LEAD_ALREADY_LOST,
        LEAD_NOT_LOST, VERSION_CONFLICT, IDEMPOTENCY_KEY_REUSED ou
        SERVICE_UNAVAILABLE, sem eco do corpo recebido
      content:
        application/problem+json:
          schema:
            type: object
            additionalProperties: false
            required: [type, title, status, code]
            properties:
              type: { type: string, const: about:blank }
              title: { type: string }
              status: { type: integer }
              code: { type: string }
    OlistFailure:
      description: Erro público Olist, sem mensagem interna, credencial ou payload remoto.
      headers:
        Cache-Control:
          schema: { const: 'private, no-store' }
        Referrer-Policy:
          schema: { const: no-referrer }
        Vary:
          schema: { const: 'Origin, Cookie' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/OlistProblem' }
    OlistThrottled:
      description: Limite local de requests ou quota compartilhada do provedor; não repetir automaticamente.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OlistBoundaryError' }
        application/problem+json:
          schema: { $ref: '#/components/schemas/OlistProblem' }
    N8nProblem:
      description: Erro compatível em application/problem+json sem eco de PII
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/N8nProblem' }
    InvalidRequest:
      description: Entrada inválida sem eco de dados recebidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidCredentials:
      description: Credenciais inválidas, sem indicar se a conta existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Origem, CSRF, sessão ou autorização inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Pessoa alvo da mudança de capacidade não encontrada
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Chave idempotente divergente ou bootstrap já consumido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Throttled:
      description: Bloqueio progressivo ativo
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Dependência de autenticação ou persistência indisponível
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    OrderNotFound:
      description: Pedido inexistente (ORDER_NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrderError' }
    OrderConflict:
      description: >-
        Versão desatualizada (VERSION_CONFLICT), impressão de pedido pendente
        (ORDER_NOT_CONFIRMED), edição ou reabertura fora do status permitido
        ou chave idempotente divergente
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: '#/components/schemas/OrderError' }
              - { $ref: '#/components/schemas/Error' }
    OrderUnprocessable:
      description: >-
        Pedido não confirmável (ORDER_NOT_CONFIRMABLE com fields), valor em
        formato inválido (INVALID_AMOUNT), grade inválida (INVALID_GRADE com
        index) ou data inválida ou futura (INVALID_DATE com fields)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrderError' }
