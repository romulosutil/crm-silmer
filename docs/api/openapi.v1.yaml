      properties:
        contact:
          type: object
          additionalProperties: false
          required: [id, label, displayName, phone, email, version]
          properties:
            id: { type: string }
            label: { type: string }
            displayName: { type: string }
            phone: { type: string }
            email: { type: [string, 'null'] }
            version: { type: integer, minimum: 1 }
    ContactDetail:
      type: object
      additionalProperties: false
      required: [contact, identities, conversations, deals, activeDealCount]
      properties:
        contact: { $ref: '#/components/schemas/ContactView' }
        identities:
          type: array
          items: { $ref: '#/components/schemas/ContactIdentityView' }
        conversations:
          type: array
          items: { type: object }
        deals:
          type: array
          items: { type: object }
        activeDealCount: { type: integer, minimum: 0 }
    ContactRegistration:
      type: object
      additionalProperties: false
      description: >-
        ADR 047. Cadastro opcional, cifrado em repouso. Todos os campos são
        opcionais na escrita e voltam normalizados (documento sem máscara,
        Instagram sem @ e minúsculo, “ISENTO” e “S/N” canônicos).
      required:
        [
          personType,
          document,
          legalName,
          instagram,
          stateRegistration,
          postalCode,
          city,
          state,
          street,
          district,
          number,
          complement,
        ]
      properties:
        personType:
          { type: [string, 'null'], enum: [individual, company, null] }
        document:
          type: [string, 'null']
          description: CPF (11 dígitos) para individual ou CNPJ numérico/alfanumérico (14 posições) para company, validado por dígito verificador. Não é chave única.
        legalName: { type: [string, 'null'], minLength: 2, maxLength: 150 }
        instagram:
          type: [string, 'null']
          pattern: '^[a-z0-9._]{1,30}$'
          description: Aceita @handle, handle ou URL do perfil na escrita.
        stateRegistration:
          type: [string, 'null']
          description: ISENTO ou 2 a 18 caracteres [0-9A-Z] sem pontuação. Obrigatória para company no cadastro completo.
        postalCode: { type: [string, 'null'], pattern: '^\d{8}$' }
        city: { type: [string, 'null'], maxLength: 80 }
        state:
          type: [string, 'null']
          enum:
            [
              AC,
              AL,
              AM,
              AP,
              BA,
              CE,
              DF,
              ES,
              GO,
              MA,
              MG,
              MS,
              MT,
              PA,
              PB,
              PE,
              PI,
              PR,
              RJ,
              RN,
              RO,
              RR,
              RS,
              SC,
              SE,
              SP,
              TO,
              null,
            ]
        street: { type: [string, 'null'], maxLength: 150 }
        district: { type: [string, 'null'], maxLength: 80 }
        number:
          { type: [string, 'null'], maxLength: 10, description: Aceita S/N. }
        complement: { type: [string, 'null'], maxLength: 80 }
    ContactRegistrationUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, registration]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        registration:
          type: object
          additionalProperties: false
          description: Os mesmos 12 campos de ContactRegistration, todos opcionais.
          properties:
            personType: { type: [string, 'null'] }
            document: { type: [string, 'null'] }
            legalName: { type: [string, 'null'] }
            instagram: { type: [string, 'null'] }
            stateRegistration: { type: [string, 'null'] }
            postalCode: { type: [string, 'null'] }
            city: { type: [string, 'null'] }
            state: { type: [string, 'null'] }
            street: { type: [string, 'null'] }
            district: { type: [string, 'null'] }
            number: { type: [string, 'null'] }
            complement: { type: [string, 'null'] }
    ContactRegistrationResponse:
      type: object
      additionalProperties: false
      required: [contact]
      properties:
        contact:
          type: object
          additionalProperties: false
          required: [id, version, registration, registrationStatus]
          properties:
            id: { type: string }
            version: { type: integer, minimum: 1 }
            registration: { $ref: '#/components/schemas/ContactRegistration' }
            registrationStatus: { type: string, enum: [complete, incomplete] }
    ContactRegistrationError:
