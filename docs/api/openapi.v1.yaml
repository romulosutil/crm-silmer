openapi: 3.1.0
info:
  title: CRM Silmer API
  version: 1.0.0
  description: Contratos versionados de identidade e domínio do CRM Silmer.
servers:
  - url: /api/v1
paths:
  /api/health/operations:
    servers: [{ url: / }]
    get:
      operationId: readOperationalHealth
      summary: Snapshot operacional público sem acesso ao banco por request
      description: >-
        OPSH-01–05 / ADR 060. Amostragem interna a cada 60 segundos; snapshot
        vence após 120 segundos. Não usar para restart de containers ou
        readiness de roteamento. Não comprova saúde de provedores externos.
      security: []
      responses:
        '200':
          description: Worker, fila e comandos saudáveis; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, checkedAt, checks]
                properties:
                  status: { enum: [ok] }
                  checkedAt: { type: string, format: date-time }
                  checks:
                    type: object
                    additionalProperties: false
                    required: [worker, queue, commands]
                    properties:
                      worker: { enum: [ok, degraded] }
                      queue: { enum: [ok, degraded] }
                      commands: { enum: [ok, degraded] }
        '503':
          description: Sinal degradado ou snapshot ausente, falho ou vencido; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { enum: [degraded, unavailable] }
                  checkedAt: { type: string, format: date-time }
                  checks:
                    type: object
                    additionalProperties: false
                    required: [worker, queue, commands]
                    properties:
                      worker: { enum: [ok, degraded] }
                      queue: { enum: [ok, degraded] }
                      commands: { enum: [ok, degraded] }
  /orders/{orderId}/billing:
    $ref: './order-billing.v1.json#/paths/~1orders~1{orderId}~1billing'
  /orders/{orderId}/billing/plan:
    $ref: './order-billing.v1.json#/paths/~1orders~1{orderId}~1billing~1plan'
  /orders/{orderId}/billing/charges:
    $ref: './order-billing.v1.json#/paths/~1orders~1{orderId}~1billing~1charges'
  /orders/{orderId}/billing/charges/{chargeId}/refund:
    $ref: './order-billing.v1.json#/paths/~1orders~1{orderId}~1billing~1charges~1{chargeId}~1refund'
  /orders/{orderId}/billing/reconcile:
    $ref: './order-billing.v1.json#/paths/~1orders~1{orderId}~1billing~1reconcile'
  /integrations/n8n/billing/charges/{chargeId}/reserve:
    $ref: './order-billing.v1.json#/paths/~1integrations~1n8n~1billing~1charges~1{chargeId}~1reserve'
  /integrations/n8n/billing/charges/{chargeId}/created:
    $ref: './order-billing.v1.json#/paths/~1integrations~1n8n~1billing~1charges~1{chargeId}~1created'
  /integrations/n8n/billing/charges/{chargeId}/lookup:
    $ref: './order-billing.v1.json#/paths/~1integrations~1n8n~1billing~1charges~1{chargeId}~1lookup'
  /integrations/n8n/billing/charges/{chargeId}/payment:
    $ref: './order-billing.v1.json#/paths/~1integrations~1n8n~1billing~1charges~1{chargeId}~1payment'
  /orders/{orderId}/olist/existing/previews:
    post:
      operationId: previewExistingOlistSale
      summary: Conferir venda existente por ID para vínculo administrativo
      description: >-
        OLIST-T09. Admin ativo sem exigência de checkbox; sessão/CSRF/Origin. Somente GETs oficiais, no máximo 64. Confere comprador, pai/grade/fiscal e cada linha/total. Referência e marcadores ausentes em legado exigem bijeção inequívoca; referência divergente bloqueia. Outras condições, origem e datas continuam obrigatórias. Recibo cifrado por ator/sessão/Pedido/conta/fontes/configuração expira em 15 minutos. Não cria export, job, cadastro ou venda. Dez comandos/minuto, 270000 bytes.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [saleId]
              properties:
                saleId:
                  {
                    type: string,
                    pattern: '^[1-9][0-9]{0,15}$',
                    description: ID ERP positivo e inteiro seguro; nunca URL.,
                  }
      responses:
        '200':
          description: Conferir venda existente por ID para vínculo administrativo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OlistExistingPreview' }
        '400': { $ref: '#/components/responses/OlistFailure' }
        '401': { $ref: '#/components/responses/OlistFailure' }
        '403': { $ref: '#/components/responses/OlistFailure' }
        '404': { $ref: '#/components/responses/OlistFailure' }
        '409': { $ref: '#/components/responses/OlistFailure' }
        '422': { $ref: '#/components/responses/OlistFailure' }
        '429': { $ref: '#/components/responses/OlistThrottled' }
        '503': { $ref: '#/components/responses/OlistFailure' }
  /orders/{orderId}/olist/links:
    post:
      operationId: linkExistingOlistSale
      summary: Vincular venda existente após reconsulta
      description: >-
        Admin atual sem checkbox. Exige motivo e recibo de conferência; não recebe preços, totais, conta ou mapping arbitrários. Reconsulta remoto fora de SQL e revalida ACL/sessão/fontes/versões na transação final com snapshot/vínculos/prova/auditoria/recibo. Uma venda por Pedido/conta e um Pedido por venda/conta. Tentativa de venda iniciada não admite exceção legada. Mesma chave/corpo preserva resposta após expiração com acesso atual; divergência conflita. Motivo fica cifrado; nenhum POST ERP, edição, exclusão ou avanço de dependentes. Dez comandos/minuto, 270000 bytes.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [previewToken, reason]
              properties:
                previewToken:
                  {
                    type: string,
                    maxLength: 262144,
                    pattern: '^[A-Za-z0-9_-]+$',
                  }
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: Vincular venda existente após reconsulta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OlistExistingLinkReceipt' }
        '400': { $ref: '#/components/responses/OlistFailure' }
        '401': { $ref: '#/components/responses/OlistFailure' }
        '403': { $ref: '#/components/responses/OlistFailure' }
        '404': { $ref: '#/components/responses/OlistFailure' }
        '409': { $ref: '#/components/responses/OlistFailure' }
        '422': { $ref: '#/components/responses/OlistFailure' }
        '429': { $ref: '#/components/responses/OlistThrottled' }
        '503': { $ref: '#/components/responses/OlistFailure' }
  /orders/{orderId}/olist/reconcile:
    post:
      operationId: requestOlistReconciliation
      summary: Enfileirar leitura administrativa de uma etapa
      description: >-
        Admin atual; motivo/versionamento/idempotência. Publica apenas olist.reconcile na fila isolada olist_reconcile. Funciona com criação desligada e executor original revogado. O worker lê snapshot/request congelados, revalida administrador/época/conexão/lease e grava prova; não instancia resolvedor criador nem writers e não avança dependentes. Zero/múltiplos/divergência conservam reservas. resourceId é null somente para sale, UUID obrigatório nas demais etapas. ExpectedVersion usa versão atual do alvo no diagnóstico. Dez comandos/minuto, 270000 bytes.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [stage, resourceId, expectedVersion, reason]
              properties:
                stage: { enum: [customer, product, variation, sale] }
                resourceId: { type: [string, 'null'], format: uuid }
                expectedVersion: { type: integer, minimum: 0 }
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '202':
          description: Enfileirar leitura administrativa de uma etapa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OlistReadRequest' }
        '400': { $ref: '#/components/responses/OlistFailure' }
        '401': { $ref: '#/components/responses/OlistFailure' }
        '403': { $ref: '#/components/responses/OlistFailure' }
        '404': { $ref: '#/components/responses/OlistFailure' }
        '409': { $ref: '#/components/responses/OlistFailure' }
        '422': { $ref: '#/components/responses/OlistFailure' }
        '429': { $ref: '#/components/responses/OlistThrottled' }
        '503': { $ref: '#/components/responses/OlistFailure' }
  /orders/{orderId}/olist/administration:
    get:
      operationId: readOlistAdministration
      summary: Diagnóstico administrativo mínimo
      description: Admin atual com sessão, independente de checkbox. Trinta leituras/minuto; no-store/no-referrer. Somente IDs, versões, estados e códigos, sem motivo, snapshot, cadastro fiscal, corpo remoto ou URL ERP adivinhada.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Diagnóstico administrativo mínimo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OlistAdministration' }
        '401': { $ref: '#/components/responses/OlistFailure' }
        '403': { $ref: '#/components/responses/OlistFailure' }
        '404': { $ref: '#/components/responses/OlistFailure' }
        '409': { $ref: '#/components/responses/OlistFailure' }
        '429': { $ref: '#/components/responses/OlistThrottled' }
        '503': { $ref: '#/components/responses/OlistFailure' }
  /orders/{orderId}/olist/reconciliations/{requestId}:
    get:
      operationId: readOlistReconciliation
      summary: Consultar resultado persistido de reconciliação
      description: Admin atual com sessão, independente de checkbox. Trinta leituras/minuto; no-store/no-referrer. Somente IDs, versões, estados e códigos, sem motivo, snapshot, cadastro fiscal, corpo remoto ou URL ERP adivinhada.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/HumanReadOrigin'
        - {
            in: path,
            name: requestId,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Consultar resultado persistido de reconciliação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OlistReadRequest' }
        '401': { $ref: '#/components/responses/OlistFailure' }
        '403': { $ref: '#/components/responses/OlistFailure' }
        '404': { $ref: '#/components/responses/OlistFailure' }
        '409': { $ref: '#/components/responses/OlistFailure' }
        '429': { $ref: '#/components/responses/OlistThrottled' }
        '503': { $ref: '#/components/responses/OlistFailure' }
  /orders/{orderId}/olist/export:
    post:
      operationId: requestOlistExport
      summary: Reservar uma operação Olist com snapshot e job locais
      description: >-
        OLIST-T07 / OLIST-01–02,13–15,30,33. Humano ativo com checkbox Olist,
        incluindo Financeiro e Pedido de outro responsável/origem/status. Sessão,
        CSRF, Origin e Idempotency-Key obrigatórios. Recebe somente o recibo cifrado
        da prévia; nenhum preço, total, conta, vendedor, payload ou versão do navegador.
        Primeira inclusão revalida a prévia/fonte/configuração sob os mesmos locks
        que persistem operação, snapshot cifrado, job, evento, auditoria e recibo.
        Uma operação por Pedido/conta; chaves/prévias distintas do mesmo plano
        convergem sem duplicar jobs ou alterar o executor original. Mesma chave
        com corpo/sessão/alvo divergentes é conflito; preserve chave e token no retry.
        Replay mantém snapshot/data/resposta originais mesmo após expiração, com
        autoridade, época e gates atuais. Nova chave com mesma operação confere
        autenticidade e semântica antes de retornar o vínculo, sem novo envio.
        Sem data ERP, congela o dia de São Paulo do primeiro comando aceito.
        Não confirma nem muda pagamento/entrega do CRM. Conta permanece desabilitada
        por padrão; exige creation_enabled e ausência de recovery. Sem HTTP ERP e
        sem consumidor da fila olist nesta tarefa; despacho permanece T08.
        Resposta private/no-store; dez comandos/minuto, corpo máximo 270000 bytes.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - { in: path, name: orderId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [previewToken]
              properties:
                previewToken:
                  {
                    type: string,
                    maxLength: 262144,
                    pattern: '^[A-Za-z0-9_-]+$',
                  }
      responses:
        '202':
          description: Recibo da operação local, nova ou já aceita; não comprova despacho ERP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OlistExportCommandReceipt' }
        '400': { $ref: '#/components/responses/OlistFailure' }
        '403': { $ref: '#/components/responses/OlistFailure' }
        '404': { $ref: '#/components/responses/OlistFailure' }
        '409': { $ref: '#/components/responses/OlistFailure' }
        '429': { $ref: '#/components/responses/OlistThrottled' }
        '503': { $ref: '#/components/responses/OlistFailure' }
  /orders/{orderId}/olist/preview:
    post:
      operationId: previewOlistOrder
      summary: Conferir fonte comercial e plano de cadastros sem escrita ERP
      description: >-
        OLIST-T06 / OLIST-06–12,34–44. Humano ativo com checkbox Olist,
        inclusive Financeiro e pedido de outro responsável, com sessão/CSRF/Origin.
        Não concede edição comercial. Verifica ficha independentemente de status,
        cadastro fiscal, fontes, parâmetros centrais e centavos exatos por linha.
        GETs oficiais limitados a 64 por prévia, sem HTTP sob transação SQL.
        Nenhuma inclusão ERP, reserva, job ou snapshot de exportação é criado.
        Resposta private/no-store. Recibo opaco cifrado vinculado à sessão, conta,
        fontes/configuração/autorização e validade de 15 minutos. Não autoriza envio.
        Data ERP ausente é proposta do dia de São Paulo; T07 congelará no comando.
        Dez consultas/minuto; corpo máximo 270000 bytes. Criação continua desligada.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - { in: path, name: orderId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OlistEmptyCommand' }
      responses:
        '200':
          description: Prévia completa ou pendências explícitas, sem plano executável parcial
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OlistPreview' }
        '400': { $ref: '#/components/responses/OlistFailure' }
        '403': { $ref: '#/components/responses/OlistFailure' }
        '404': { $ref: '#/components/responses/OlistFailure' }
        '409': { $ref: '#/components/responses/OlistFailure' }
        '429': { $ref: '#/components/responses/OlistThrottled' }
        '503': { $ref: '#/components/responses/OlistFailure' }
  /orders/{orderId}/olist/preview/check:
    post:
      operationId: checkOlistPreview
      summary: Revalidar recibo de conferência sem reservar ou enviar
      description: >-
        Mesma autorização e limites da prévia. Releitura atual de todas as fontes
        locais e da sessão antes de decifrar o recibo. Expiração inclusiva em
        15 minutos, alteração ou troca de sessão/conta/pedido recusadas.
        Não consulta o ERP; T07/T22 devem conferir novamente antes de qualquer efeito.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - { in: path, name: orderId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [previewToken]
              properties:
                previewToken:
                  {
                    type: string,
                    maxLength: 262144,
                    pattern: '^[A-Za-z0-9_-]+$',
                  }
      responses:
        '200':
          description: Conferência ainda válida; criação desabilitada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [valid, creationEnabled, expiresAt]
                properties:
                  valid: { const: true }
                  creationEnabled: { const: false }
                  expiresAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/OlistFailure' }
        '403': { $ref: '#/components/responses/OlistFailure' }
        '404': { $ref: '#/components/responses/OlistFailure' }
        '409': { $ref: '#/components/responses/OlistFailure' }
        '429': { $ref: '#/components/responses/OlistThrottled' }
        '503': { $ref: '#/components/responses/OlistFailure' }
  /integrations/olist/status:
    get:
      operationId: readOlistStatus
      summary: Estado protegido da conexão Olist da empresa
      description: >-
        OLIST-T04/T19. Administrador humano ativo, independentemente do checkbox
        Olist. Não devolve documento da conta, segredos ou tokens. Criação permanece
        desativada. Resposta private, no-store, Vary Origin/Cookie e no-referrer.
        Limite de 60 consultas por minuto.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Conexão e parâmetros centrais, inclusive configuração ausente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OlistStatus' }
        '403': { $ref: '#/components/responses/OlistFailure' }
        '409': { $ref: '#/components/responses/OlistFailure' }
        '429': { $ref: '#/components/responses/OlistThrottled' }
        '503': { $ref: '#/components/responses/OlistFailure' }
  /integrations/olist/authorize:
    post:
      operationId: authorizeOlist
      summary: Iniciar autorização OAuth Olist da empresa
      description: >-
        Administrador ativo; estado aleatório de dez minutos e uso único vinculado
        à sessão, ator, aplicação e versão da conexão. Replays da chave revalidam
        autorização e não transferem o estado entre sessões. Corpo máximo 8192
        bytes; dez comandos por minuto. Não habilita usuário ou criação ERP.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OlistEmptyCommand' }
      responses:
        '200':
          description: URL oficial de autorização, sem token
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [authorizationUrl]
                properties:
                  authorizationUrl:
                    type: string
                    format: uri
                    pattern: '^https://accounts\.tiny\.com\.br/realms/tiny/protocol/openid-connect/auth\?'
        '400': { $ref: '#/components/responses/OlistFailure' }
        '403': { $ref: '#/components/responses/OlistFailure' }
        '409': { $ref: '#/components/responses/OlistFailure' }
        '429': { $ref: '#/components/responses/OlistThrottled' }
        '503': { $ref: '#/components/responses/OlistFailure' }
  /integrations/olist/complete:
    post:
      operationId: completeOlistAuthorization
      summary: Consumir o callback OAuth pela sessão que iniciou a autorização
      description: >-
        Administrador ativo, mesma sessão CRM e CSRF. O frontend remove code/state
        do endereço e histórico antes de inicializar navegação, requests ou
        telemetria. O estado é consumido uma vez; expiração, replay, reconexão e
        resposta tardia não restauram credenciais. Não requer Idempotency-Key;
        não repetir a troca de código automaticamente. Máximo 8192 bytes e dez
        comandos por minuto. Nenhum token é retornado ao navegador.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, state]
              properties:
                code:
                  {
                    type: string,
                    minLength: 1,
                    maxLength: 4096,
                    pattern: '^[^\x00-\x20\x7f]+$',
                  }
                state: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
      responses:
        '200':
          description: Conta verificada e credenciais cifradas no servidor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OlistStatus' }
        '400': { $ref: '#/components/responses/OlistFailure' }
        '403': { $ref: '#/components/responses/OlistFailure' }
        '409': { $ref: '#/components/responses/OlistFailure' }
        '429': { $ref: '#/components/responses/OlistThrottled' }
        '502': { $ref: '#/components/responses/OlistFailure' }
        '503': { $ref: '#/components/responses/OlistFailure' }
  /integrations/olist/disconnect:
    post:
      operationId: disconnectOlist
      summary: Invalidar credenciais e autorizações Olist pendentes no CRM
      description: >-
        Administrador ativo; compara a versão da conexão e invalida gerações
        anteriores. Preserva recursos, vendas, histórico e reconciliação; não
        cancela nem exclui registros ERP. Máximo 8192 bytes e dez comandos/minuto.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OlistVersionCommand' }
      responses:
        '200':
          description: Estado desconectado persistido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OlistStatus' }
        '400': { $ref: '#/components/responses/OlistFailure' }
        '403': { $ref: '#/components/responses/OlistFailure' }
        '409': { $ref: '#/components/responses/OlistFailure' }
        '429': { $ref: '#/components/responses/OlistThrottled' }
        '503': { $ref: '#/components/responses/OlistFailure' }
  /integrations/olist/settings:
    post:
      operationId: updateOlistSettings
      summary: Substituir os parâmetros comerciais centrais da conta Olist
      description: >-
        Administrador ativo; expectedVersion compara settingsVersion, distinto
        da versão da conexão. Todos os campos são explícitos e anuláveis; não
        inferir vendedor ERP do responsável CRM. Parâmetros cifrados, versão e
        auditoria na mesma transação. Máximo 8192 bytes e dez comandos/minuto.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, reason, settings]
              properties:
                expectedVersion: { type: integer, minimum: 0 }
                reason: { type: string, minLength: 1, maxLength: 500 }
                settings: { $ref: '#/components/schemas/OlistSettings' }
      responses:
        '200':
          description: Estado e nova settingsVersion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OlistStatus' }
        '400': { $ref: '#/components/responses/OlistFailure' }
        '403': { $ref: '#/components/responses/OlistFailure' }
        '409': { $ref: '#/components/responses/OlistFailure' }
        '429': { $ref: '#/components/responses/OlistThrottled' }
        '503': { $ref: '#/components/responses/OlistFailure' }
  /integrations/olist/order-lookup:
    post:
      operationId: lookupOlistOrder
      summary: Localizar pedido exato pela projeção mínima Olist
      description: >-
        Usuário humano ativo com olistEnabled, inclusive Financeiro e pedido de
        outro responsável/origem/status. Admin sem checkbox não passa. Não
        concede Inbox, lista geral, cadastro completo ou edição comercial.
        Busca exata por número CRM ou UUID; quinze consultas/minuto e corpo
        máximo 8192 bytes. Não consulta nem cria entidades remotas nesta fase.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query:
                  type: string
                  maxLength: 64
                  description: Número NN-CRM completo ou UUID; espaços externos são aparados.
                  pattern: '^\s*(?:[0-9]{2,15}-[Cc][Rr][Mm]|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12})\s*$'
      responses:
        '200':
          description: Projeção mínima, sem conteúdo do atendimento ou cadastro
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OlistOrderProjection' }
        '400': { $ref: '#/components/responses/OlistFailure' }
        '403': { $ref: '#/components/responses/OlistFailure' }
        '404': { $ref: '#/components/responses/OlistFailure' }
        '429': { $ref: '#/components/responses/OlistThrottled' }
        '503': { $ref: '#/components/responses/OlistFailure' }
  /integrations/olist/lookups:
    post:
      operationId: lookupOlistCommercialCatalog
      summary: Consultar candidatos de parâmetros comerciais da conta Olist
      description: >-
        Administrador ativo. Catálogo fechado, host oficial e enumeração limitada
        e completa; ausência não é inferida de páginas truncadas. Quota compartilhada
        entre processos; não aceita URL, conta, filtros ou payload ERP arbitrários.
        Máximo 8192 bytes e dez comandos/minuto. Somente leitura no provedor.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind:
                  {
                    enum:
                      [
                        sellers,
                        warehouses,
                        paymentMethods,
                        receivingMethods,
                        priceLists,
                      ],
                  }
      responses:
        '200':
          description: Identificadores e nomes necessários à configuração
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 250
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, name]
                      properties:
                        id:
                          {
                            type: integer,
                            minimum: 1,
                            maximum: 9007199254740991,
                          }
                        name: { type: string, minLength: 1, maxLength: 120 }
        '400': { $ref: '#/components/responses/OlistFailure' }
        '403': { $ref: '#/components/responses/OlistFailure' }
        '409': { $ref: '#/components/responses/OlistFailure' }
        '429': { $ref: '#/components/responses/OlistThrottled' }
        '502': { $ref: '#/components/responses/OlistFailure' }
        '503': { $ref: '#/components/responses/OlistFailure' }
  /integrations/olist/mappings:
    post:
      operationId: readOlistMapping
      summary: Consultar vínculo mínimo de um recurso da conta Olist
      description: >-
        Administrador ativo; consulta apenas vínculo existente da conta configurada.
        Não cria, altera ou remove vínculos, nem devolve identidade fiscal, assinatura
        comercial, snapshots ou respostas remotas. Dez consultas/minuto, 8192 bytes.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [resourceId]
              properties:
                resourceId: { type: string, format: uuid }
      responses:
        '200':
          description: Identidade interna, tipo, estado e identificador remoto
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, kind, state, remoteId]
                properties:
                  id: { type: string, format: uuid }
                  kind: { enum: [customer, product, variation] }
                  state:
                    {
                      enum: [pending, reserved, confirmed, uncertain, rejected],
                    }
                  remoteId:
                    { type: [string, 'null'], pattern: '^[1-9][0-9]{0,18}$' }
        '400': { $ref: '#/components/responses/OlistFailure' }
        '403': { $ref: '#/components/responses/OlistFailure' }
        '404': { $ref: '#/components/responses/OlistFailure' }
        '429': { $ref: '#/components/responses/OlistThrottled' }
        '503': { $ref: '#/components/responses/OlistFailure' }
  /orders/{orderId}/olist:
    get:
      operationId: readOrderOlistProjection
      summary: Consultar estado mínimo da operação Olist de um pedido
      description: >-
        Habilitação Olist ativa permite ler pedido de qualquer responsável ou
        origem, inclusive Financeiro. Leitura comercial já autorizada também
        permite esta projeção mínima, sem conceder geração. Autorizações atuais
        são revalidadas; não devolve dados fiscais, conversa ou ficha. Trinta
        consultas/minuto. Não há rota pública de criação ERP nesta fase.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Estado persistido e geração desativada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OlistOrderProjection' }
        '403': { $ref: '#/components/responses/OlistFailure' }
        '404': { $ref: '#/components/responses/OlistFailure' }
        '429': { $ref: '#/components/responses/OlistThrottled' }
        '503': { $ref: '#/components/responses/OlistFailure' }
  /inbox/conversations/{conversationId}/order-assistance:
    get:
      operationId: readConversationOrderAssistance
      summary: Sugestões internas e decisões de abertura de pedido
      description: OA-01–12 / ADR 056. Leitura autorizada; conteúdo mínimo cifrado no CRM.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Sugestões, decisões humanas em evaluations, analysisHistory, versões e blockedReason
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Conversa não encontrada }
  /inbox/conversations/{conversationId}/order-assistance/decisions:
    post:
      operationId: decideOrderAssistance
      summary: Criar pedido após confirmação do cliente, adiar, recusar ou marcar omissão
      description: >-
        Responsável humano ou administrador. Decisão, criação pendente e
        auditoria na mesma transação. Nenhum envio ao cliente. Revisões,
        epoch e alvo são revalidados; retry da chave não duplica pedido.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  decision,
                  reason,
                  expectedConversationVersion,
                  expectedSourceRevision,
                ]
              properties:
                decision: { enum: [accept, defer, reject, missed] }
                reason:
                  {
                    enum:
                      [
                        ready,
                        not_ready,
                        withdrawn,
                        unsupported,
                        wrong_product,
                        other,
                      ],
                  }
                suggestionId: { type: string }
                sourceMessageId:
                  {
                    type: string,
                    description: Mensagem cliente exigida para missed,
                  }
                expectedVersion:
                  {
                    type: integer,
                    minimum: 0,
                    description: Versão da sugestão; exigida salvo missed,
                  }
                expectedConversationVersion: { type: integer, minimum: 0 }
                expectedSourceRevision: { type: integer, minimum: 0 }
      responses:
        '200':
          { description: Decisão persistida e pedido pendente quando aceito }
        '400': { description: Comando ou evidência inválidos }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /inbox/order-assistance/metrics:
    get:
      operationId: readOrderAssistanceMetrics
      summary: Avaliação administrativa das sugestões e omissões anotadas
      description: Agregados sem PII; criação manual sem sugestão não equivale a omissão comprovada.
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        '200':
          {
            description: Contagens de análise,
            falhas,
            sugestões,
            decisões,
            omissões e tempos,
          }
        '403': { $ref: '#/components/responses/Forbidden' }
  /conversations/{conversationId}/shipping-quotes:
    post:
      operationId: quoteConversationShipping
      summary: Consulta frete para Assunto e Pedido explícitos no atendimento humano
      description: >-
        T139 / MEVQ-01–08. Apenas responsável humano ativo ou administrador.
        Confere vínculo e versão antes e depois do cálculo. Peso e medidas são
        explícitos; não muda total/status nem compra ou envia. Replays usam a
        mesma chave e revalidam o acesso. Dados persistidos são cifrados.
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  subjectId,
                  orderId,
                  orderVersion,
                  fromPostalCode,
                  toPostalCode,
                  weightGrams,
                  widthCm,
                  heightCm,
                  lengthCm,
                  insuranceValueCents,
                ]
              properties:
                subjectId: { type: string }
                orderId: { type: string }
                orderVersion: { type: integer, minimum: 1 }
                fromPostalCode: { type: string }
                toPostalCode: { type: string }
                weightGrams: { type: integer, minimum: 1 }
                widthCm: { type: integer, minimum: 1 }
                heightCm: { type: integer, minimum: 1 }
                lengthCm: { type: integer, minimum: 1 }
                insuranceValueCents: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Resultado do provedor cifrado e vinculado ao alvo; selecionar serviço separadamente
          content:
            application/json:
              schema:
                {
                  $ref: '#/components/schemas/ConversationShippingQuoteResponse',
                }
        '400': { description: Entrada ou chave idempotente inválida }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Conversa ou pedido não encontrado }
        '409':
          {
            description: Alvo/versão mudou,
            atendimento não humano,
            replay divergente ou conexão exige reconexão,
          }
        '422': { description: Embalagem ou CEP inválido }
        '429': { $ref: '#/components/responses/Throttled' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /conversations/{conversationId}/shipping-quotes/{quoteId}/select:
    post:
      operationId: selectConversationShippingService
      summary: Vincula um serviço retornado como frete estimado do pedido
      description: Aceita somente ID de serviço retornado pelo provedor; o navegador não define o preço.
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string }
        - name: quoteId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subjectId, orderId, orderVersion, serviceId]
              properties:
                subjectId: { type: string }
                orderId: { type: string }
                orderVersion: { type: integer, minimum: 1 }
                serviceId: { type: integer }
      responses:
        '200':
          description: Estimativa selecionada com origem e instante, separada do valor comercial
          content:
            application/json:
              schema:
                {
                  $ref: '#/components/schemas/ConversationShippingQuoteResponse',
                }
        '400': { description: Entrada ou chave idempotente inválida }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Alvo ou cotação não encontrado }
        '409':
          { description: Alvo, versão ou seleção mudou; exige nova consulta }
        '422': { description: Serviço não pertence ao resultado }
        '429': { $ref: '#/components/responses/Throttled' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /orders/{orderId}/shipping-quote:
    get:
      operationId: readOrderShippingQuote
      summary: Consulta a estimativa selecionada com autorização de leitura do pedido
      security:
        - sessionCookie: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Última estimativa selecionada ou quote null; stale indica versão/consulta superada
          content:
            application/json:
              schema:
                {
                  $ref: '#/components/schemas/ConversationShippingQuoteResponse',
                }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /bootstrap/identity:
    post:
      operationId: bootstrapIdentity
      summary: Cria o único Admin inicial
      parameters:
        - $ref: '#/components/parameters/BootstrapToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '201':
          description: Admin criado uma única vez
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users:
    get:
      operationId: listUsers
      summary: Lista todas as contas, inclusive as desativadas
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: Contas do CRM
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createUser
      summary: Cria uma conta com perfil Vendedor, Financeiro ou Administrador
      description: >-
        A senha em claro nunca retorna no corpo da resposta; o bloco de
        entrega é montado no cliente a partir do que foi digitado.
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{userId}:
    delete:
      operationId: deleteUser
      summary: Exclui permanentemente uma conta sem histórico operacional
      description: >-
        Contas com COMMERCIAL_ADMIN nunca podem ser excluídas. Se a conta tiver
        histórico operacional, a API responde 409 USER_HAS_HISTORY; nesse caso,
        a desativação é o caminho disponível.
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: Conta excluída ou replay idempotente
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [deleted]
                properties:
                  deleted: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    patch:
      operationId: updateUser
      summary: Altera nome, e-mail, senha ou perfil de uma conta
      description: >-
        Todo campo é opcional e pelo menos um deve vir. Um campo ausente
        permanece inalterado. Trocar a senha não revoga sessões abertas.
        Trocar accessType remove capacidades anteriores e revoga sessões.
        Admin não pode trocar seu próprio perfil; histórico é preservado.
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Conta atualizada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{userId}/{state}:
    post:
      operationId: setUserDisabled
      summary: Desativa ou reativa uma conta
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/UserId'
        - name: state
          in: path
          required: true
          schema: { type: string, enum: [disable, enable] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: Situação da conta alterada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sessions:
    post:
      operationId: createSession
      summary: Autentica sem enumerar contas e cria cookies separados
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessão criada; nenhum token integra o corpo
          headers:
            Set-Cookie:
              description: crm_session HttpOnly e crm_csrf legível pelo cliente
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/Throttled' }
  /sessions/current:
    get:
      operationId: getCurrentSession
      summary: Retorna o usuário da sessão e toca a expiração ociosa
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Sessão atual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionView' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
    delete:
      operationId: deleteCurrentSession
      summary: Revoga a sessão atual
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204': { description: Sessão revogada e cookies expirados }
        '403': { $ref: '#/components/responses/Forbidden' }
  /capabilities/{change}:
    post:
      operationId: changeCapability
      summary: Concede ou revoga capacidade e audita a mudança
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - name: change
          in: path
          required: true
          schema: { type: string, enum: [grant, revoke] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityRequest'
      responses:
        '200':
          description: Mudança confirmada
          content:
            application/json:
              schema:
                type: object
                required: [changed]
                properties:
                  changed: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /inbox/conversations:
    get:
      operationId: listInboxConversations
      summary: Lista o backlog operacional de conversas
      description: >-
        Projeção paginada e minimizada. Cursores são assinados e vinculados aos
        filtros para impedir troca silenciosa de escopo.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - {
            name: state,
            in: query,
            schema: { $ref: '#/components/schemas/ConversationState' },
          }
        - {
            name: channel,
            in: query,
            schema: { $ref: '#/components/schemas/Channel' },
          }
        - {
            name: automationState,
            in: query,
            schema: { type: string, enum: [assistant, human] },
          }
        - {
            name: assignedUserId,
            in: query,
            schema: { type: string, minLength: 1, maxLength: 128 },
          }
        - name: unassignedHumanHandoff
          in: query
          schema: { type: boolean, default: false }
          description: >-
            Quando true, retorna somente conversas em modo humano com
            handoff pendente e sem responsável atribuído.
        - name: pendingHandoff
          in: query
          schema: { type: boolean }
          description: >-
            Estado "Aguardando vendedor". Quando true, retorna só conversas
            com handoff pendente, ordenadas pelo tempo parado (a espera mais
            antiga primeiro); quando false, só conversas sem handoff pendente.
            Combina com os demais filtros.
        - name: sort
          in: query
          schema: { type: string, enum: [urgency] }
          description: >-
            PCX-17 / INBOX-UX-05. Ordena todo o universo filtrado por prioridade
            operacional antes de LIMIT, sem restringir ao responsável da sessão.
            Falha/incerteza, transferência urgente aguardando ação, espera humana,
            pedido pronto, demais humanas, agente e terminais; posição mais antiga
            e ID desempatarão. Não infere prazos por texto livre. Cursor assinado
            vincula ordem, filtros e ator; trocar escopo exige nova primeira página.
            Sem sort, preserva a ordem anterior e as filas pessoais workQueue.
        - name: workQueue
          in: query
          schema: { type: string, enum: [attention, closing] }
          description: >-
            Fila pessoal vinculada ao ator da sessão. attention inclui handoff
            sem dono e ações humanas pendentes do próprio vendedor; closing
            inclui um pedido pendente não teste validado para revisão, com
            alvo explícito em reviewOrder, direto ou vinculado por Assunto.
            Exclui outros responsáveis e conversas terminais/arquivadas.
            Filtro, total e ordem por maior espera são aplicados antes de LIMIT;
            o cursor assinado também é vinculado ao ator.
        - name: bucket
          in: query
          schema: { $ref: '#/components/schemas/InboxBucket' }
          description: >-
            INBOX-VEZ-01 / RFC 052. Aba por "de quem é a vez": cada conversa
            aberta (não arquivada, sem terminal_at e fora de convertida_em_lead,
            sem_lead e encerrada) pertence a exatamente uma. Precedência:
            falha ou resultado incerto de envio depois da última saída
            efetiva (respond, na frente), perda ativa (lost), handoff pendente
            (respond), cliente escreveu por último (respond; awaiting se o
            agente está sozinho e a mensagem tem menos de ASSISTANT_STALL_MINUTES),
            vez do cliente há 72 h ou mais (silent, salvo lembrete próprio ativo),
            demais (awaiting). Só resposta humana, ou do agente em conversa com
            o agente, muda a vez; aviso automático e mensagem de sistema não.
            Ordem calculada no SQL antes de LIMIT: respond por falha primeiro e
            maior espera; awaiting e lost, mais recente primeiro; silent, silêncio
            mais antigo primeiro. O cursor é vinculado a ator, aba, owner,
            orderReady e assignedUserId. Não combina com workQueue, sort,
            archived=true, state, terminal, channel, pendingHandoff,
            unassignedHumanHandoff e automationState (400 INVALID_FILTER).
        - name: owner
          in: query
          schema: { type: string, enum: [all, mine, unassigned], default: all }
          description: >-
            Responsável. mine = assigned_user_id do ator da sessão; unassigned =
            sem responsável. Vale para abas, archived=true e terminal=true.
            Com assignedUserId exige owner=all (senão 400 INVALID_FILTER).
        - name: orderReady
          in: query
          schema: { type: boolean }
          description: >-
            Só com bucket: restringe a conversas com pedido pronto para revisão
            (reviewOrder presente). Sem bucket, true é 400 INVALID_FILTER.
        - name: terminal
          in: query
          schema: { type: boolean }
          description: >-
            D7. Quando true, "Encerradas": conversas não arquivadas em estado
            terminal (convertida_em_lead, sem_lead, encerrada) ou com
            terminal_at, na ordem padrão. Não combina com bucket, workQueue,
            state nem archived=true.
        - {
            name: archived,
            in: query,
            schema: { type: boolean, default: false },
            description: 'Quando true, retorna somente conversas arquivadas.',
          }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        '200':
          description: Página de conversas, sem envelopes cifrados ou payload bruto
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
            Vary: { schema: { type: string, const: 'Origin, Cookie' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /inbox/conversations/{conversationId}:
    get:
      operationId: getInboxConversation
      summary: Retorna uma conversa e seu histórico persistido
      description: >-
        INBOX-VEZ-01. A conversa traz os mesmos campos da vez da lista (bucket,
        turnSince, turnBusinessMinutes, turnAsOf, assistantStalled, lostOutcome
        e reminder), calculados para o usuário da sessão, que decide o lembrete
        próprio e a aba.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Conversa, mensagens e sugestão pendente minimizadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxConversationDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /inbox/conversations/{conversationId}/handoff:
    get:
      operationId: getInboxConversationHandoff
      summary: Retorna o handoff aberto da conversa com o resumo
      description: >-
        INBOX-HANDOFF-01 / AGT-03. Handoff pendente ou aceito da conversa, com
        o resumo que o agente gravou (Ficha, Atenção, Dica, perguntas do
        cliente). Exige handoff.read; o resumo é decifrado somente depois da
        autorização e a resposta é private, no-store. handoff é null quando a
        conversa não tem handoff aberto.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Handoff aberto da conversa, ou null
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [handoff]
                properties:
                  handoff:
                    oneOf:
                      - type: 'null'
                      - type: object
                        additionalProperties: false
                        required:
                          [id, status, version, reasonCode, summary, createdAt]
                        properties:
                          id: { type: string }
                          status: { type: string, enum: [pending, accepted] }
                          version: { type: integer, minimum: 1 }
                          reasonCode: { type: string }
                          summary: { type: string, maxLength: 8192 }
                          createdAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /inbox/conversations/{conversationId}/subjects:
    get:
      operationId: listConversationSubjects
      summary: Lista assuntos, vínculos de mensagens e pedidos do contato
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/HumanReadOrigin'
        - name: order
          in: query
          required: false
          description: Trecho literal do número do pedido para filtrar os primeiros 100 resultados
          schema: { type: string, maxLength: 40 }
      responses:
        '200':
          description: Assuntos da conversa e até 100 pedidos do contato filtrados por número
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSubjects' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createConversationSubject
      summary: Abre assunto sem pedido ou ligado a pedido do mesmo contato
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConversationSubject' }
      responses:
        '201':
          description: Assunto criado; atual só quando select não é false
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /inbox/conversations/{conversationId}/subjects/{subjectId}/select:
    post:
      operationId: selectConversationSubject
      summary: Define o assunto atual pela decisão do vendedor
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - {
            name: subjectId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200': { description: Seleção auditada }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /inbox/conversations/{conversationId}/messages/{messageId}/subjects:
    put:
      operationId: assignMessageSubjects
      summary: Substitui os vínculos de assuntos de uma mensagem
      description: >-
        A decisão humana, inclusive lista vazia, substitui vínculos humanos ou
        do agente e resolve a revisão pendente da mensagem, sem resolver o
        handoff nem devolver a Conversa ao bot. Turnos posteriores do agente
        não sobrescrevem essa decisão.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - {
            name: messageId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subjectIds]
              properties:
                subjectIds:
                  type: array
                  maxItems: 20
                  uniqueItems: true
                  items: { type: string }
      responses:
        '200': { description: Vínculos auditados }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /inbox/buckets:
    get:
      operationId: getInboxBuckets
      summary: Conta as conversas abertas de cada aba da Caixa de Entrada
      description: >-
        INBOX-VEZ-01. Ação conversation.read. As quatro contagens saem de um
        único SELECT (uma avaliação da aba, um snapshot), com a mesma regra da
        lista, e batem com o totalCount de cada aba para os mesmos filtros.
        owner, orderReady e assignedUserId valem como na lista (owner só
        combina com assignedUserId quando for all). Resposta privada.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - name: owner
          in: query
          schema: { type: string, enum: [all, mine, unassigned], default: all }
        - name: orderReady
          in: query
          schema: { type: boolean }
        - {
            name: assignedUserId,
            in: query,
            schema: { type: string, minLength: 1, maxLength: 128 },
          }
      responses:
        '200':
          description: Contagens por aba
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
            Vary: { schema: { type: string, const: 'Origin, Cookie' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxBuckets' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /inbox/summary:
    get:
      operationId: getInboxSummary
      summary: Retorna a fila do leitor e a saúde do atendimento
      description: >-
        Ação conversation.read. Contagens e instantes calculados no relógio do
        servidor, sem conteúdo de mensagem nem dado do contato: handoffs
        esperando vendedor (e os fora do SLA), as conversas abertas do próprio
        leitor e a saúde do assistente. Conversas arquivadas ou encerradas
        ficam fora. Não aceita parâmetros: a fila é sempre a da sessão.
        `unanswered` (PNL-06) só é lido para quem tem COMMERCIAL_ADMIN; para os
        demais é sempre nulo e a consulta não roda.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Resumo da fila
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxSummary' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /inbox/handoffs:
    get:
      operationId: listOpenHandoffs
      summary: Lista handoffs humanos pendentes
      description: >-
        Projeção paginada e minimizada para a fila de atendimento. O resumo é
        decifrado somente depois da autorização do operador autenticado.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        '200':
          description: Página de handoffs pendentes, sem envelopes cifrados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoffPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /contacts:
    get:
      operationId: listContacts
      summary: Lista contatos canônicos e suas identidades por canal
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - {
            name: q,
            in: query,
            description: Busca textual por nome. Telefones devem ser enviados em POST /contacts/search para não entrarem em URLs e logs.,
            schema: { type: string, minLength: 1, maxLength: 120 },
          }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        '200':
          description: Página de contatos, sem envelopes cifrados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createManualContact
      summary: Cadastra cliente com telefone obrigatório sem vincular identidade de canal não verificada
      description: Ação contact.create. A mesma chave de idempotência retorna o contato original.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualContactCreateRequest' }
      responses:
        '200':
          description: Repetição idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactCreateResponse' }
        '201':
          description: Cliente criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactCreateResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /contacts/search:
    post:
      operationId: searchContactsPrivate
      summary: Busca interna de contatos por nome ou telefone completo
      description: Exige sessão humana, capacidade contact.read, Origin e CSRF. Números declarados no chat do site são candidatos não verificados; resultados duplicados exigem escolha humana. A resposta não pode ser armazenada em cache.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [q]
              properties:
                q: { type: string, minLength: 1, maxLength: 120 }
                cursor: { type: string, maxLength: 1024 }
                limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Página de candidatos, incluindo origem do telefone; não confirma identidade nem une contatos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { description: Limite temporário de buscas privadas excedido }
  /contacts/{contactId}:
    get:
      operationId: getContact
      summary: Retorna contato, identidades e histórico associado
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ContactId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Histórico operacional minimizado do contato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /contacts/{contactId}/details:
    post:
      operationId: completeContactDetails
      summary: Completa telefone de cadastro legado antes de novo pedido manual
      description: Ação contact.rename. Telefone digitado não associa identidade de canal.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ContactId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, expectedVersion]
              properties:
                phone: { type: string }
                email: { type: string, format: email, maxLength: 254 }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Detalhes atualizados ou replay da mesma chave
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactCreateResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /contacts/{contactId}/registration:
    put:
      operationId: replaceContactRegistration
      summary: Substitui o cadastro completo opcional do contato (CP-25..27, ADR 047)
      description: >-
        Ação contact.rename. Substitui o cadastro inteiro; campos ausentes,
        nulos ou vazios ficam nulos. Exige versão esperada e Idempotency-Key:
        a mesma chave com o mesmo conteúdo devolve o mesmo resultado e com
        outro conteúdo responde 409 IDEMPOTENCY_KEY_REUSED. Os valores ficam
        cifrados; auditoria contact.registration.updated e evento de domínio
        carregam apenas o id do contato. Celular e e-mail seguem em
        /contacts/{contactId}/details.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ContactId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: '#/components/schemas/ContactRegistrationUpdateRequest' }
      responses:
        '200':
          description: Cadastro substituído ou replay da mesma chave
          headers:
            Cache-Control:
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/ContactRegistrationResponse' }
        '400':
          description: >-
            Corpo inválido (INVALID_REQUEST) ou primeiro campo inválido na
            ordem do formulário, com o nome do campo e sem eco do valor
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ContactRegistrationError' }
                  - { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Versão desatualizada (CONTACT_CONFLICT) ou chave idempotente reutilizada com outro conteúdo (IDEMPOTENCY_KEY_REUSED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /postal-codes/lookup:
    post:
      operationId: lookupPostalCode
      summary: Sugere endereço para um CEP consultando o ViaCEP pela API (CP-28, ADR 047)
      description: >-
        Ação contact.read com sessão, Origin e CSRF, como a busca privada de
        contatos. O CEP vai no corpo para não ficar em URLs nem em logs de
        acesso do proxy. Somente o CEP sai do CRM, com tempo limite de 3
        segundos. A sugestão é editável. CEP inexistente responde 404
        POSTAL_CODE_NOT_FOUND e falha, tempo esgotado ou resposta inesperada
        do ViaCEP responde 503 POSTAL_CODE_UNAVAILABLE; em ambos o
        preenchimento manual continua disponível.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [postalCode]
              properties:
                postalCode: { type: string, pattern: '^\d{5}-?\d{3}$' }
      responses:
        '200':
          description: Sugestão de endereço; campos vazios no ViaCEP vêm nulos
          headers:
            Cache-Control:
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostalCodeSuggestion' }
        '400':
          description: CEP fora do formato (INVALID_POSTAL_CODE) ou corpo inválido (INVALID_REQUEST)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: CEP inexistente (POSTAL_CODE_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { description: Limite temporário de consultas de CEP excedido }
        '503':
          description: ViaCEP indisponível (POSTAL_CODE_UNAVAILABLE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /events:
    get:
      operationId: streamInboxEvents
      summary: Reproduz eventos autorizados de atendimento e Pedidos em ordem durável
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - {
            name: topic,
            in: query,
            required: false,
            schema: { type: string, const: inbox },
          }
        - { name: after, in: query, schema: { type: integer, minimum: 0 } }
        - {
            name: Last-Event-ID,
            in: header,
            schema: { type: integer, minimum: 0 },
          }
      responses:
        '200':
          description: >-
            text/event-stream privado, sem cache. topic é opcional e aceita somente inbox.
            Emite inbox.contact.changed, inbox.conversation.changed,
            inbox.order.changed, identity.user.changed e stream.reset;
            session.expired encerra acesso revogado. Heartbeat a cada 15 segundos.
            Last-Event-ID tem precedência sobre after; cursor não negativo e inteiro seguro.
            Payloads minimizados não transportam PII, prompts ou segredos.
          content:
            text/event-stream: { schema: { type: string } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          description: Limite de aberturas por origem ou de streams simultâneos excedido
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 } }
  /site-chat/messages:
    options:
      operationId: preflightSiteChatMessages
      summary: Preflight do widget do chat Silmer
      parameters:
        - name: Origin
          in: header
          required: true
          schema:
            {
              type: string,
              enum: [https://silmer.com.br, https://www.silmer.com.br],
            }
      responses:
        '204': { description: Origem permitida }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: readSiteChatMessages
      summary: Consulta mensagens de uma única sessão aleatória do chat do site
      description: >-
        O UUIDv4 da sessão é o segredo de acesso. Não consulta pelo telefone
        informado nem revela conversas de outras sessões. Retorna no máximo
        100 mensagens de texto recebidas ou enviadas, sem cache.
      parameters:
        - name: Origin
          in: header
          required: true
          schema:
            {
              type: string,
              enum: [https://silmer.com.br, https://www.silmer.com.br],
            }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [session_id]
              properties:
                session_id: { type: string, format: uuid }
      responses:
        '200':
          description: Mensagens dessa sessão, inclusive respostas humanas da caixa de entrada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [messages]
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, direction, sender, text, occurred_at]
                      properties:
                        id: { type: string, format: uuid }
                        direction: { type: string, enum: [inbound, outbound] }
                        sender: { type: string }
                        text: { type: string }
                        occurred_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { description: Limite de consultas da sessão excedido }
  /integrations/n8n/messages/inbound:
    post:
      operationId: receiveN8nInboundMessage
      summary: Persiste uma mensagem recebida pelo n8n e devolve o contexto oficial
      security: [{ automationBasic: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/WorkflowKey'
        - $ref: '#/components/parameters/WorkflowVersion'
        - $ref: '#/components/parameters/ExecutionId'
