        createdAt: { type: [string, 'null'], format: date-time }
        disabledAt: { type: [string, 'null'], format: date-time }
        olistEnabled:
          type: boolean
          default: false
          readOnly: true
          description: Habilitação ortogonal ao perfil; Admin não herda geração Olist.
        olistAuthorizationVersion:
          type: integer
          minimum: 0
          readOnly: true
          description: Revisão monotônica da habilitação, revalidada em sessões e operações.
        capabilities:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Capability' }
        canDelete:
          type: boolean
          description: Indica se a conta não possui histórico operacional e pode ser excluída.
    Capability:
      type: string
      enum: [COMMERCIAL_ADMIN]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
    SessionView:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
    BootstrapRequest:
      type: object
      additionalProperties: false
      required: [email, name, password, reason]
      properties:
        email: { type: string, format: email }
        name: { type: string, minLength: 1, maxLength: 120 }
        functionName: { type: string, enum: [Vendedor] }
        password: { type: string, minLength: 1 }
        reason: { type: string, minLength: 1 }
    BootstrapResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, name, password, reason]
      properties:
        email: { type: string, format: email }
        name: { type: string, minLength: 1, maxLength: 120 }
        password: { type: string, minLength: 1 }
        reason: { type: string, minLength: 1 }
        accessType:
          type: string
          enum: [seller, finance, admin]
          default: seller
          description: Admin é Vendedor + COMMERCIAL_ADMIN; Financeiro sem capacidade.
        olistEnabled:
          type: boolean
          default: false
          description: Somente administrador habilita; não concede edição comercial ou gestão ERP.
    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [reason]
      minProperties: 2
      dependentRequired:
        olistEnabled: [expectedOlistAuthorizationVersion]
        expectedOlistAuthorizationVersion: [olistEnabled]
      properties:
        email: { type: string, format: email }
        name: { type: string, minLength: 1, maxLength: 120 }
        password: { type: string, minLength: 1 }
        reason: { type: string, minLength: 1 }
        accessType: { type: string, enum: [seller, finance, admin] }
        olistEnabled:
          type: boolean
          description: Outro administrador deve habilitar o próprio administrador; autodesabilitação é permitida. Alteração versionada e auditada, efetiva nas sessões/jobs atuais.
        expectedOlistAuthorizationVersion:
          type: integer
          minimum: 0
          description: Obrigatória sempre que olistEnabled é enviado; divergência retorna VERSION_CONFLICT.
    CapabilityRequest:
      type: object
      additionalProperties: false
      required: [targetId, capability, reason]
      properties:
        targetId: { type: string, minLength: 1 }
        capability: { $ref: '#/components/schemas/Capability' }
        reason: { type: string, minLength: 1 }
    ConversationConversionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        automationEpoch:
          type: integer
          minimum: 0
          description: >-
            Obrigatório para AUTOMATION_EXECUTOR e rejeitado se estiver obsoleto
            ou se uma pessoa tiver assumido a conversa. Omitido por humanos.
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1 }
    ConversationConversionResponse:
      type: object
      additionalProperties: false
      required: [contact, conversation, deal]
      properties:
        contact:
          type: object
          additionalProperties: false
          required: [id, provisional, version]
          properties:
            id: { type: string }
            provisional: { type: boolean, const: false }
            version: { type: integer, minimum: 1 }
        conversation:
          type: object
          required: [id, state, terminalAt, version]
          properties:
            id: { type: string }
            state: { type: string, const: convertida_em_lead }
            terminalAt: { type: string, format: date-time }
            version: { type: integer, minimum: 2 }
        deal:
          type: object
          additionalProperties: false
          required: [id, contactId, sourceConversationId, stage, version]
          properties:
            id: { type: string }
            contactId: { type: string }
            sourceConversationId: { type: string }
            stage: { type: string, const: produto }
            version: { type: integer, const: 1 }
    DealTransitionRequest:
      type: object
      additionalProperties: false
      required: [direction, expectedVersion, reason]
      properties:
        direction: { type: string, enum: [advance, retreat] }
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1 }
        conversationId:
          type: string
          minLength: 1
          description: Obrigatório e exclusivo para AUTOMATION_EXECUTOR.
        automationEpoch:
          type: integer
          minimum: 0
          description: Obrigatório e exclusivo para AUTOMATION_EXECUTOR.
    DealLossRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason:
          type: string
          minLength: 1
          description: Motivo sensível cifrado antes da persistência.
    DealFieldsPatchRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, fields, reasonCode]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reasonCode:
          type: string
          enum:
            [
              customer_update,
              correction,
              qualification_review,
              automation_extraction,
            ]
        reasonDetail:
          type: string
          minLength: 1
          maxLength: 2048
          description: Detalhe sensível cifrado; eventos e auditoria recebem somente código e hash.
        conversationId: { type: string, minLength: 1 }
        automationEpoch: { type: integer, minimum: 0 }
        fields:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            order:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                customer: { type: string, minLength: 1 }
                name: { type: string, minLength: 1 }
                commercialIntent: { type: boolean, const: true }
            items:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/DealItemFields' }
            artwork: { $ref: '#/components/schemas/DealArtworkFields' }
            logistics: { $ref: '#/components/schemas/DealLogisticsFields' }
            observations:
              type: array
              items: { type: string, minLength: 1 }
            assessments:
              type: array
              items: { $ref: '#/components/schemas/FieldAssessment' }
    DealItemFields:
      type: object
      additionalProperties: false
      required: [id]
      minProperties: 2
      properties:
        id: { type: string, minLength: 1 }
        operation: { type: string, enum: [upsert, remove] }
        catalogVersionId: { type: string, minLength: 1 }
        productCode: { type: string, minLength: 1 }
        modelCode: { type: string, minLength: 1 }
        estimatedQuantity: { type: integer, minimum: 1 }
        fabrics:
          type: array
          items: { type: string, minLength: 1 }
        colors:
          type: object
          additionalProperties: false
          properties:
            front: { type: string, minLength: 1 }
            back: { type: string, minLength: 1 }
            rightSleeve: { type: string, minLength: 1 }
            leftSleeve: { type: string, minLength: 1 }
            collarTrim: { type: string, minLength: 1 }
            sleeveTrim: { type: string, minLength: 1 }
        grade:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [size, quantity]
            properties:
              size: { type: string, minLength: 1 }
              quantity: { type: integer, minimum: 1 }
              duplicateSizeReason: { type: string, minLength: 1 }
    DealArtworkFields:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status:
          {
            type: string,
            enum:
              [ready, customer_will_send, silmer_will_create, not_applicable],
          }
        catalogVersionId: { type: string, minLength: 1 }
        responsibility: { type: string, minLength: 1 }
        techniqueCode: { type: string, minLength: 1 }
        locations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id: { type: string, minLength: 1 }
              name: { type: string, minLength: 1 }
        files:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [attachmentId, itemId, locationId]
            properties:
              attachmentId:
                type: object
                additionalProperties: false
                required: [messageId, transientMediaId]
                properties:
                  messageId: { type: string, minLength: 1, maxLength: 64 }
                  transientMediaId:
                    { type: string, minLength: 1, maxLength: 64 }
              itemId: { type: string, minLength: 1 }
              locationId: { type: string, minLength: 1 }
        colors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [locationId, values]
            properties:
              locationId: { type: string, minLength: 1 }
              values:
                type: array
                minItems: 1
                items: { type: string, minLength: 1 }
    DealLogisticsFields:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        desiredDate: { type: string, format: date }
        purpose: { type: string, minLength: 1 }
        purchaseProfile: { type: string, minLength: 1 }
        mode: { type: string, enum: [delivery, pickup] }
        city: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        pickupLocation: { type: string, minLength: 1 }
    FieldAssessment:
      type: object
      additionalProperties: false
      required: [field, status]
      properties:
        field: { type: string, minLength: 1 }
        status:
          {
            type: string,
            enum: [preenchido, nao_aplicavel, pendente, divergente],
          }
        reason: { type: string, minLength: 1 }
    DealFieldsPatchResponse:
      type: object
      additionalProperties: false
      required: [deal, readiness, totalQuantity]
      properties:
        deal:
          { $ref: '#/components/schemas/DealCommandResponse/properties/deal' }
        readiness:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required: [complete, blockers]
            properties:
              complete: { type: boolean }
              blockers: { type: array, items: { type: string } }
              nextPendingField: { type: string }
        totalQuantity:
          type: integer
          minimum: 0
          description: Soma derivada das quantidades estimadas de todos os itens.
    DealCommandResponse:
      type: object
      additionalProperties: false
      required: [deal]
      properties:
        deal:
          type: object
          additionalProperties: true
          required: [id, stage, status, version]
          properties:
            id: { type: string }
            stage:
              type: string
              enum: [produto, especificacao, estampa, logistica, fechamento]
            status: { type: string, enum: [active, lost] }
            version: { type: integer, minimum: 2 }
        gate:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [dealId, fromStage, version, blockers, evaluatedAt]
              properties:
                dealId: { type: string }
                fromStage:
                  type: string
                  enum: [produto, especificacao, estampa, logistica]
                version: { type: integer, minimum: 1 }
                blockers:
                  type: array
                  maxItems: 0
                evaluatedAt: { type: string, format: date-time }
    DealAssignmentRequest:
      type: object
      additionalProperties: false
      required: [assignedUserId, expectedDealVersion, reasonCode]
      properties:
        assignedUserId: { type: string, minLength: 1 }
        expectedDealVersion: { type: integer, minimum: 1 }
        reasonCode: { type: string, enum: [manual_assignment] }
    TaskCreateRequest:
      type: object
      additionalProperties: false
      required:
        [assignedUserId, dueAt, expectedDealVersion, reasonCode, text, type]
      properties:
        assignedUserId: { type: string, minLength: 1 }
        dueAt: { type: string, format: date-time }
        expectedDealVersion: { type: integer, minimum: 1 }
        reasonCode: { type: string, enum: [manual_follow_up] }
        text: { type: string, minLength: 1, maxLength: 4096 }
        type: { type: string, const: follow_up }
    TaskActionRequest:
      type: object
      additionalProperties: false
      required: [expectedTaskVersion, reasonCode]
      properties:
        expectedTaskVersion: { type: integer, minimum: 1 }
        reasonCode:
          { type: string, enum: [task_started, task_completed, task_cancelled] }
    HandoffCreateRequest:
      type: object
      additionalProperties: false
      required:
        [
          assignedUserId,
          conversationId,
          expectedConversationVersion,
          expectedDealVersion,
          reasonCode,
          summary,
        ]
      properties:
        assignedUserId: { type: string, minLength: 1 }
        conversationId: { type: string, minLength: 1 }
        expectedConversationVersion: { type: integer, minimum: 1 }
        expectedDealVersion: { type: integer, minimum: 1 }
        reasonCode:
          type: string
          enum:
            [
              customer_requested_human,
              price_before_quote,
              unresolved_blocker,
              low_confidence,
            ]
        summary: { type: string, minLength: 1, maxLength: 8192 }
        automationEpoch: { type: integer, minimum: 0 }
        automationContext:
          type: object
          additionalProperties: false
          required: [executionId, workflowKey, workflowVersion]
          properties:
            executionId: { type: string, minLength: 1 }
            workflowKey: { type: string, minLength: 1 }
            workflowVersion: { type: string, minLength: 1 }
    HandoffActionRequest:
      type: object
      additionalProperties: false
      required:
        [
          expectedConversationVersion,
          expectedDealVersion,
          expectedHandoffVersion,
          expectedTaskVersion,
          reasonCode,
        ]
      properties:
        assignedUserId:
          type: string
          minLength: 1
          description: Obrigatório somente em transfer.
        expectedConversationVersion: { type: integer, minimum: 1 }
        expectedDealVersion: { type: integer, minimum: 1 }
        expectedHandoffVersion: { type: integer, minimum: 1 }
        expectedTaskVersion: { type: integer, minimum: 1 }
        reasonCode:
          {
            type: string,
            enum: [handoff_accepted, manual_transfer, handoff_resolved],
          }
    OrderStatus:
      type: string
      enum: [pendente, confirmado]
    PaymentCondition:
      type: string
      enum: [pix, cartao_credito, cartao_debito]
    OrderSection:
      type: string
      enum: [summary, items, observations, artwork, size-pricing]
    OrderActorRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    FichaGradeLine:
      type: object
      additionalProperties: false
      required: [tamanho, quantidade]
      properties:
        tamanho: { type: string, minLength: 1 }
        quantidade: { type: integer, minimum: 1 }
    FichaItem:
      type: object
      additionalProperties: false
      description: >-
        Item da ficha (ADRs 016, 020 e 022). Principais, na ordem da tela: tipo
        (Tipo de roupa), cor, quantidade (soma da grade; nunca enviada),
        tipo_servico (Aplicação: silk, DTF, sublimação, bordado… ou Sem
        estampa), malhas (Modelo de malha), grade (Tamanhos) e gola (Gola).
        Opcionais e sem bloquear (ADR 025): publico (masculino, feminino,
        infantil, unissex ou vazio) e quantidade_informada (referência do que
        o cliente disse; não entra no total). O bot pode
        preencher uma aplicação vazia; é obrigatória para confirmar, mas pode
        ficar vazia enquanto pendente. Adicionais, que não bloqueiam: estampa
        (Estampa (referência)), cores do tecido por parte e vies_mangas; modelo
        e vies_gola são legados. Mangas e viés aceitam NAO APLICAVEL. Um item pode ser
        salvo incompleto (malhas e grade vazias, textos em branco). O servidor
        devolve todos os campos de texto, com vazio para os omitidos. Textos
        com até 200 caracteres; até 50 itens.
      required: [tipo, malhas, grade]
      properties:
        tipo: { type: string, maxLength: 200 }
        tipo_servico: { type: string, maxLength: 200 }
        cor: { type: string, maxLength: 200 }
        estampa: { type: string, maxLength: 200 }
        malhas:
          type: array
          items: { type: string, minLength: 1, maxLength: 200 }
        grade:
          type: array
          items: { $ref: '#/components/schemas/FichaGradeLine' }
        gola: { type: string, maxLength: 200 }
        modelo: { type: string, maxLength: 200 }
        cor_frente: { type: string, maxLength: 200 }
        cor_costas: { type: string, maxLength: 200 }
        cor_manga_direita: { type: string, maxLength: 200 }
        cor_manga_esquerda: { type: string, maxLength: 200 }
        vies_gola: { type: string, maxLength: 200 }
        vies_mangas: { type: string, maxLength: 200 }
        publico:
          type: string
          enum: ['', masculino, feminino, infantil, unissex]
        quantidade_informada:
          type: [integer, 'null']
          minimum: 1
          maximum: 100000
    FichaArtwork:
      type: object
      additionalProperties: false
      description: >-
        Quem faz a arte do pedido (ADR 020): o cliente envia, a Silmer cria
        (podem coexistir) ou sem estampa (exclusivo). Confirmar exige uma
        marcação. O bot preenche quando o pedido ainda não tem marcação; o
        vendedor corrige. O armazenamento dos arquivos está preparado, sem
        upload ativo; files permanece vazio até haver storage durável.
      required: [feito_pelo_cliente, feito_pela_silmer, sem_estampa, files]
      properties:
        feito_pelo_cliente: { type: boolean }
        feito_pela_silmer: { type: boolean }
        sem_estampa: { type: boolean }
        files:
          type: array
          readOnly: true
          maxItems: 0
          items: { type: object }
    FichaArtworkInput:
      type: object
      additionalProperties: false
      description: >-
        Quem faz a arte, marcado pelo vendedor. Não aceita arquivos ou
        metadados de arquivo. feito_pelo_cliente e feito_pela_silmer são
        exigidos e podem coincidir; sem_estampa é opcional (falso quando
        omitido) e recusado junto de uma das outras com 400.
      required: [feito_pelo_cliente, feito_pela_silmer]
      properties:
        feito_pelo_cliente: { type: boolean }
        feito_pela_silmer: { type: boolean }
        sem_estampa: { type: boolean }
    FichaSummary:
      type: object
      additionalProperties: false
      required: [cliente, data_entrega_confirmada, aplicacao, nome]
      properties:
        cliente:
          type: string
          readOnly: true
          description: Vem do contato da conversa e não é editável no pedido.
        data_entrega_confirmada: { type: [string, 'null'] }
        aplicacao:
          type: [string, 'null']
          description: >-
            Campo geral legado (antes "Técnica", ADR 020); não é mais escrito,
            editado nem impresso a partir da v5. A Aplicação fica em cada item
            (tipo_servico).
        nome: { type: [string, 'null'] }
    FichaSummaryInput:
      type: object
      additionalProperties: false
      description: >-
        Resumo editável; o cliente vem do contato e não é enviado. aplicacao
        de uma tela antiga é aceita e ignorada (ADR 020).
      required: [data_entrega_confirmada, nome]
      properties:
        data_entrega_confirmada: { type: [string, 'null'] }
        aplicacao: { type: [string, 'null'], deprecated: true }
        nome: { type: [string, 'null'] }
    FichaObservations:
      type: array
      maxItems: 5
      items: { type: string }
    Ficha:
      type: object
      additionalProperties: false
      required: [summary, items, observations, artwork, serviceData]
      properties:
        sizePricing:
          type: array
          maxItems: 50
          readOnly: true
          description: Composição opcional T20b, alinhada aos itens; sem rateio legado.
          items: { $ref: '#/components/schemas/SizePricingGroup' }
        loja:
          $ref: '#/components/schemas/StoreFicha'
        summary: { $ref: '#/components/schemas/FichaSummary' }
        items:
          type: array
          items: { $ref: '#/components/schemas/FichaItem' }
        observations: { $ref: '#/components/schemas/FichaObservations' }
        artwork: { $ref: '#/components/schemas/FichaArtwork' }
        serviceData:
          type: object
          additionalProperties: true
          readOnly: true
          description: >-
            Dados do atendimento vindos da pré-ficha (arte, locais, logística,
            finalidade, perfil de compra). Só leitura; não saem na ficha
            impressa.
    Order:
      type: object
      additionalProperties: false
      required:
        [
          id,
          number,
          conversationId,
          status,
          effectiveStatus,
          cancelledAt,
          cancelledBy,
          cancellationReason,
          fabCode,
          ficha,
          totalPieces,
          missingFields,
          lastMessage,
          finalAmountCents,
          paymentCondition,
          orderDate,
          confirmedAt,
          confirmedBy,
          reopenedAt,
          reopenedBy,
          firstContactAt,
          paidOn,
          deliveredOn,
          seller,
          version,
          createdAt,
          updatedAt,
          origin,
          isTest,
          locked,
          olistLocked,
          olistConfirmationAllowed,
          storeNumber,
          leadTimeBusinessDays,
          gatewayPayment,
          fichaFirstPrintedAt,
          fichaFirstPrintedBy,
        ]
      properties:
        id: { type: string }
        number: { type: string, pattern: '^[0-9]{2,}-CRM$' }
        conversationId:
          type: [string, 'null']
          description: Nulo em pedidos manuais de atendimento e da loja do site.
        origin: { $ref: '#/components/schemas/OrderOrigin' }
        isTest:
          type: boolean
          description: >-
            Pedido da loja recebido com `teste: true`; fica fora do Dashboard.
        locked:
          type: boolean
          description: >-
            Pedido da loja: escritas comerciais usuais são recusadas
            (409 ORDER_LOCKED); cancelamento local usa comando dedicado por Admin.
            Pedido cancelado também fica locked e é terminal (409 ORDER_CANCELLED).
        olistLocked:
          type: boolean
          description: >-
            Trava comercial Olist considerando operações e efeitos de todas as
            contas, independente da habilitação do leitor. Não concede acesso ERP.
        olistConfirmationAllowed:
          type: boolean
          description: >-
            Exceção somente para confirmar pendente ativo sem mudar conteúdo:
            todas as travas Olist devem estar confirmed ou linked. Não permite
            editar ou reabrir e não altera a autorização comercial da API.
        storeNumber:
          type: [string, 'null']
          pattern: '^LJ-[0-9A-F]{8}$'
          description: >-
            Pedido da loja (ADR 028): LJ- e os 8 primeiros hexadecimais do
            pedido_id do site.
        leadTimeBusinessDays:
          type: [integer, 'null']
          minimum: 0
          description: >-
            Pedido da loja: prazo da cor em dias úteis (0 é pronta entrega).
        gatewayPayment:
          oneOf:
            - { $ref: '#/components/schemas/GatewayPayment' }
            - { type: 'null' }
        fichaFirstPrintedAt:
          type: [string, 'null']
          format: date-time
          description: >-
            Pedido da loja (ADRs 031 e 036): quando uma pessoa imprimiu o HTML
            ou gerou o PDF da ficha pela primeira vez. Nulo enquanto ninguém
            acessou a ficha e em todo pedido do atendimento.
        fichaFirstPrintedBy:
          description: Quem acessou a ficha pela primeira vez (ADRs 031 e 036).
          oneOf:
            - { $ref: '#/components/schemas/OrderActorRef' }
            - { type: 'null' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        effectiveStatus:
          type: string
          enum: [pendente, confirmado, cancelado]
          description: Situação efetiva; cancelado sobrepõe o status comercial preservado.
        cancelledAt: { type: [string, 'null'], format: date-time }
        cancelledBy:
          oneOf:
            - { $ref: '#/components/schemas/OrderActorRef' }
            - { type: 'null' }
        cancellationReason:
          type: [string, 'null']
          maxLength: 1000
          description: Motivo autorizado na consulta comercial; armazenado cifrado e ausente de logs/eventos.
        fabCode: { type: string }
        ficha: { $ref: '#/components/schemas/Ficha' }
        pricing:
          $ref: '#/components/schemas/SizePricingSummary'
          readOnly: true
          description: Presente em composição T21 ou legado com suplemento fresco e completo.
        totalPieces: { type: integer, minimum: 0 }
        missingFields:
          type: array
          description: >-
            O que ainda impede gerar o pedido pendente (ADRs 016 e 020),
            nesta ordem: items (nenhum item); items[N].tipo, items[N].cor,
            items[N].tipo_servico (aplicação), items[N].malhas, items[N].grade e
            items[N].gola (ponto principal que falta no item N, a partir de 0;
            a grade vale também pela quantidade); artwork (ninguém marcou
            quem faz a arte nem sem estampa);
            summary.data_entrega_confirmada (previsão de entrega ausente ou fora
            do formato AAAA-MM-DD); finalAmount; e paymentCondition. Vazio em
            pedido confirmado. Os adicionais do item, o resto do resumo e as
            outras datas do lastro (paidOn, deliveredOn) nunca aparecem aqui:
            por enquanto, gerar subentende o pagamento feito.
          items: { type: string }
        lastMessage:
          description: >-
            Metadados da última mensagem da conversa, sem conteúdo ou dados
            do contato. Nulo quando a conversa ainda não tem mensagens.
          oneOf:
            - { $ref: '#/components/schemas/OrderLastMessage' }
            - { type: 'null' }
        finalAmountCents: { type: [integer, 'null'], minimum: 1 }
        paymentCondition:
          oneOf:
            - { $ref: '#/components/schemas/PaymentCondition' }
            - { type: 'null' }
        orderDate: { type: [string, 'null'], format: date }
        confirmedAt: { type: [string, 'null'], format: date-time }
        confirmedBy:
          oneOf:
            - { $ref: '#/components/schemas/OrderActorRef' }
            - { type: 'null' }
        reopenedAt: { type: [string, 'null'], format: date-time }
        reopenedBy:
          oneOf:
            - { $ref: '#/components/schemas/OrderActorRef' }
            - { type: 'null' }
        firstContactAt:
          type: [string, 'null']
          format: date-time
          description: >-
            Primeiro contato: abertura da conversa que originou o pedido,
            copiada na criação. Nulo só em pedido criado durante a troca de
            versão da API.
        paidOn:
          type: [string, 'null']
          format: date
          description: >-
            Dia de recebimento integral, informado por uma pessoa; no pedido da loja, o
            dia (São Paulo) em que a InfinitePay confirmou o Pix.
        paymentReviewRequired:
          type: boolean
          description: Data manual legada fora do Financeiro até declaração explícita de quitação integral.
        deliveredOn:
          type: [string, 'null']
          format: date
          description: Dia da entrega realizada, informado por uma pessoa.
        seller:
          description: Dono atual da conversa.
          oneOf:
            - { $ref: '#/components/schemas/OrderActorRef' }
            - { type: 'null' }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderLastMessage:
      type: object
      additionalProperties: false
      required: [direction, occurredAt, deliveryStatus, status]
      properties:
        direction: { type: string, enum: [inbound, outbound] }
        occurredAt: { type: string, format: date-time }
        deliveryStatus: { type: [string, 'null'] }
        status: { type: string }
    OrdersSummary:
      type: object
      additionalProperties: false
      required:
        [
          confirmedCount,
          soldAmountCents,
          averageTicketCents,
          pendingCount,
          totalPiecesSold,
          storeNewCount,
          storeNewOldestPaidAt,
          period,
          daily,
          deliveries,
          today,
        ]
      properties:
        confirmedCount: { type: integer, minimum: 0 }
        soldAmountCents: { type: integer, minimum: 0 }
        averageTicketCents: { type: integer, minimum: 0 }
        pendingCount: { type: integer, minimum: 0 }
        totalPiecesSold: { type: integer, minimum: 0 }
        storeNewCount:
          type: integer
          minimum: 0
          description: >-
            Pedidos novos do site (ADR 031): da loja, sem teste, com a ficha
            nunca impressa.
        storeNewOldestPaidAt:
          type: [string, 'null']
          format: date-time
          description: >-
            Instante em que a InfinitePay confirmou o Pix do pedido novo do
            site mais antigo; nulo sem pedido novo.
        today: { type: string, format: date, description: Dia de São Paulo. }
        period:
          type: object
          additionalProperties: false
          required: [key, from, to, timeZone, confirmedCount, soldAmountCents]
          properties:
            key: { type: string, enum: [hoje, 7dias, mes] }
            from: { type: string, format: date }
            to: { type: string, format: date }
            timeZone: { type: string, const: America/Sao_Paulo }
            confirmedCount: { type: integer, minimum: 0 }
            soldAmountCents: { type: integer, minimum: 0 }
        daily:
          type: array
          minItems: 7
          maxItems: 7
          description: >-
            PNL-05, "Vendido por dia": sete dias de São Paulo, do mais antigo a
            hoje (o último), com os dias sem venda em zero. Mesmo universo de
            `period` (confirmados, sem teste, por dia do pedido).
          items:
            type: object
            additionalProperties: false
            required: [day, confirmedCount, soldAmountCents]
            properties:
              day: { type: string, format: date }
              confirmedCount: { type: integer, minimum: 0 }
              soldAmountCents: { type: integer, minimum: 0 }
        deliveries:
          type: object
          additionalProperties: false
          required: [overdueCount, oldestOverdueOn, dueSoonCount, dueSoonUntil]
          properties:
            overdueCount: { type: integer, minimum: 0 }
            oldestOverdueOn: { type: [string, 'null'], format: date }
            dueSoonCount: { type: integer, minimum: 0 }
            dueSoonUntil: { type: string, format: date }
    InboxSummary:
      type: object
      additionalProperties: false
      required: [generatedAt, waitingHandoff, mine, assistant, unanswered]
      properties:
        generatedAt: { type: string, format: date-time }
        unanswered:
          type: [object, 'null']
          additionalProperties: false
          required: [thresholdMinutes, count, bySeller]
          description: >-
            PNL-06: conversas abertas atribuídas a um vendedor cuja última
            mensagem é do cliente e tem `thresholdMinutes` ou mais. Nulo para
            quem não tem COMMERCIAL_ADMIN. Só ids, nomes de vendedores e
            contagens; nenhum dado do cliente.
          properties:
            thresholdMinutes: { type: integer, const: 15 }
            count: { type: integer, minimum: 0 }
            bySeller:
              type: array
              description: Maior contagem primeiro; empate pelo nome.
              items:
                type: object
                additionalProperties: false
                required: [userId, name, count]
                properties:
                  userId: { type: string }
                  name: { type: string }
                  count: { type: integer, minimum: 1 }
        waitingHandoff:
          type: object
          additionalProperties: false
          required: [count, overdueCount, oldestSince]
          properties:
            count: { type: integer, minimum: 0 }
            overdueCount:
              type: integer
              minimum: 0
              description: Handoffs pendentes além do `due_at` do próprio SLA.
            oldestSince: { type: [string, 'null'], format: date-time }
        mine:
          type: object
          additionalProperties: false
          required:
            [count, awaitingReplyCount, oldestAwaitingSince, pendingOrderCount]
          properties:
            count: { type: integer, minimum: 0 }
            pendingOrderCount:
              type: integer
              minimum: 0
              description: >-
                Pedidos pendentes do leitor: manuais de que é dono ou de
                conversas atribuídas a ele; teste fica fora.
            awaitingReplyCount:
              type: integer
              minimum: 0
              description: Conversas do leitor cuja última mensagem é do cliente.
            oldestAwaitingSince: { type: [string, 'null'], format: date-time }
        assistant:
          type: object
          additionalProperties: false
          required:
            [
              activeCount,
              stalledCount,
              stallMinutes,
              failedDeliveryCount,
              lastReplyAt,
            ]
          properties:
            activeCount: { type: integer, minimum: 0 }
            stalledCount:
              type: integer
              minimum: 0
              description: >-
                Conversas com o assistente cuja mensagem do cliente está sem
                resposta há `stallMinutes` ou mais.
            stallMinutes: { type: integer, minimum: 1 }
            failedDeliveryCount:
              type: integer
              minimum: 0
              description: Conversas com envio falho ou incerto nas últimas 24 h.
            lastReplyAt: { type: [string, 'null'], format: date-time }
    OrderFile:
      type: object
      additionalProperties: false
      required:
        [
          id,
          slot,
          name,
          extension,
          contentType,
          sizeBytes,
          thumbnail,
          uploadedAt,
          uploadedBy,
        ]
      properties:
        id: { type: string }
        slot: { type: string, enum: [reference, final] }
        name:
          type: string
          maxLength: 120
          description: Nome original sem caminho; guardado cifrado.
        extension:
          type: string
          enum:
            [
              ai,
              cdr,
              eps,
              jpeg,
              jpg,
              pdf,
              png,
              psd,
              rar,
              svg,
              tif,
              tiff,
              webp,
              zip,
            ]
        contentType: { type: string }
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
        thumbnail:
          type: boolean
          description: Há miniatura WebP em /thumbnail.
        uploadedAt: { type: string, format: date-time }
        uploadedBy: { $ref: '#/components/schemas/OrderActorRef' }
    OrderFiles:
      type: object
      additionalProperties: false
      required: [final, references, limits]
      properties:
        final:
          oneOf:
            - $ref: '#/components/schemas/OrderFile'
            - type: 'null'
        references:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/OrderFile' }
        limits:
          type: object
          additionalProperties: false
          required: [maxBytes, maxReferences]
          properties:
            maxBytes: { type: integer, const: 10485760 }
            maxReferences: { type: integer, const: 5 }
    OrderFileUpload:
      type: object
      additionalProperties: false
      required: [slot, file]
      properties:
        slot: { type: string, enum: [reference, final] }
        file: { type: string, format: binary, description: Até 10 MB. }
        thumbnail:
          type: string
          format: binary
          description: WebP de até 256 KB, só para PNG, JPEG e WebP.
    OrderResponse:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order: { $ref: '#/components/schemas/Order' }
    ConversationOrderResponse:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order:
          oneOf:
            - { $ref: '#/components/schemas/Order' }
            - { type: 'null' }
    OrderPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, counts]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        nextCursor: { type: [string, 'null'] }
        counts:
          type: object
          additionalProperties: false
          required: [pendente, confirmado]
          properties:
            pendente: { type: integer, minimum: 0 }
            confirmado: { type: integer, minimum: 0 }
    OrderCreateRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Versão atual da conversa.
    ManualOrderCreateRequest:
      type: object
      additionalProperties: false
      required: [contactId]
      properties:
        contactId: { type: string, minLength: 1, maxLength: 128 }
    SizePricingSummary:
      type: object
      additionalProperties: false
      required: [complete, totalCents, groups, issues]
      properties:
        complete: { type: boolean }
        totalCents:
          { type: [integer, 'null'], minimum: 1, maximum: 9007199254740991 }
        groups:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [id, subtotalCents]
            properties:
              id: { type: string, format: uuid }
              subtotalCents:
                {
                  type: [integer, 'null'],
                  minimum: 1,
                  maximum: 9007199254740991,
                }
        issues:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, groupId, lineId]
            properties:
              code:
                {
                  type: string,
                  enum:
                    [
                      SIZE_PRICING_EMPTY,
                      SIZE_PRICING_EMPTY_GROUP,
                      SIZE_SUBTOTAL_REQUIRED,
                      SIZE_SUBTOTAL_REVIEW_REQUIRED,
                    ],
                }
              groupId: { type: [string, 'null'], format: uuid }
              lineId: { type: [string, 'null'], format: uuid }
    SizePricingGroup:
      type: object
      additionalProperties: false
      required: [id, lines]
      properties:
        id: { type: string, format: uuid }
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, size, quantity, subtotalCents, subtotalReviewed]
            properties:
              id: { type: string, format: uuid }
              size: { type: string, minLength: 1, maxLength: 200 }
              quantity: { type: integer, minimum: 1, maximum: 2147483647 }
              subtotalCents:
                {
                  type: [integer, 'null'],
                  minimum: 1,
                  maximum: 9007199254740991,
                }
              subtotalReviewed: { type: boolean, readOnly: true }
    SizePricingCommand:
      description: >-
        Só humano com ACL comercial, versão, CSRF, Origin e idempotência.
        IDs/revisão são emitidos pelo servidor; soma de peças limitada a
        2147483647. Quantidade alterada invalida revisão e não recalcula preço.
        Fração de centavo unitário não invalida subtotal comercial CRM.
      oneOf:
        - type: object
          additionalProperties: false
          required: [action]
          properties:
            action: { const: initialize }
        - type: object
          additionalProperties: false
          required: [action, groupId, lineId, subtotalCents]
          properties:
            action: { const: review_subtotal }
            groupId: { type: string, format: uuid }
            lineId: { type: string, format: uuid }
            subtotalCents:
              { type: [integer, 'null'], minimum: 1, maximum: 9007199254740991 }
        - type: object
          additionalProperties: false
          required: [action, groupId, lineId, quantity]
          properties:
            action: { const: change_quantity }
            groupId: { type: string, format: uuid }
            lineId: { type: string, format: uuid }
            quantity: { type: integer, minimum: 1, maximum: 2147483647 }
        - type: object
          additionalProperties: false
          required: [action, groupIds]
          properties:
            action: { const: reorder_groups }
            groupIds:
              type: array
              maxItems: 50
              uniqueItems: true
              items: { type: string, format: uuid }
        - type: object
          additionalProperties: false
          required: [action, groupId]
          properties:
            action: { const: duplicate_group }
            groupId: { type: string, format: uuid }
        - type: object
          additionalProperties: false
          required: [action, item]
          properties:
            action: { const: add_group }
            item: { $ref: '#/components/schemas/FichaItem' }
        - type: object
          additionalProperties: false
          required: [action, groupId]
          properties:
            action: { const: remove_group }
            groupId: { type: string, format: uuid }
        - type: object
          additionalProperties: false
          required: [action, groupId, attributes]
          properties:
            action: { const: update_group }
            groupId: { type: string, format: uuid }
            attributes: { $ref: '#/components/schemas/SizePricingAttributes' }
        - type: object
          additionalProperties: false
          required: [action, groupId, size, quantity]
          properties:
            action: { const: add_line }
            groupId: { type: string, format: uuid }
            size: { type: string, minLength: 1, maxLength: 200 }
            quantity: { type: integer, minimum: 1, maximum: 2147483647 }
        - type: object
          additionalProperties: false
          required: [action, groupId, lineId]
          properties:
            action: { const: remove_line }
            groupId: { type: string, format: uuid }
            lineId: { type: string, format: uuid }
        - type: object
          additionalProperties: false
          required: [action, groupId, lineId, size]
          properties:
            action: { const: rename_line }
            groupId: { type: string, format: uuid }
            lineId: { type: string, format: uuid }
            size: { type: string, minLength: 1, maxLength: 200 }
        - type: object
          additionalProperties: false
          required: [action, groupId, lineIds]
          properties:
            action: { const: reorder_lines }
            groupId: { type: string, format: uuid }
            lineIds:
              type: array
              uniqueItems: true
              items: { type: string, format: uuid }
    SizePricingAttributes:
      type: object
      additionalProperties: false
      description: Atributos parciais da peça, sem grade/IDs/preços. Mudança invalida revisão das linhas.
      properties:
        tipo: { $ref: '#/components/schemas/FichaItem/properties/tipo' }
        tipo_servico:
          { $ref: '#/components/schemas/FichaItem/properties/tipo_servico' }
        cor: { $ref: '#/components/schemas/FichaItem/properties/cor' }
        estampa: { $ref: '#/components/schemas/FichaItem/properties/estampa' }
        gola: { $ref: '#/components/schemas/FichaItem/properties/gola' }
        modelo: { $ref: '#/components/schemas/FichaItem/properties/modelo' }
        cor_frente:
          { $ref: '#/components/schemas/FichaItem/properties/cor_frente' }
        cor_costas:
          { $ref: '#/components/schemas/FichaItem/properties/cor_costas' }
        cor_manga_direita:
          {
            $ref: '#/components/schemas/FichaItem/properties/cor_manga_direita',
          }
        cor_manga_esquerda:
          {
            $ref: '#/components/schemas/FichaItem/properties/cor_manga_esquerda',
          }
        vies_gola:
          { $ref: '#/components/schemas/FichaItem/properties/vies_gola' }
        vies_mangas:
          { $ref: '#/components/schemas/FichaItem/properties/vies_mangas' }
        malhas: { $ref: '#/components/schemas/FichaItem/properties/malhas' }
        publico: { $ref: '#/components/schemas/FichaItem/properties/publico' }
        quantidade_informada:
          {
            $ref: '#/components/schemas/FichaItem/properties/quantidade_informada',
          }
    OrderSectionPatchRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, value]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Versão atual do pedido.
        value:
          description: >-
            Seção inteira: FichaSummaryInput para summary, lista de FichaItem
            para items, FichaObservations para observations ou
            FichaArtworkInput para artwork; SizePricingCommand para size-pricing.
            Arquivos não são aceitos.
          oneOf:
            - { $ref: '#/components/schemas/FichaSummaryInput' }
            - type: array
              items: { $ref: '#/components/schemas/FichaItem' }
            - { $ref: '#/components/schemas/FichaObservations' }
            - { $ref: '#/components/schemas/FichaArtworkInput' }
            - { $ref: '#/components/schemas/SizePricingCommand' }
    OrderPriceBreakdownCommand:
      oneOf:
        - type: object
          additionalProperties: false
          required: [action]
          properties:
            action: { const: initialize }
        - type: object
          additionalProperties: false
          required: [action, lines]
          properties:
            action: { const: set_subtotals }
            lines:
              type: array
              description: Cobertura exata das linhas emitidas pelo servidor, sem duplicatas.
              items:
                type: object
                additionalProperties: false
                required: [groupId, lineId, subtotalCents]
                properties:
                  groupId: { type: string, format: uuid }
                  lineId: { type: string, format: uuid }
                  subtotalCents:
                    {
                      type: [integer, 'null'],
                      minimum: 1,
                      maximum: 9007199254740991,
                    }
        - type: object
          additionalProperties: false
          required: [action, deliveryOn, applications, registration]
          properties:
            action: { const: set_store_details }
            deliveryOn: { type: [string, 'null'], format: date }
