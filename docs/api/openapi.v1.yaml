        version: { type: integer, minimum: 1 }
        channel: { $ref: '#/components/schemas/Channel' }
        contact:
          type: object
          additionalProperties: false
          required: [id, label, externalId, displayHandle]
          properties:
            id: { type: string }
            label: { type: string }
            externalId: { type: string }
            displayHandle: { type: [string, 'null'] }
        assignedUser:
          {
            oneOf:
              [
                { $ref: '#/components/schemas/OperationalUserRef' },
