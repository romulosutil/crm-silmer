name: crm-silmer-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: crm_silmer
      POSTGRES_PASSWORD: crm_silmer_dev
      POSTGRES_USER: crm_silmer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_silmer -d crm_silmer"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - crm-silmer-postgres-data:/var/lib/postgresql/data

volumes:
  crm-silmer-postgres-data:
