openapi: 3.1.0
info:
  title: CRM Silmer API
  version: 1.0.0
  description: Contratos versionados de identidade e domínio do CRM Silmer.
servers:
  - url: /api/v1
paths:
  /bootstrap/identity:
    post:
      operationId: bootstrapIdentity
      summary: Cria o único Admin inicial
      parameters:
        - $ref: '#/components/parameters/BootstrapToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '201':
          description: Admin criado uma única vez
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users:
    get:
      operationId: listUsers
      summary: Lista todas as contas, inclusive as desativadas
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: Contas do CRM
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createUser
      summary: Cria uma conta de Vendedor por Admin autenticado
      description: >-
        A senha em claro nunca retorna no corpo da resposta; o bloco de
        entrega é montado no cliente a partir do que foi digitado.
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{userId}:
    delete:
      operationId: deleteUser
      summary: Exclui permanentemente uma conta sem histórico operacional
      description: >-
        Contas com COMMERCIAL_ADMIN nunca podem ser excluídas. Se a conta tiver
        histórico operacional, a API responde 409 USER_HAS_HISTORY; nesse caso,
        a desativação é o caminho disponível.
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: Conta excluída ou replay idempotente
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [deleted]
                properties:
                  deleted: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    patch:
      operationId: updateUser
      summary: Altera nome, e-mail ou senha de uma conta
      description: >-
        Todo campo é opcional e pelo menos um deve vir. Um campo ausente
        permanece inalterado. Trocar a senha não revoga sessões abertas.
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Conta atualizada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{userId}/{state}:
    post:
      operationId: setUserDisabled
      summary: Desativa ou reativa uma conta
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/UserId'
        - name: state
          in: path
          required: true
          schema: { type: string, enum: [disable, enable] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: Situação da conta alterada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sessions:
    post:
      operationId: createSession
      summary: Autentica sem enumerar contas e cria cookies separados
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessão criada; nenhum token integra o corpo
          headers:
            Set-Cookie:
              description: crm_session HttpOnly e crm_csrf legível pelo cliente
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/Throttled' }
  /sessions/current:
    get:
      operationId: getCurrentSession
      summary: Retorna o usuário da sessão e toca a expiração ociosa
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Sessão atual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionView' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
    delete:
      operationId: deleteCurrentSession
      summary: Revoga a sessão atual
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204': { description: Sessão revogada e cookies expirados }
        '403': { $ref: '#/components/responses/Forbidden' }
  /capabilities/{change}:
    post:
      operationId: changeCapability
      summary: Concede ou revoga capacidade e audita a mudança
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - name: change
          in: path
          required: true
          schema: { type: string, enum: [grant, revoke] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityRequest'
      responses:
        '200':
          description: Mudança confirmada
          content:
            application/json:
              schema:
                type: object
                required: [changed]
                properties:
                  changed: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /inbox/conversations:
    get:
      operationId: listInboxConversations
      summary: Lista o backlog operacional de conversas
      description: >-
        Projeção paginada e minimizada. Cursores são assinados e vinculados aos
        filtros para impedir troca silenciosa de escopo.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - {
            name: state,
            in: query,
            schema: { $ref: '#/components/schemas/ConversationState' },
          }
        - {
            name: channel,
            in: query,
            schema: { $ref: '#/components/schemas/Channel' },
          }
        - {
            name: automationState,
            in: query,
            schema: { type: string, enum: [assistant, human] },
          }
        - {
            name: assignedUserId,
            in: query,
            schema: { type: string, minLength: 1, maxLength: 128 },
          }
        - name: unassignedHumanHandoff
          in: query
          schema: { type: boolean, default: false }
          description: >-
            Quando true, retorna somente conversas em modo humano com
            handoff pendente e sem responsável atribuído.
        - name: pendingHandoff
          in: query
          schema: { type: boolean }
          description: >-
            Estado "Aguardando vendedor". Quando true, retorna só conversas
            com handoff pendente, ordenadas pelo tempo parado (a espera mais
            antiga primeiro); quando false, só conversas sem handoff pendente.
            Combina com os demais filtros.
        - {
            name: archived,
            in: query,
            schema: { type: boolean, default: false },
            description: 'Quando true, retorna somente conversas arquivadas.',
          }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        '200':
          description: Página de conversas, sem envelopes cifrados ou payload bruto
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
            Vary: { schema: { type: string, const: 'Origin, Cookie' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /inbox/conversations/{conversationId}:
    get:
      operationId: getInboxConversation
      summary: Retorna uma conversa e seu histórico persistido
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Conversa, mensagens e sugestão pendente minimizadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxConversationDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /inbox/handoffs:
    get:
      operationId: listOpenHandoffs
      summary: Lista handoffs humanos pendentes
      description: >-
        Projeção paginada e minimizada para a fila de atendimento. O resumo é
        decifrado somente depois da autorização do operador autenticado.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        '200':
          description: Página de handoffs pendentes, sem envelopes cifrados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoffPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /contacts:
    get:
      operationId: listContacts
      summary: Lista contatos canônicos e suas identidades por canal
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        '200':
          description: Página de contatos, sem envelopes cifrados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /contacts/{contactId}:
    get:
      operationId: getContact
      summary: Retorna contato, identidades e histórico associado
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ContactId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Histórico operacional minimizado do contato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /events:
    get:
      operationId: streamInboxEvents
      summary: Reproduz eventos autorizados de atendimento e Pedidos em ordem durável
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - {
            name: topic,
            in: query,
            required: false,
            schema: { type: string, const: inbox },
          }
        - { name: after, in: query, schema: { type: integer, minimum: 0 } }
        - {
            name: Last-Event-ID,
            in: header,
            schema: { type: integer, minimum: 0 },
          }
      responses:
        '200':
          description: >-
            text/event-stream privado, sem cache. topic é opcional e aceita somente inbox.
            Emite inbox.contact.changed, inbox.conversation.changed,
            inbox.order.changed, identity.user.changed e stream.reset;
            session.expired encerra acesso revogado. Heartbeat a cada 15 segundos.
            Last-Event-ID tem precedência sobre after; cursor não negativo e inteiro seguro.
            Payloads minimizados não transportam PII, prompts ou segredos.
          content:
            text/event-stream: { schema: { type: string } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          description: Limite de aberturas por origem ou de streams simultâneos excedido
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 } }
  /integrations/n8n/messages/inbound:
    post:
      operationId: receiveN8nInboundMessage
      summary: Persiste uma mensagem recebida pelo n8n e devolve o contexto oficial
      security: [{ automationBasic: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/WorkflowKey'
        - $ref: '#/components/parameters/WorkflowVersion'
        - $ref: '#/components/parameters/ExecutionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/N8nInboundRequest' }
      responses:
        '200':
          description: Evento aceito ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/N8nInboundResponse' }
        '400': { $ref: '#/components/responses/N8nProblem' }
        '401': { $ref: '#/components/responses/N8nProblem' }
        '403': { $ref: '#/components/responses/N8nProblem' }
        '409': { $ref: '#/components/responses/N8nProblem' }
        '422': { $ref: '#/components/responses/N8nProblem' }
        '503': { $ref: '#/components/responses/N8nProblem' }
  /integrations/n8n/conversations/{conversationId}/attachments:
    post:
      operationId: storeN8nAttachment
      summary: Valida em streaming, quarentena e publica uma mídia transitória segura
      security: [{ automationBasic: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/WorkflowKey'
        - $ref: '#/components/parameters/WorkflowVersion'
        - $ref: '#/components/parameters/ExecutionId'
        - $ref: '#/components/parameters/ContentSha256'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/N8nAttachmentRequest' }
      responses:
        '200': { description: Replay idempotente do anexo já publicado }
        '201': { description: Anexo verificado e publicado }
        '400': { $ref: '#/components/responses/N8nProblem' }
        '401': { $ref: '#/components/responses/N8nProblem' }
        '409': { $ref: '#/components/responses/N8nProblem' }
        '413': { $ref: '#/components/responses/N8nProblem' }
        '415': { $ref: '#/components/responses/N8nProblem' }
        '422': { $ref: '#/components/responses/N8nProblem' }
        '503': { $ref: '#/components/responses/N8nProblem' }
  /integrations/n8n/commands/{commandId}/media:
    get:
      operationId: readReservedN8nMedia
      summary: Read private media bound to the original active human send reservation
      description: >-
        Requires integration.n8n.command.media.read and the original workflow key,
        version and execution. Command processing, message sending, bound clean
        variant and current human/nonterminal epoch/revision are revalidated.
        preflight=true returns safe JSON without storage reads, reservation or
        renewal. Neither representation grants a new send authorization. HEAD is
        not exposed; foreign selectors and redirects are prohibited.
      security: [{ automationBasic: [] }]
      parameters:
        - name: commandId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: preflight
          in: query
          schema: { type: string, const: 'true' }
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/WorkflowKey'
        - $ref: '#/components/parameters/WorkflowVersion'
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          description: Private no-store bytes, or read-only JSON preflight
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [valid, media_id, type, sha256, mime_type, size_bytes]
                properties:
                  valid: { const: true }
                  media_id: { type: string, format: uuid }
                  type: { enum: [image, audio, video] }
                  sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
                  mime_type: { type: string }
                  size_bytes: { type: integer, minimum: 1, maximum: 16777216 }
        '400': { description: Invalid query or missing technical identity }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Reserved command not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { description: Object lost, metadata preserved }
        '503': { description: Storage or integration unavailable }
  /integrations/n8n/events:
    post:
      operationId: recordN8nEvent
      summary: Aplica evento n8n com idempotência, fencing e transação atômica
      security: [{ automationBasic: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/WorkflowKey'
        - $ref: '#/components/parameters/WorkflowVersion'
        - $ref: '#/components/parameters/ExecutionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/N8nEventRequest' }
      responses:
        '200':
          description: Evento aplicado, negado pelo fence ou reproduzido idempotentemente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/N8nEventResponse' }
        '400': { $ref: '#/components/responses/N8nProblem' }
        '401': { $ref: '#/components/responses/N8nProblem' }
        '403': { $ref: '#/components/responses/N8nProblem' }
        '409': { $ref: '#/components/responses/N8nProblem' }
        '422': { $ref: '#/components/responses/N8nProblem' }
        '503': { $ref: '#/components/responses/N8nProblem' }
  /conversations/{conversationId}/media:
    post:
      operationId: uploadChatMedia
      summary: Recebe mídia privada sem assumir o atendimento
      description: >-
        Campos kind, origin e expectedVersion precedem um único campo file.
        Arquivo vazio ou declaração inválida usa 422, excesso de bytes 413.
        Inspeção real de formato/codec ocorre no worker após 202. Replay mede
        bytes reais e declaração sem nova reserva; payload diferente ou
        recebimento ainda ativo usa 409. Upload não altera ownership ou epoch.
        Falhas usam application/problem+json com type, title, status e request_id,
        accepted=false e error.code estável (INVALID_CREDENTIALS, FORBIDDEN,
        MEDIA_CONFLICT, MEDIA_TOO_LARGE, MEDIA_INVALID, MEDIA_RATE_LIMITED ou
        SERVICE_UNAVAILABLE conforme o status).
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [kind, origin, expectedVersion, file]
              properties:
                kind: { type: string, enum: [image, audio, video] }
                origin: { type: string, enum: [attachment, recording] }
                expectedVersion: { type: integer, minimum: 1 }
                file: { type: string, format: binary }
      responses:
        '202':
          description: Upload completo enfileirado, ou replay original
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [mediaId, state, statusUrl]
                properties:
                  mediaId: { type: string, format: uuid }
                  state: { type: string, const: processing }
                  statusUrl: { type: string }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { description: Limite de bytes excedido }
        '422': { description: Declaração ou multipart inválido/vazio }
        '429': { description: Quota ou 12 admissões por sessão/minuto }
        '503': { description: Dependência indisponível ou conclusão incerta }
  /conversations/{conversationId}/media/{mediaId}/content:
    get:
      operationId: getChatMediaContent
      summary: Bytes privados da mídia retida
      description: >-
        Sessão humana e conversation.read obrigatórias. Draft somente autor/admin;
        attached segue leitura da conversa mesmo após oito dias ou encerramento.
        Aceita um único Range bytes fechado, aberto ou sufixo. Respostas usam
        Cache-Control private,no-store, X-Content-Type-Options nosniff e Accept-Ranges bytes.
        Indisponibilidade transitória não altera estado durable ou quota.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: mediaId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Range
          in: header
          schema: { type: string }
      responses:
        '200': { description: Bytes completos, Content-Length exato }
        '206': { description: Bytes parciais com Content-Range e Content-Length exatos }
        '401': { description: Sessão ausente ou inválida, sem bytes }
        '403': { description: Leitura proibida, sem bytes }
        '404': { description: Mídia não encontrada nesta conversa }
        '409': { description: Mídia ainda não validada/ready }
        '410': { description: Objeto comprovadamente perdido; quota preservada }
        '416': { description: Range inválido ou fora do objeto, Content-Range bytes */size }
        '503': { description: Storage temporariamente indisponível ou metadata divergente }
  /conversations/{conversationId}/media/{mediaId}:
    get:
      operationId: getChatMediaStatus
      summary: Estado e metadados seguros da mídia privada
      description: >-
        Rascunho somente autor ou COMMERCIAL_ADMIN; mídia vinculada segue a ACL
        de leitura da conversa. Nunca retorna object_key, URL, filename ou
        envelope. Formato inválido depois do202 usa200/state=rejected/reason=invalid_format.
        Sessão ausente/expirada/revogada/inválida401; origem, capacidade ou
        ownership negados403. Dependência indisponível503. Cache private,no-store.
      security:
        - sessionCookie: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string }
        - name: mediaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Estado atual sem chaves ou nomes originais
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [mediaId, kind, origin, state, validationStatus, mimeType, sizeBytes, durationMs]
                properties:
                  mediaId: { type: string, format: uuid }
                  kind: { type: string, enum: [image, audio, video] }
                  origin: { type: string, enum: [attachment, recording] }
                  state: { type: string, enum: [uploaded, processing, ready, attached, rejected, unavailable, lost] }
                  validationStatus: { type: string }
                  mimeType: { type: [string, 'null'] }
                  sizeBytes: { type: [integer, 'null'], minimum: 1 }
                  durationMs: { type: [integer, 'null'], minimum: 0 }
                  reason: { type: string }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Mídia ausente na conversa }
        '503': { description: Dependência indisponível }
  /conversations/{conversationId}/messages:
    post:
      operationId: sendHumanConversationMessage
      summary: Persiste a intenção humana e agenda o comando idempotente ao n8n
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HumanMessageCommand' }
      responses:
        '202': { description: Estado oficial e outbox gravados atomicamente }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /conversations/{conversationId}/{command}:
    post:
      operationId: changeConversationAutomationMode
      summary: Executa takeover ou encerramento humano
      description: >-
        A conversa com uma pessoa nunca volta para o bot (ADR 015). O comando
        `return-to-ai` foi removido: a rota não existe e responde 404, como
        qualquer rota desconhecida, antes da autenticação e sem tocar a
        conversa.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: command
          in: path
          required: true
          schema: { type: string, enum: [takeover, close] }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HumanConversationCommand' }
      responses:
        '202': { description: Estado oficial, auditoria e outbox gravados }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          {
            description: 'Comando inexistente, inclusive `return-to-ai` (ADR 015)',
          }
        '409': { $ref: '#/components/responses/Conflict' }
  /conversations/{conversationId}/archive:
    post:
      operationId: archiveConversation
      summary: Retira uma conversa ativa da Caixa de Entrada sem encerrá-la
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HumanConversationCommand' }
      responses:
        '202':
          {
            description: 'Conversa arquivada, com auditoria e atualização em tempo real',
          }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /conversations/{conversationId}/unarchive:
    post:
      operationId: unarchiveConversation
      summary: Restaura uma conversa arquivada à Caixa de Entrada
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HumanConversationCommand' }
      responses:
        '202':
          {
            description: 'Conversa desarquivada, com auditoria e atualização em tempo real',
          }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /handoffs/{handoffId}/claim:
    post:
      operationId: claimHumanHandoff
      summary: Reivindica atomicamente um handoff compatível ainda sem responsável
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - name: handoffId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandoffClaimRequest' }
      responses:
        '200': { description: Handoff atribuído à pessoa autenticada }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /orders:
    get:
      operationId: listOrders
      summary: Lista pedidos por status, com busca e paginação
      description: >-
        Ação order.read. Sem status, retorna Todos. A busca aceita número do
        pedido, cliente ou telefone e resolve cliente e telefone pelo contato da
        conversa. `counts` traz o total de cada grupo (Confirmados e Pendentes)
        para a busca atual, independentemente da página.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - {
            name: status,
            in: query,
            schema: { $ref: '#/components/schemas/OrderStatus' },
          }
        - {
            name: q,
            in: query,
            schema: { type: string, minLength: 1, maxLength: 128 },
          }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
      responses:
        '200':
          description: Página de pedidos
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /orders/summary:
    get:
      operationId: getOrdersSummary
      summary: Retorna indicadores globais dos pedidos
      description: >-
        Ação order.read. Totais de todos os pedidos, sem recorte pela página,
        busca ou status da listagem. Vendas e peças somam somente pedidos
        confirmados; pendentes são contados à parte. Valores em centavos.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Indicadores globais de pedidos
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrdersSummary' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Retorna um pedido com a ficha completa
      description: Ação order.read.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Pedido
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
  /conversations/{conversationId}/order:
    get:
      operationId: getConversationOrder
      summary: Retorna o pedido atual da conversa
      description: >-
        Ação order.read. Devolve o pedido pendente da conversa ou, se não
        houver, o último confirmado. `order` é null quando a conversa não tem
        pedido.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Pedido atual ou null
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationOrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /conversations/{conversationId}/orders:
    post:
      operationId: createConversationOrder
      summary: Cria manualmente o pedido pendente da conversa
      description: >-
        Ação order.create, restrita ao dono da conversa ou a COMMERCIAL_ADMIN.
        O pedido nasce pendente, com número NN-CRM reservado, pré-preenchido
        com a pré-ficha atual da conversa. Se a conversa já tem pedido
        pendente, responde 200 com o pedido existente.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreateRequest' }
      responses:
        '200':
          description: Pedido pendente já existente ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '201':
          description: Pedido pendente criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
  /orders/{orderId}/sections/{section}:
    patch:
      operationId: patchOrderSection
      summary: Substitui uma seção inteira da ficha de um pedido pendente
      description: >-
        Ação order.edit, restrita ao dono da conversa ou a COMMERCIAL_ADMIN.
        `value` substitui a seção inteira; total de peças e campos faltantes
        são recalculados. Pedido confirmado não aceita edição (409); é preciso
        reabrir.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - name: section
          in: path
          required: true
          schema: { $ref: '#/components/schemas/OrderSection' }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderSectionPatchRequest' }
      responses:
        '200':
          description: Seção gravada ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
        '422': { $ref: '#/components/responses/OrderUnprocessable' }
  /orders/{orderId}/confirm:
    post:
      operationId: confirmOrder
      summary: Confirma (gera) o pedido com valor final e forma de pagamento
      description: >-
        Ação order.confirm, restrita ao dono da conversa ou a COMMERCIAL_ADMIN.
        Exige valor final no formato brasileiro (ex.: 4.820,00) maior que zero,
        forma de pagamento válida (campo paymentCondition), ao menos um item e,
        em cada item, os pontos principais das ADRs 016 e 020 (tipo, cor,
        técnica em tipo_servico, ao menos um tecido, ao menos uma linha de
        tamanho e gola), quem faz a arte do pedido (chave artwork) e a entrega
        prometida do resumo como dia AAAA-MM-DD; paidOn e deliveredOn não
        bloqueiam. Recusa com 422 ORDER_NOT_CONFIRMABLE e as chaves de
        Order.missingFields que faltam. Grava valor, forma de pagamento,
        autor, horário e data do pedido. Numa nova confirmação depois
        de reabrir, autor, horário e data passam a ser os da nova confirmação.
        Confirmações concorrentes sobre a mesma versão: uma vence e a outra
        recebe 409.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderConfirmRequest' }
      responses:
        '200':
          description: Pedido confirmado ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
        '422': { $ref: '#/components/responses/OrderUnprocessable' }
  /orders/{orderId}/reopen:
    post:
      operationId: reopenOrder
      summary: Reabre um pedido confirmado
      description: >-
        Ação order.reopen, restrita ao dono da conversa ou a COMMERCIAL_ADMIN.
        Só a partir de confirmado. Volta a pendente mantendo número, valor e
        condição, registra autor e horário da reabertura e bloqueia a
        impressão.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderReopenRequest' }
      responses:
        '200':
          description: Pedido reaberto ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
  /orders/{orderId}/milestones:
    patch:
      operationId: recordOrderMilestones
      summary: Registra quando o cliente pagou e quando o pedido foi entregue
      description: >-
        Ação order.milestones, restrita ao dono da conversa ou a
        COMMERCIAL_ADMIN (ADR 008). Vale para pedido pendente ou confirmado,
        sem reabrir, e nunca muda o status nem bloqueia a confirmação. As duas
        datas vão sempre juntas; null limpa uma delas. Data inválida ou depois
        de hoje (horário de São Paulo) responde 422 INVALID_DATE com os campos
        recusados.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderMilestonesRequest' }
      responses:
        '200':
          description: Datas gravadas ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
        '422': { $ref: '#/components/responses/OrderUnprocessable' }
  /orders/{orderId}/print:
    get:
      operationId: printOrder
      summary: Retorna a ficha de pedido no template ficha-canonical-v3
      description: >-
        Ação order.print, disponível a qualquer usuário operacional. Só para
        pedido confirmado; pendente responde 409 ORDER_NOT_CONFIRMED. HTML A4
        paisagem, duas páginas, impresso pelo navegador. O documento não traz
        valor, condição de pagamento nem a faixa de amostra sintética; vendedor
        é quem confirmou, data é a data do pedido e o controle de produção sai
        em branco.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Documento HTML pronto para impressão
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
          content:
            text/html:
              schema: { type: string }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
components:
  securitySchemes:
    automationBasic:
      type: http
      scheme: basic
      description: Credencial exclusiva e rotacionável do AUTOMATION_EXECUTOR.
    sessionCookie:
      type: apiKey
      in: cookie
      name: crm_session
      description: Cookie opaco HttpOnly, Secure e SameSite=Lax.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Deve corresponder ao cookie Secure crm_csrf.
    idempotencyKey:
      type: apiKey
      in: header
      name: Idempotency-Key
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema: { type: string, format: uri }
    OriginOptional:
      name: Origin
      in: header
      required: false
      description: Obrigatório para autenticação humana; não usado pelo ator técnico.
      schema: { type: string, format: uri }
    HumanReadOrigin:
      name: Origin
      in: header
      required: false
      description: >-
        Se presente, deve pertencer à allowlist. Se ausente, o navegador deve
        enviar Sec-Fetch-Site same-origin ou none.
      schema: { type: string, format: uri }
    BootstrapToken:
      name: X-Bootstrap-Token
      in: header
      required: true
      schema: { type: string, minLength: 32 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    WorkflowKey:
      name: X-Silmer-Workflow-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    WorkflowVersion:
      name: X-Silmer-Workflow-Version
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    ExecutionId:
      name: X-Silmer-Execution-Id
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    ContentSha256:
      name: X-Silmer-Content-SHA256
      in: header
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{64}$' }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ContactId:
      name: contactId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    DealId:
      name: dealId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  schemas:
    N8nMode:
      type: string
      enum: [ai_active, handoff_pending, human_active, closed]
    N8nInboundRequest:
      type: object
      additionalProperties: false
      required:
        [
          schema_version,
          event_id,
          occurred_at,
          channel,
          contact,
          message,
          metadata,
        ]
      properties:
        schema_version: { type: string, const: '1.0' }
        event_id: { type: string, minLength: 1, maxLength: 512 }
        occurred_at: { type: string, format: date-time }
        channel: { type: string, const: whatsapp }
        contact:
          type: object
          anyOf:
            - required: [external_id]
            - required: [wa_id]
          properties:
            external_id: { type: string, minLength: 1, maxLength: 512 }
            wa_id: { type: string, minLength: 1, maxLength: 512 }
            name: { type: string, maxLength: 512 }
        message:
          type: object
          additionalProperties: true
          required: [external_id, type]
          properties:
            external_id: { type: string, minLength: 1, maxLength: 512 }
            type:
              type: string
              enum: [text, image, audio, video, document, button, interactive]
            text: { type: string, maxLength: 65536 }
        metadata:
          type: object
          additionalProperties: true
          anyOf:
            - required: [provider_account_id]
            - required: [phone_number_id]
    N8nInboundResponse:
      type: object
      additionalProperties: true
      required:
        [
          accepted,
          duplicate,
          conversation_id,
          source_revision,
          automation_epoch,
          mode,
          recent_messages,
          briefing,
        ]
      properties:
        accepted: { type: boolean, const: true }
        duplicate: { type: boolean }
        conversation_id: { type: string }
        source_revision: { type: integer, minimum: 1 }
        conversation_version: { type: integer, minimum: 1 }
        contact_id: { type: string }
        automation_epoch: { type: integer, minimum: 0 }
        mode: { $ref: '#/components/schemas/N8nMode' }
        recent_messages: { type: array, items: { type: object } }
        briefing_version: { type: integer, minimum: 0 }
        briefing:
          type: object
          additionalProperties: true
          description: Snapshot criptografado e consolidado da qualificação.
        automation_message_count:
          type: integer
          minimum: 0
          description: Mensagens do agente já reservadas nesta Conversa (ADR 009).
        automation_message_cap:
          type: integer
          minimum: 2
          description: Teto de mensagens do agente; a última vaga é do aviso de transferência.
        sellers:
          type: array
          description: Vendedores ativos, só id e primeiro nome (ADR 009).
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
    N8nAttachmentRequest:
      type: object
      additionalProperties: false
      required: [schema_version, external_id, file]
      properties:
        schema_version: { type: string, const: '1.0' }
        external_id: { type: string, minLength: 1, maxLength: 512 }
        filename: { type: string, minLength: 1, maxLength: 255 }
        mime_type: { type: string, minLength: 1, maxLength: 255 }
        file: { type: string, format: binary }
    N8nEventRequest:
      type: object
      additionalProperties: false
      required: [schema_version, event_id, event_type, occurred_at]
      properties:
        schema_version: { type: string, const: '1.0' }
        event_id: { type: string, minLength: 1, maxLength: 512 }
        event_type:
          type: string
          enum:
            [
              message.send.requested,
              message.sent,
              message.delivered,
              message.read,
              message.failed,
              message.send.unknown,
              handoff.requested,
              workflow.failed,
            ]
        occurred_at: { type: string, format: date-time }
        conversation_id: { type: [string, 'null'] }
        automation_epoch: { type: integer, minimum: 0 }
        source_revision: { type: integer, minimum: 1 }
        command_id: { type: string, maxLength: 512 }
        external_message_id: { type: string, maxLength: 512 }
        message:
          type: object
          additionalProperties: true
          description: >-
            message.send.requested humano deve reproduzir a message da outbox.
            Texto conserva o shape legado. Mídia retida usa somente media_id,
            sha256, mime_type, size_bytes, type, text e caption (null para audio),
            com filename/media_url null. Metadados vêm da chat_media vinculada,
            nunca do cliente. Aliases attachment_id/attachmentId/mediaId e URL/key
            arbitrárias são negados409. Legenda/variante/epoch/source divergentes
            não reservam. Replay retorna send_authorized=false.
          properties:
            media_id: { type: string, format: uuid }
            sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
            mime_type: { type: string }
            size_bytes: { type: integer, minimum: 1 }
            caption: { type: [string, 'null'], maxLength: 1024 }
        briefing_patch:
          type: object
          additionalProperties: false
          properties:
            artwork_locations: {}
            artwork_status: {}
            artwork_technique: {}
            briefing_status: {}
            city_or_postal_code: {}
            collar: {}
            colors: {}
            customer_name: {}
            customizations: {}
            delivery_address: {}
            delivery_mode: {}
            fabrics: {}
            needed_by: {}
            next_required_field: {}
            notes: {}
            numbers: {}
            order_name: {}
            pickup_location: {}
            product_model: {}
            product_type: {}
            purchase_profile: {}
            purpose: {}
            quantity: {}
            segment: {}
            sizes: {}
            sponsors: {}
        handoff:
          type: object
          additionalProperties: true
          properties:
            reason: { type: string }
            summary: { type: string }
            notice:
              type: object
              additionalProperties: false
              required: [command_id, text]
              description: Aviso ao cliente reservado na mesma transação do handoff (ADR 009).
              properties:
                command_id: { type: string, minLength: 1, maxLength: 512 }
                text: { type: string, minLength: 1, maxLength: 4096 }
        failure:
          type: object
          additionalProperties: true
          description: >-
            Generic workflow.failed is diagnostic only. The explicit
            phase=before_message_send requires command_id and conversation_id,
            only phase/code keys and one allowlisted code: MEDIA_DOWNLOAD_FAILED,
            MEDIA_INTEGRITY_MISMATCH, MEDIA_UPLOAD_FAILED,
            MEDIA_PREFLIGHT_REJECTED or MEDIA_PREFLIGHT_UNAVAILABLE. It concludes
            processing/sending under the original reservation execution with
            retryable=false and retry_safe=false, even after epoch invalidation.
            It cannot regress sent/delivered/read/outcome_unknown. Use only on
            branches proven to precede Meta/messages; errors after invocation
            require message.send.unknown, never this completion.
        open_order:
          type: boolean
          description: >-
            ADR 014. Só em message.send.requested e handoff.requested. Com
            true, depois de aplicar o evento o CRM cria ou reutiliza o Pedido
            pendente da conversa a partir da ficha unida e responde em
            `order`. A autorização é a do próprio evento.
    N8nEventResponse:
      type: object
      additionalProperties: true
      required: [accepted]
      properties:
        accepted: { type: boolean }
        duplicate: { type: boolean }
        send_authorized: { type: boolean }
        reason: { type: string }
        handoff_id: { type: string }
        notice:
          type: object
          description: Só envie o aviso quando send_authorized for true; replay e teto gasto devolvem false.
          properties:
            send_authorized: { type: boolean }
            command_id: { type: [string, 'null'] }
        order:
          description: >-
            ADR 014. Presente quando o evento pediu `open_order`. Uma falha
            ao abrir o Pedido não falha o evento: volta `opened: false` com o
            código, auditado no CRM.
          oneOf:
            - type: object
              additionalProperties: false
              required: [opened, id, created]
              properties:
                opened: { type: boolean, const: true }
                id: { type: string }
                created: { type: boolean }
            - type: object
              additionalProperties: false
              required: [opened, error]
              properties:
                opened: { type: boolean, const: false }
                error: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
    N8nProblem:
      type: object
      additionalProperties: false
      required:
        [type, title, status, detail, instance, accepted, error, request_id]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        accepted: { type: boolean, const: false }
        error:
          type: object
          additionalProperties: false
          required: [code]
          properties: { code: { type: string } }
        request_id: { type: string }
    HumanMessageCommand:
      type: object
      additionalProperties: false
      required: [content, expectedVersion, messageType, reason]
      properties:
        content: { type: object, additionalProperties: true }
        expectedVersion: { type: integer, minimum: 1 }
        messageType:
          { type: string, enum: [text, image, audio, video] }
        reason: { type: string, minLength: 1, maxLength: 512 }
      description: >-
        CHAT_MEDIA_ENABLED=false impede novos envios image/audio/video (403),
        preservando texto e leitura. Mídia só aceita referência canônica mediaId;
        chave, URL, filename e attachmentId arbitrários são proibidos.
      oneOf:
        - properties:
            messageType: { const: text }
        - properties:
            messageType: { enum: [image, video] }
            content:
              type: object
              additionalProperties: false
              required: [mediaId]
              properties:
                mediaId: { type: string, format: uuid }
                caption: { type: string, maxLength: 1024 }
        - properties:
            messageType: { const: audio }
            content:
              type: object
              additionalProperties: false
              required: [mediaId]
              properties:
                mediaId: { type: string, format: uuid }
    HumanConversationCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 512 }
    HandoffClaimRequest:
      type: object
      additionalProperties: false
      required: [expectedHandoffVersion, reasonCode]
      properties:
        expectedHandoffVersion: { type: integer, minimum: 1 }
        expectedConversationVersion: { type: integer, minimum: 1 }
        reasonCode: { type: string, minLength: 1, maxLength: 512 }
    Channel:
      type: string
