          }
        deal: { type: [object, 'null'] }
        handoff:
          type: [object, 'null']
          description: Handoff aberto (pendente ou aceito) da conversa.
          properties:
            id: { type: string }
            status: { type: string, enum: [pending, accepted] }
            reasonCode:
              type: string
