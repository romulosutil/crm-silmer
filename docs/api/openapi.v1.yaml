openapi: 3.1.0
info:
  title: CRM Silmer API
  version: 1.0.0
  description: Contratos versionados de identidade e domínio do CRM Silmer.
servers:
  - url: /api/v1
paths:
  /bootstrap/identity:
    post:
      operationId: bootstrapIdentity
      summary: Cria o único Admin inicial
      parameters:
        - $ref: '#/components/parameters/BootstrapToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '201':
          description: Admin criado uma única vez
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users:
    get:
      operationId: listUsers
      summary: Lista todas as contas, inclusive as desativadas
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: Contas do CRM
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createUser
      summary: Cria uma conta de Vendedor por Admin autenticado
      description: >-
        A senha em claro nunca retorna no corpo da resposta; o bloco de
        entrega é montado no cliente a partir do que foi digitado.
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{userId}:
    delete:
      operationId: deleteUser
      summary: Exclui permanentemente uma conta sem histórico operacional
      description: >-
        Contas com COMMERCIAL_ADMIN nunca podem ser excluídas. Se a conta tiver
        histórico operacional, a API responde 409 USER_HAS_HISTORY; nesse caso,
        a desativação é o caminho disponível.
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: Conta excluída ou replay idempotente
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [deleted]
                properties:
                  deleted: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    patch:
      operationId: updateUser
      summary: Altera nome, e-mail ou senha de uma conta
      description: >-
        Todo campo é opcional e pelo menos um deve vir. Um campo ausente
        permanece inalterado. Trocar a senha não revoga sessões abertas.
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Conta atualizada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{userId}/{state}:
    post:
      operationId: setUserDisabled
      summary: Desativa ou reativa uma conta
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/UserId'
        - name: state
          in: path
          required: true
          schema: { type: string, enum: [disable, enable] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: Situação da conta alterada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sessions:
    post:
      operationId: createSession
      summary: Autentica sem enumerar contas e cria cookies separados
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessão criada; nenhum token integra o corpo
          headers:
            Set-Cookie:
              description: crm_session HttpOnly e crm_csrf legível pelo cliente
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/Throttled' }
  /sessions/current:
    get:
      operationId: getCurrentSession
      summary: Retorna o usuário da sessão e toca a expiração ociosa
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Sessão atual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionView' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
    delete:
      operationId: deleteCurrentSession
      summary: Revoga a sessão atual
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204': { description: Sessão revogada e cookies expirados }
        '403': { $ref: '#/components/responses/Forbidden' }
  /capabilities/{change}:
    post:
      operationId: changeCapability
      summary: Concede ou revoga capacidade e audita a mudança
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - name: change
          in: path
          required: true
          schema: { type: string, enum: [grant, revoke] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityRequest'
      responses:
        '200':
          description: Mudança confirmada
          content:
            application/json:
              schema:
                type: object
                required: [changed]
                properties:
                  changed: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /inbox/conversations:
    get:
      operationId: listInboxConversations
      summary: Lista o backlog operacional de conversas
      description: >-
        Projeção paginada e minimizada. Cursores são assinados e vinculados aos
        filtros para impedir troca silenciosa de escopo.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - {
            name: state,
            in: query,
            schema: { $ref: '#/components/schemas/ConversationState' },
          }
        - {
            name: channel,
            in: query,
            schema: { $ref: '#/components/schemas/Channel' },
          }
        - {
            name: automationState,
            in: query,
            schema: { type: string, enum: [assistant, human] },
          }
        - {
            name: assignedUserId,
            in: query,
            schema: { type: string, minLength: 1, maxLength: 128 },
          }
        - {
            name: unassignedHumanHandoff,
            in: query,
            schema: { type: boolean, default: false },
            description: >-
              Quando true, retorna somente conversas em modo humano com
              handoff pendente e sem responsável atribuído.
          }
        - {
            name: archived,
            in: query,
            schema: { type: boolean, default: false },
            description: Quando true, retorna somente conversas arquivadas.
          }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        '200':
          description: Página de conversas, sem envelopes cifrados ou payload bruto
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
            Vary: { schema: { type: string, const: 'Origin, Cookie' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /inbox/conversations/{conversationId}:
    get:
      operationId: getInboxConversation
      summary: Retorna uma conversa e seu histórico persistido
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Conversa, mensagens e sugestão pendente minimizadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxConversationDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /inbox/handoffs:
    get:
      operationId: listOpenHandoffs
      summary: Lista handoffs humanos pendentes
      description: >-
        Projeção paginada e minimizada para a fila de atendimento. O resumo é
        decifrado somente depois da autorização do operador autenticado.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        '200':
          description: Página de handoffs pendentes, sem envelopes cifrados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoffPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /contacts:
    get:
      operationId: listContacts
      summary: Lista contatos canônicos e suas identidades por canal
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        '200':
          description: Página de contatos, sem envelopes cifrados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /contacts/{contactId}:
    get:
      operationId: getContact
      summary: Retorna contato, identidades, conversas e negócios associados
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ContactId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Histórico operacional minimizado do contato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /kanban:
    get:
      operationId: getKanban
      summary: Projeta as cinco colunas do Kanban a partir de Negócios ativos
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - {
            name: assignedUserId,
            in: query,
            schema: { type: string, minLength: 1 },
          }
        - { name: hasOverdueTask, in: query, schema: { type: boolean } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        '200':
          description: Colunas com paginação independente; Backlog não integra o Kanban
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
            Vary: { schema: { type: string, const: 'Origin, Cookie' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KanbanBoard' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /kanban/cards:
    get:
      operationId: getKanbanCards
      summary: Pagina uma etapa do Kanban por updatedAt e Deal id
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - {
            name: stage,
            in: query,
            required: true,
            schema: { $ref: '#/components/schemas/DealStage' },
          }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - {
            name: assignedUserId,
            in: query,
            schema: { type: string, minLength: 1 },
          }
        - { name: hasOverdueTask, in: query, schema: { type: boolean } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        '200':
          description: Página da coluna solicitada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KanbanColumn' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /deals/{dealId}:
    get:
      operationId: getDealDetail
      summary: Retorna detalhe operacional pseudônimo do Negócio
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/HumanReadOrigin'
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        '200':
          description: Negócio, qualificação, tarefas, gates, histórico e handoffs sem texto cifrado
          headers:
            ETag: { schema: { type: string } }
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
            Vary: { schema: { type: string, const: 'Origin, Cookie' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DealDetail' }
        '304': { description: Representação composta não mudou }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /events:
    get:
      operationId: streamKanbanEvents
      summary: Reproduz invalidações do Kanban em ordem total durável
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - {
            name: topic,
            in: query,
            required: true,
            schema: { type: string, const: kanban },
          }
        - { name: after, in: query, schema: { type: integer, minimum: 0 } }
        - {
            name: Last-Event-ID,
            in: header,
            schema: { type: integer, minimum: 0 },
          }
      responses:
        '200':
          description: >-
            text/event-stream. Emite kanban.card.changed, stream.reset e
            heartbeats; nenhum payload livre de domínio é transportado.
          content:
            text/event-stream: { schema: { type: string } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          description: Limite de aberturas por origem ou de streams simultâneos excedido
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 } }
  /conversations/{conversationId}/convert:
    post:
      operationId: convertConversation
      summary: Vincula o Contato e cria exatamente um Negócio em Produto
      description: >-
        Fecha a conversa como convertida_em_lead na mesma transação da promoção
        do Contato, criação do Negócio, idempotência e auditoria. Aceita o ator
        técnico do n8n ou uma sessão humana de Vendedor.
      security:
        - automationBasic: []
          idempotencyKey: []
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/OriginOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationConversionRequest'
      responses:
        '201':
          description: Conversão criada ou resposta original reproduzida
          headers:
            Location:
              description: URL canônica do Negócio criado
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationConversionResponse'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /deals/{dealId}/transitions:
    post:
      operationId: transitionDeal
      summary: Avança ou retorna exatamente uma etapa do Negócio
      description: >-
        O destino é sempre derivado da etapa atual. O avanço persiste a
        avaliação do gate, o histórico e o evento canônico na mesma transação.
        O executor técnico deve informar a conversa ativa e seu automationEpoch.
      security:
        - automationBasic: []
          idempotencyKey: []
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/OriginOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DealTransitionRequest' }
      responses:
        '200':
          description: Transição aplicada ou resposta original reproduzida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DealCommandResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /deals/{dealId}/lose:
    post:
      operationId: loseDeal
      summary: Marca o Negócio como perdido com motivo cifrado
      description: Exclusivo para Vendedor autenticado.
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DealLossRequest' }
      responses:
        '200':
          description: Perda registrada ou resposta original reproduzida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DealCommandResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /deals/{dealId}/fields:
    patch:
      operationId: patchDealFields
      summary: Atualiza campos oficiais da Ficha do Negócio
      description: >-
        Patch idempotente de seções fechadas. Incrementa a versão raiz uma vez
        e retorna atomicamente à primeira etapa anterior incompleta. O executor
        técnico deve provar conversa ativa e automationEpoch na mesma transação.
      security:
        - automationBasic: []
          idempotencyKey: []
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/OriginOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DealFieldsPatchRequest' }
      responses:
        '200':
          description: Campos persistidos ou resposta original reproduzida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DealFieldsPatchResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /deals/{dealId}/assign:
    post:
      operationId: assignDeal
      summary: Atribui um Negócio a um Vendedor ativo
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DealAssignmentRequest' }
      responses:
        '200': { description: Atribuição persistida ou replay idempotente }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /deals/{dealId}/tasks:
    post:
      operationId: createFollowUpTask
      summary: Cria tarefa humana de follow-up com texto cifrado
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreateRequest' }
      responses:
        '201': { description: Tarefa criada ou replay idempotente }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /tasks/{taskId}/{action}:
    post:
      operationId: transitionFollowUpTask
      summary: Inicia, conclui ou cancela uma tarefa de follow-up
      description: Tarefas vinculadas a handoff não podem ser canceladas isoladamente.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [start, complete, cancel] }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskActionRequest' }
      responses:
        '200': { description: Tarefa atualizada ou replay idempotente }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /deals/{dealId}/handoffs:
    post:
      operationId: createHumanHandoff
      summary: Cria handoff humano e sua única tarefa atomicamente
      description: AUTOMATION_EXECUTOR deve informar contexto n8n e fence da conversa.
      security:
        - automationBasic: []
          idempotencyKey: []
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/OriginOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandoffCreateRequest' }
      responses:
        '201': { description: Handoff e tarefa criados ou replay idempotente }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /handoffs/{handoffId}/{action}:
    post:
      operationId: transitionHumanHandoff
      summary: Aceita, transfere ou resolve um handoff humano
      description: Transferência preserva dueAt; nenhuma ação reativa a automação.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - name: handoffId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [accept, transfer, resolve] }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandoffActionRequest' }
      responses:
        '200':
          { description: Handoff e tarefa atualizados ou replay idempotente }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /integrations/n8n/messages/inbound:
    post:
      operationId: receiveN8nInboundMessage
      summary: Persiste uma mensagem recebida pelo n8n e devolve o contexto oficial
      security: [{ automationBasic: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/WorkflowKey'
        - $ref: '#/components/parameters/WorkflowVersion'
        - $ref: '#/components/parameters/ExecutionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/N8nInboundRequest' }
      responses:
        '200':
          description: Evento aceito ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/N8nInboundResponse' }
        '400': { $ref: '#/components/responses/N8nProblem' }
        '401': { $ref: '#/components/responses/N8nProblem' }
        '403': { $ref: '#/components/responses/N8nProblem' }
        '409': { $ref: '#/components/responses/N8nProblem' }
        '422': { $ref: '#/components/responses/N8nProblem' }
        '503': { $ref: '#/components/responses/N8nProblem' }
  /integrations/n8n/conversations/{conversationId}/attachments:
    post:
      operationId: storeN8nAttachment
      summary: Valida em streaming, quarentena e publica uma mídia transitória segura
      security: [{ automationBasic: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/WorkflowKey'
        - $ref: '#/components/parameters/WorkflowVersion'
        - $ref: '#/components/parameters/ExecutionId'
        - $ref: '#/components/parameters/ContentSha256'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/N8nAttachmentRequest' }
      responses:
        '200': { description: Replay idempotente do anexo já publicado }
        '201': { description: Anexo verificado e publicado }
        '400': { $ref: '#/components/responses/N8nProblem' }
        '401': { $ref: '#/components/responses/N8nProblem' }
        '409': { $ref: '#/components/responses/N8nProblem' }
        '413': { $ref: '#/components/responses/N8nProblem' }
        '415': { $ref: '#/components/responses/N8nProblem' }
        '422': { $ref: '#/components/responses/N8nProblem' }
        '503': { $ref: '#/components/responses/N8nProblem' }
  /integrations/n8n/events:
    post:
      operationId: recordN8nEvent
      summary: Aplica evento n8n com idempotência, fencing e transação atômica
      security: [{ automationBasic: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/WorkflowKey'
        - $ref: '#/components/parameters/WorkflowVersion'
        - $ref: '#/components/parameters/ExecutionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/N8nEventRequest' }
      responses:
        '200':
          description: Evento aplicado, negado pelo fence ou reproduzido idempotentemente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/N8nEventResponse' }
        '400': { $ref: '#/components/responses/N8nProblem' }
        '401': { $ref: '#/components/responses/N8nProblem' }
        '403': { $ref: '#/components/responses/N8nProblem' }
        '409': { $ref: '#/components/responses/N8nProblem' }
        '422': { $ref: '#/components/responses/N8nProblem' }
        '503': { $ref: '#/components/responses/N8nProblem' }
  /conversations/{conversationId}/messages:
    post:
      operationId: sendHumanConversationMessage
      summary: Persiste a intenção humana e agenda o comando idempotente ao n8n
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HumanMessageCommand' }
      responses:
        '202': { description: Estado oficial e outbox gravados atomicamente }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /conversations/{conversationId}/{command}:
    post:
      operationId: changeConversationAutomationMode
      summary: Executa takeover, retorno à IA ou encerramento humano
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: command
          in: path
          required: true
          schema: { type: string, enum: [takeover, return-to-ai, close] }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HumanConversationCommand' }
      responses:
        '202': { description: Estado oficial, auditoria e outbox gravados }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /conversations/{conversationId}/archive:
    post:
      operationId: archiveConversation
      summary: Retira uma conversa ativa da Caixa de Entrada sem encerrá-la
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HumanConversationCommand' }
      responses:
        '202': { description: Conversa arquivada, com auditoria e atualização em tempo real }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /conversations/{conversationId}/unarchive:
    post:
      operationId: unarchiveConversation
      summary: Restaura uma conversa arquivada à Caixa de Entrada
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HumanConversationCommand' }
      responses:
        '202': { description: Conversa desarquivada, com auditoria e atualização em tempo real }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /handoffs/{handoffId}/claim:
    post:
      operationId: claimHumanHandoff
      summary: Reivindica atomicamente um handoff compatível ainda sem responsável
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - name: handoffId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandoffClaimRequest' }
      responses:
        '200': { description: Handoff atribuído à pessoa autenticada }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /orders:
    get:
      operationId: listOrders
      summary: Lista pedidos por status, com busca e paginação
      description: >-
        Ação order.read. Sem status, retorna Todos. A busca aceita número do
        pedido, cliente ou telefone e resolve cliente e telefone pelo contato da
        conversa. `counts` traz o total de cada grupo (Confirmados e Pendentes)
        para a busca atual, independentemente da página.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - {
            name: status,
            in: query,
            schema: { $ref: '#/components/schemas/OrderStatus' },
          }
        - {
            name: q,
            in: query,
            schema: { type: string, minLength: 1, maxLength: 128 },
          }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        '200':
          description: Página de pedidos
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Retorna um pedido com a ficha completa
      description: Ação order.read.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Pedido
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
  /conversations/{conversationId}/order:
    get:
      operationId: getConversationOrder
      summary: Retorna o pedido atual da conversa
      description: >-
        Ação order.read. Devolve o pedido pendente da conversa ou, se não
        houver, o último confirmado. `order` é null quando a conversa não tem
        pedido.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Pedido atual ou null
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/ConversationOrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /conversations/{conversationId}/orders:
    post:
      operationId: createConversationOrder
      summary: Cria manualmente o pedido pendente da conversa
      description: >-
        Ação order.create, restrita ao dono da conversa ou a COMMERCIAL_ADMIN.
        O pedido nasce pendente, com número NN-CRM reservado, pré-preenchido
        com a pré-ficha atual da conversa. Se a conversa já tem pedido
        pendente, responde 200 com o pedido existente.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreateRequest' }
      responses:
        '200':
          description: Pedido pendente já existente ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '201':
          description: Pedido pendente criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
  /orders/{orderId}/sections/{section}:
    patch:
      operationId: patchOrderSection
      summary: Substitui uma seção inteira da ficha de um pedido pendente
      description: >-
        Ação order.edit, restrita ao dono da conversa ou a COMMERCIAL_ADMIN.
        `value` substitui a seção inteira; total de peças e campos faltantes
        são recalculados. Pedido confirmado não aceita edição (409); é preciso
        reabrir.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - name: section
          in: path
          required: true
          schema: { $ref: '#/components/schemas/OrderSection' }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderSectionPatchRequest' }
      responses:
        '200':
          description: Seção gravada ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
        '422': { $ref: '#/components/responses/OrderUnprocessable' }
  /orders/{orderId}/confirm:
    post:
      operationId: confirmOrder
      summary: Confirma o pedido com valor final e condição de pagamento
      description: >-
        Ação order.confirm, restrita ao dono da conversa ou a COMMERCIAL_ADMIN.
        Exige valor final no formato brasileiro (ex.: 4.820,00) maior que zero,
        condição de pagamento válida e ao menos um item com grade. Grava valor,
        condição, autor, horário e data do pedido. Numa nova confirmação depois
        de reabrir, autor, horário e data passam a ser os da nova confirmação.
        Confirmações concorrentes sobre a mesma versão: uma vence e a outra
        recebe 409.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderConfirmRequest' }
      responses:
        '200':
          description: Pedido confirmado ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
        '422': { $ref: '#/components/responses/OrderUnprocessable' }
  /orders/{orderId}/reopen:
    post:
      operationId: reopenOrder
      summary: Reabre um pedido confirmado
      description: >-
        Ação order.reopen, restrita ao dono da conversa ou a COMMERCIAL_ADMIN.
        Só a partir de confirmado. Volta a pendente mantendo número, valor e
        condição, registra autor e horário da reabertura e bloqueia a
        impressão.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderReopenRequest' }
      responses:
        '200':
          description: Pedido reaberto ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
  /orders/{orderId}/print:
    get:
      operationId: printOrder
      summary: Retorna a ficha de pedido no template ficha-canonical-v2
      description: >-
        Ação order.print, disponível a qualquer usuário operacional. Só para
        pedido confirmado; pendente responde 409 ORDER_NOT_CONFIRMED. HTML A4
        paisagem, duas páginas, impresso pelo navegador. O documento não traz
        valor, condição de pagamento nem a faixa de amostra sintética; vendedor
        é quem confirmou, data é a data do pedido e o controle de produção sai
        em branco.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Documento HTML pronto para impressão
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
          content:
            text/html:
              schema: { type: string }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
components:
  securitySchemes:
    automationBasic:
      type: http
      scheme: basic
      description: Credencial exclusiva e rotacionável do AUTOMATION_EXECUTOR.
    sessionCookie:
      type: apiKey
      in: cookie
      name: crm_session
      description: Cookie opaco HttpOnly, Secure e SameSite=Lax.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Deve corresponder ao cookie Secure crm_csrf.
    idempotencyKey:
      type: apiKey
      in: header
      name: Idempotency-Key
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema: { type: string, format: uri }
    OriginOptional:
      name: Origin
      in: header
      required: false
      description: Obrigatório para autenticação humana; não usado pelo ator técnico.
      schema: { type: string, format: uri }
    HumanReadOrigin:
      name: Origin
      in: header
      required: false
      description: >-
        Se presente, deve pertencer à allowlist. Se ausente, o navegador deve
        enviar Sec-Fetch-Site same-origin ou none.
      schema: { type: string, format: uri }
    BootstrapToken:
      name: X-Bootstrap-Token
      in: header
      required: true
      schema: { type: string, minLength: 32 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    WorkflowKey:
      name: X-Silmer-Workflow-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    WorkflowVersion:
      name: X-Silmer-Workflow-Version
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    ExecutionId:
      name: X-Silmer-Execution-Id
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    ContentSha256:
      name: X-Silmer-Content-SHA256
      in: header
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{64}$' }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ContactId:
      name: contactId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    DealId:
      name: dealId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  schemas:
    N8nMode:
      type: string
      enum: [ai_active, handoff_pending, human_active, closed]
    N8nInboundRequest:
      type: object
      additionalProperties: false
      required:
        [
          schema_version,
          event_id,
          occurred_at,
          channel,
          contact,
          message,
          metadata,
        ]
      properties:
        schema_version: { type: string, const: '1.0' }
        event_id: { type: string, minLength: 1, maxLength: 512 }
        occurred_at: { type: string, format: date-time }
        channel: { type: string, const: whatsapp }
        contact:
          type: object
          anyOf:
            - required: [external_id]
            - required: [wa_id]
          properties:
            external_id: { type: string, minLength: 1, maxLength: 512 }
            wa_id: { type: string, minLength: 1, maxLength: 512 }
            name: { type: string, maxLength: 512 }
        message:
          type: object
          additionalProperties: true
          required: [external_id, type]
          properties:
            external_id: { type: string, minLength: 1, maxLength: 512 }
            type:
              type: string
              enum: [text, image, audio, video, document, button, interactive]
            text: { type: string, maxLength: 65536 }
        metadata:
          type: object
          additionalProperties: true
          anyOf:
            - required: [provider_account_id]
            - required: [phone_number_id]
    N8nInboundResponse:
      type: object
      additionalProperties: true
      required:
        [
          accepted,
          duplicate,
          conversation_id,
          source_revision,
          automation_epoch,
          mode,
          recent_messages,
          briefing,
        ]
      properties:
