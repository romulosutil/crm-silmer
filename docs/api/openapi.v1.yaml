        '400': { $ref: '#/components/responses/N8nProblem' }
        '401': { $ref: '#/components/responses/N8nProblem' }
        '403': { $ref: '#/components/responses/N8nProblem' }
        '409': { $ref: '#/components/responses/N8nProblem' }
        '422': { $ref: '#/components/responses/N8nProblem' }
        '503': { $ref: '#/components/responses/N8nProblem' }
  /integrations/n8n/conversations/{conversationId}/attachments:
    post:
      operationId: storeN8nAttachment
      summary: Valida em streaming, quarentena e publica uma mídia transitória segura
      security: [{ automationBasic: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/WorkflowKey'
        - $ref: '#/components/parameters/WorkflowVersion'
        - $ref: '#/components/parameters/ExecutionId'
        - $ref: '#/components/parameters/ContentSha256'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/N8nAttachmentRequest' }
      responses:
        '200': { description: Replay idempotente do anexo já publicado }
        '201': { description: Anexo verificado e publicado }
        '400': { $ref: '#/components/responses/N8nProblem' }
        '401': { $ref: '#/components/responses/N8nProblem' }
        '409': { $ref: '#/components/responses/N8nProblem' }
        '413': { $ref: '#/components/responses/N8nProblem' }
        '415': { $ref: '#/components/responses/N8nProblem' }
        '422': { $ref: '#/components/responses/N8nProblem' }
        '503': { $ref: '#/components/responses/N8nProblem' }
  /integrations/n8n/commands/{commandId}/media:
    get:
      operationId: readReservedN8nMedia
      summary: Read private media bound to the original active human send reservation
      description: >-
        Requires integration.n8n.command.media.read and the original workflow key,
        version and execution. Command processing, message sending, bound clean
        variant and current human/nonterminal epoch/revision are revalidated.
        preflight=true returns safe JSON without storage reads, reservation or
        renewal. Neither representation grants a new send authorization. HEAD is
        not exposed; foreign selectors and redirects are prohibited.
      security: [{ automationBasic: [] }]
      parameters:
        - name: commandId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: preflight
          in: query
          schema: { type: string, const: 'true' }
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/WorkflowKey'
        - $ref: '#/components/parameters/WorkflowVersion'
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          description: Private no-store bytes, or read-only JSON preflight
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [valid, media_id, type, sha256, mime_type, size_bytes]
                properties:
                  valid: { const: true }
                  media_id: { type: string, format: uuid }
                  type: { enum: [image, audio, video] }
                  sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
                  mime_type: { type: string }
                  size_bytes: { type: integer, minimum: 1, maximum: 16777216 }
        '400': { description: Invalid query or missing technical identity }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Reserved command not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { description: Object lost, metadata preserved }
        '503': { description: Storage or integration unavailable }
  /integrations/n8n/events:
