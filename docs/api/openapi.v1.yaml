      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason:
          type: string
          minLength: 1
          description: Motivo sensível cifrado antes da persistência.
    DealFieldsPatchRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, fields, reasonCode]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reasonCode:
          type: string
          enum:
            [
              customer_update,
              correction,
              qualification_review,
              automation_extraction,
            ]
        reasonDetail:
          type: string
          minLength: 1
          maxLength: 2048
          description: Detalhe sensível cifrado; eventos e auditoria recebem somente código e hash.
        conversationId: { type: string, minLength: 1 }
        automationEpoch: { type: integer, minimum: 0 }
        fields:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            order:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                customer: { type: string, minLength: 1 }
                name: { type: string, minLength: 1 }
                commercialIntent: { type: boolean, const: true }
            items:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/DealItemFields' }
            artwork: { $ref: '#/components/schemas/DealArtworkFields' }
            logistics: { $ref: '#/components/schemas/DealLogisticsFields' }
            observations:
              type: array
              items: { type: string, minLength: 1 }
            assessments:
              type: array
              items: { $ref: '#/components/schemas/FieldAssessment' }
    DealItemFields:
      type: object
      additionalProperties: false
      required: [id]
      minProperties: 2
      properties:
        id: { type: string, minLength: 1 }
        operation: { type: string, enum: [upsert, remove] }
        catalogVersionId: { type: string, minLength: 1 }
        productCode: { type: string, minLength: 1 }
        modelCode: { type: string, minLength: 1 }
        estimatedQuantity: { type: integer, minimum: 1 }
        fabrics:
          type: array
          items: { type: string, minLength: 1 }
        colors:
          type: object
          additionalProperties: false
          properties:
            front: { type: string, minLength: 1 }
            back: { type: string, minLength: 1 }
            rightSleeve: { type: string, minLength: 1 }
            leftSleeve: { type: string, minLength: 1 }
            collarTrim: { type: string, minLength: 1 }
            sleeveTrim: { type: string, minLength: 1 }
        grade:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [size, quantity]
            properties:
              size: { type: string, minLength: 1 }
              quantity: { type: integer, minimum: 1 }
              duplicateSizeReason: { type: string, minLength: 1 }
    DealArtworkFields:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status:
          {
            type: string,
            enum:
              [ready, customer_will_send, silmer_will_create, not_applicable],
          }
        catalogVersionId: { type: string, minLength: 1 }
        responsibility: { type: string, minLength: 1 }
        techniqueCode: { type: string, minLength: 1 }
        locations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id: { type: string, minLength: 1 }
              name: { type: string, minLength: 1 }
        files:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [attachmentId, itemId, locationId]
            properties:
              attachmentId:
                type: object
                additionalProperties: false
                required: [messageId, transientMediaId]
                properties:
                  messageId: { type: string, minLength: 1, maxLength: 64 }
                  transientMediaId:
                    { type: string, minLength: 1, maxLength: 64 }
              itemId: { type: string, minLength: 1 }
              locationId: { type: string, minLength: 1 }
        colors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [locationId, values]
            properties:
              locationId: { type: string, minLength: 1 }
              values:
                type: array
                minItems: 1
                items: { type: string, minLength: 1 }
    DealLogisticsFields:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        desiredDate: { type: string, format: date }
        purpose: { type: string, minLength: 1 }
        purchaseProfile: { type: string, minLength: 1 }
        mode: { type: string, enum: [delivery, pickup] }
        city: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        pickupLocation: { type: string, minLength: 1 }
    FieldAssessment:
      type: object
      additionalProperties: false
      required: [field, status]
      properties:
        field: { type: string, minLength: 1 }
        status:
          {
            type: string,
            enum: [preenchido, nao_aplicavel, pendente, divergente],
          }
        reason: { type: string, minLength: 1 }
    DealFieldsPatchResponse:
      type: object
      additionalProperties: false
      required: [deal, readiness, totalQuantity]
      properties:
        deal:
          { $ref: '#/components/schemas/DealCommandResponse/properties/deal' }
        readiness:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required: [complete, blockers]
            properties:
              complete: { type: boolean }
              blockers: { type: array, items: { type: string } }
              nextPendingField: { type: string }
        totalQuantity:
          type: integer
          minimum: 0
          description: Soma derivada das quantidades estimadas de todos os itens.
    DealCommandResponse:
      type: object
      additionalProperties: false
      required: [deal]
      properties:
        deal:
          type: object
          additionalProperties: true
          required: [id, stage, status, version]
          properties:
            id: { type: string }
            stage:
              type: string
              enum: [produto, especificacao, estampa, logistica, fechamento]
            status: { type: string, enum: [active, lost] }
            version: { type: integer, minimum: 2 }
        gate:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [dealId, fromStage, version, blockers, evaluatedAt]
              properties:
                dealId: { type: string }
                fromStage:
                  type: string
                  enum: [produto, especificacao, estampa, logistica]
                version: { type: integer, minimum: 1 }
                blockers:
                  type: array
                  maxItems: 0
                evaluatedAt: { type: string, format: date-time }
    DealAssignmentRequest:
      type: object
      additionalProperties: false
      required: [assignedUserId, expectedDealVersion, reasonCode]
      properties:
        assignedUserId: { type: string, minLength: 1 }
        expectedDealVersion: { type: integer, minimum: 1 }
        reasonCode: { type: string, enum: [manual_assignment] }
    TaskCreateRequest:
      type: object
      additionalProperties: false
      required:
        [assignedUserId, dueAt, expectedDealVersion, reasonCode, text, type]
      properties:
        assignedUserId: { type: string, minLength: 1 }
        dueAt: { type: string, format: date-time }
        expectedDealVersion: { type: integer, minimum: 1 }
        reasonCode: { type: string, enum: [manual_follow_up] }
        text: { type: string, minLength: 1, maxLength: 4096 }
        type: { type: string, const: follow_up }
    TaskActionRequest:
      type: object
      additionalProperties: false
      required: [expectedTaskVersion, reasonCode]
      properties:
        expectedTaskVersion: { type: integer, minimum: 1 }
        reasonCode:
          { type: string, enum: [task_started, task_completed, task_cancelled] }
    HandoffCreateRequest:
      type: object
      additionalProperties: false
      required:
        [
          assignedUserId,
          conversationId,
          expectedConversationVersion,
          expectedDealVersion,
          reasonCode,
          summary,
        ]
      properties:
        assignedUserId: { type: string, minLength: 1 }
        conversationId: { type: string, minLength: 1 }
        expectedConversationVersion: { type: integer, minimum: 1 }
        expectedDealVersion: { type: integer, minimum: 1 }
        reasonCode:
          type: string
          enum:
            [
              customer_requested_human,
              price_before_quote,
              unresolved_blocker,
              low_confidence,
            ]
        summary: { type: string, minLength: 1, maxLength: 8192 }
        automationEpoch: { type: integer, minimum: 0 }
        automationContext:
          type: object
          additionalProperties: false
          required: [executionId, workflowKey, workflowVersion]
          properties:
            executionId: { type: string, minLength: 1 }
            workflowKey: { type: string, minLength: 1 }
            workflowVersion: { type: string, minLength: 1 }
    HandoffActionRequest:
      type: object
      additionalProperties: false
      required:
        [
          expectedConversationVersion,
          expectedDealVersion,
          expectedHandoffVersion,
          expectedTaskVersion,
          reasonCode,
        ]
      properties:
        assignedUserId:
          type: string
          minLength: 1
          description: Obrigatório somente em transfer.
        expectedConversationVersion: { type: integer, minimum: 1 }
        expectedDealVersion: { type: integer, minimum: 1 }
        expectedHandoffVersion: { type: integer, minimum: 1 }
        expectedTaskVersion: { type: integer, minimum: 1 }
        reasonCode:
          {
            type: string,
            enum: [handoff_accepted, manual_transfer, handoff_resolved],
          }
    OrderStatus:
      type: string
      enum: [pendente, confirmado]
    PaymentCondition:
      type: string
      enum: [pix, cartao_credito, cartao_debito]
    OrderSection:
      type: string
      enum: [summary, items, observations, artwork]
    OrderActorRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    FichaGradeLine:
      type: object
      additionalProperties: false
      required: [tamanho, quantidade]
      properties:
        tamanho: { type: string, minLength: 1 }
        quantidade: { type: integer, minimum: 1 }
    FichaItem:
      type: object
      additionalProperties: false
      description: >-
        Item da ficha (ADRs 016 e 020). Principais, na ordem da tela: tipo
        (Tipo de roupa), cor, quantidade (soma da grade; nunca enviada),
        tipo_servico (Técnica: silk, DTF, sublimação, bordado… ou Sem
        estampa), malhas (Tecido), grade (Tamanhos) e gola (Gola). O bot pode
        preencher uma técnica vazia; é obrigatória para confirmar, mas pode
        ficar vazia enquanto pendente. Adicionais, que não bloqueiam: estampa
        (Estampa (referência)), cores do tecido por parte e vies_mangas; modelo
        e vies_gola são legados. Mangas e viés aceitam NAO APLICAVEL. Um item pode ser
        salvo incompleto (malhas e grade vazias, textos em branco). O servidor
        devolve todos os campos de texto, com vazio para os omitidos. Textos
        com até 200 caracteres; até 50 itens.
      required: [tipo, malhas, grade]
      properties:
        tipo: { type: string, maxLength: 200 }
        tipo_servico: { type: string, maxLength: 200 }
        cor: { type: string, maxLength: 200 }
        estampa: { type: string, maxLength: 200 }
        malhas:
          type: array
          items: { type: string, minLength: 1, maxLength: 200 }
        grade:
          type: array
          items: { $ref: '#/components/schemas/FichaGradeLine' }
        gola: { type: string, maxLength: 200 }
        modelo: { type: string, maxLength: 200 }
        cor_frente: { type: string, maxLength: 200 }
        cor_costas: { type: string, maxLength: 200 }
        cor_manga_direita: { type: string, maxLength: 200 }
        cor_manga_esquerda: { type: string, maxLength: 200 }
        vies_gola: { type: string, maxLength: 200 }
        vies_mangas: { type: string, maxLength: 200 }
    FichaArtwork:
      type: object
      additionalProperties: false
      description: >-
        Quem faz a arte do pedido (ADR 020): o cliente envia, a Silmer cria
        (podem coexistir) ou sem estampa (exclusivo). Confirmar exige uma
        marcação. O bot preenche quando o pedido ainda não tem marcação; o
        vendedor corrige. O armazenamento dos arquivos está preparado, sem
        upload ativo; files permanece vazio até haver storage durável.
      required: [feito_pelo_cliente, feito_pela_silmer, sem_estampa, files]
      properties:
        feito_pelo_cliente: { type: boolean }
        feito_pela_silmer: { type: boolean }
        sem_estampa: { type: boolean }
        files:
          type: array
          readOnly: true
          maxItems: 0
          items: { type: object }
    FichaArtworkInput:
      type: object
      additionalProperties: false
      description: >-
        Quem faz a arte, marcado pelo vendedor. Não aceita arquivos ou
        metadados de arquivo. feito_pelo_cliente e feito_pela_silmer são
        exigidos e podem coincidir; sem_estampa é opcional (falso quando
        omitido) e recusado junto de uma das outras com 400.
      required: [feito_pelo_cliente, feito_pela_silmer]
      properties:
        feito_pelo_cliente: { type: boolean }
        feito_pela_silmer: { type: boolean }
        sem_estampa: { type: boolean }
    FichaSummary:
      type: object
      additionalProperties: false
      required: [cliente, data_entrega_confirmada, aplicacao, nome]
      properties:
        cliente:
          type: string
          readOnly: true
          description: Vem do contato da conversa e não é editável no pedido.
        data_entrega_confirmada: { type: [string, 'null'] }
        aplicacao:
          type: [string, 'null']
          description: >-
            Técnica geral legada (ADR 020); não é mais escrita, editada nem
            impressa a partir da v5. A técnica fica em cada item.
        nome: { type: [string, 'null'] }
    FichaSummaryInput:
      type: object
      additionalProperties: false
      description: >-
        Resumo editável; o cliente vem do contato e não é enviado. aplicacao
        de uma tela antiga é aceita e ignorada (ADR 020).
      required: [data_entrega_confirmada, nome]
      properties:
        data_entrega_confirmada: { type: [string, 'null'] }
        aplicacao: { type: [string, 'null'], deprecated: true }
        nome: { type: [string, 'null'] }
    FichaObservations:
      type: array
      maxItems: 5
      items: { type: string }
    Ficha:
      type: object
      additionalProperties: false
      required: [summary, items, observations, artwork, serviceData]
      properties:
        summary: { $ref: '#/components/schemas/FichaSummary' }
        items:
          type: array
          items: { $ref: '#/components/schemas/FichaItem' }
        observations: { $ref: '#/components/schemas/FichaObservations' }
        artwork: { $ref: '#/components/schemas/FichaArtwork' }
        serviceData:
          type: object
          additionalProperties: true
          readOnly: true
          description: >-
            Dados do atendimento vindos da pré-ficha (arte, locais, logística,
            finalidade, perfil de compra). Só leitura; não saem na ficha
            impressa.
    Order:
      type: object
      additionalProperties: false
      required:
        [
          id,
          number,
          conversationId,
          status,
          fabCode,
          ficha,
          totalPieces,
          missingFields,
          lastMessage,
          finalAmountCents,
          paymentCondition,
          orderDate,
          confirmedAt,
          confirmedBy,
          reopenedAt,
          reopenedBy,
          firstContactAt,
          paidOn,
          deliveredOn,
          seller,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        number: { type: string, pattern: '^[0-9]{2,}-CRM$' }
        conversationId: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        fabCode: { type: string }
        ficha: { $ref: '#/components/schemas/Ficha' }
        totalPieces: { type: integer, minimum: 0 }
        missingFields:
          type: array
          description: >-
            O que ainda impede gerar o pedido pendente (ADRs 016 e 020),
            nesta ordem: items (nenhum item); items[N].tipo, items[N].cor,
            items[N].tipo_servico (técnica), items[N].malhas, items[N].grade e
            items[N].gola (ponto principal que falta no item N, a partir de 0;
            a grade vale também pela quantidade); artwork (ninguém marcou
            quem faz a arte nem sem estampa);
            summary.data_entrega_confirmada (entrega prometida ausente ou fora
            do formato AAAA-MM-DD); finalAmount; e paymentCondition. Vazio em
            pedido confirmado. Os adicionais do item, o resto do resumo e as
            outras datas do lastro (paidOn, deliveredOn) nunca aparecem aqui:
            por enquanto, gerar subentende o pagamento feito.
          items: { type: string }
        lastMessage:
          description: >-
            Metadados da última mensagem da conversa, sem conteúdo ou dados
            do contato. Nulo quando a conversa ainda não tem mensagens.
          oneOf:
            - { $ref: '#/components/schemas/OrderLastMessage' }
            - { type: 'null' }
        finalAmountCents: { type: [integer, 'null'], minimum: 1 }
        paymentCondition:
          oneOf:
            - { $ref: '#/components/schemas/PaymentCondition' }
            - { type: 'null' }
        orderDate: { type: [string, 'null'], format: date }
        confirmedAt: { type: [string, 'null'], format: date-time }
        confirmedBy:
          oneOf:
            - { $ref: '#/components/schemas/OrderActorRef' }
            - { type: 'null' }
        reopenedAt: { type: [string, 'null'], format: date-time }
        reopenedBy:
          oneOf:
            - { $ref: '#/components/schemas/OrderActorRef' }
            - { type: 'null' }
        firstContactAt:
          type: [string, 'null']
          format: date-time
          description: >-
            Primeiro contato: abertura da conversa que originou o pedido,
            copiada na criação. Nulo só em pedido criado durante a troca de
            versão da API.
        paidOn:
          type: [string, 'null']
          format: date
          description: Dia do pagamento, informado por uma pessoa.
        deliveredOn:
          type: [string, 'null']
          format: date
          description: Dia da entrega realizada, informado por uma pessoa.
        seller:
          description: Dono atual da conversa.
          oneOf:
            - { $ref: '#/components/schemas/OrderActorRef' }
            - { type: 'null' }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderLastMessage:
      type: object
      additionalProperties: false
      required: [direction, occurredAt, deliveryStatus, status]
      properties:
        direction: { type: string, enum: [inbound, outbound] }
        occurredAt: { type: string, format: date-time }
        deliveryStatus: { type: [string, 'null'] }
        status: { type: string }
    OrdersSummary:
      type: object
      additionalProperties: false
      required:
        [
          confirmedCount,
          soldAmountCents,
          averageTicketCents,
          pendingCount,
          totalPiecesSold,
        ]
      properties:
        confirmedCount: { type: integer, minimum: 0 }
        soldAmountCents: { type: integer, minimum: 0 }
        averageTicketCents: { type: integer, minimum: 0 }
        pendingCount: { type: integer, minimum: 0 }
        totalPiecesSold: { type: integer, minimum: 0 }
    OrderResponse:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order: { $ref: '#/components/schemas/Order' }
    ConversationOrderResponse:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order:
          oneOf:
            - { $ref: '#/components/schemas/Order' }
            - { type: 'null' }
    OrderPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, counts]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        nextCursor: { type: [string, 'null'] }
        counts:
          type: object
          additionalProperties: false
          required: [pendente, confirmado]
          properties:
            pendente: { type: integer, minimum: 0 }
            confirmado: { type: integer, minimum: 0 }
    OrderCreateRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Versão atual da conversa.
    OrderSectionPatchRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, value]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Versão atual do pedido.
        value:
          description: >-
            Seção inteira: FichaSummaryInput para summary, lista de FichaItem
            para items, FichaObservations para observations ou
            FichaArtworkInput para artwork. Arquivos não são aceitos.
          oneOf:
            - { $ref: '#/components/schemas/FichaSummaryInput' }
            - type: array
              items: { $ref: '#/components/schemas/FichaItem' }
            - { $ref: '#/components/schemas/FichaObservations' }
            - { $ref: '#/components/schemas/FichaArtworkInput' }
    OrderConfirmRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, amountText, paymentCondition]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Versão atual do pedido.
        amountText:
          type: string
          minLength: 1
          maxLength: 32
          description: >-
            Valor final em reais no formato brasileiro, sem o prefixo R$ (ex.:
            4.820,00). Armazenado em centavos inteiros maiores que zero.
        paymentCondition: { $ref: '#/components/schemas/PaymentCondition' }
    OrderReopenRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Versão atual do pedido.
    OrderMilestonesRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, paidOn, deliveredOn]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Versão atual do pedido.
        paidOn: { type: [string, 'null'], format: date }
        deliveredOn: { type: [string, 'null'], format: date }
    OrderError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code:
              type: string
              enum:
                [
                  ORDER_NOT_FOUND,
                  VERSION_CONFLICT,
                  ORDER_NOT_CONFIRMED,
                  ORDER_NOT_CONFIRMABLE,
                  INVALID_AMOUNT,
                  INVALID_GRADE,
                  INVALID_DATE,
                ]
            fields:
              type: array
              description: >-
                Campos recusados em ORDER_NOT_CONFIRMABLE (as chaves de
                Order.missingFields) e INVALID_DATE.
              items: { type: string }
            index:
              type: integer
              minimum: 0
              description: Índice da linha recusada em INVALID_GRADE.
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code: { type: string }
  responses:
    N8nProblem:
      description: Erro compatível em application/problem+json sem eco de PII
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/N8nProblem' }
    InvalidRequest:
      description: Entrada inválida sem eco de dados recebidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidCredentials:
      description: Credenciais inválidas, sem indicar se a conta existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Origem, CSRF, sessão ou autorização inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Pessoa alvo da mudança de capacidade não encontrada
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Chave idempotente divergente ou bootstrap já consumido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Throttled:
      description: Bloqueio progressivo ativo
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Dependência de autenticação ou persistência indisponível
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    OrderNotFound:
      description: Pedido inexistente (ORDER_NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrderError' }
    OrderConflict:
      description: >-
        Versão desatualizada (VERSION_CONFLICT), impressão de pedido pendente
        (ORDER_NOT_CONFIRMED), edição ou reabertura fora do status permitido
        ou chave idempotente divergente
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: '#/components/schemas/OrderError' }
              - { $ref: '#/components/schemas/Error' }
    OrderUnprocessable:
      description: >-
        Pedido não confirmável (ORDER_NOT_CONFIRMABLE com fields), valor em
        formato inválido (INVALID_AMOUNT), grade inválida (INVALID_GRADE com
        index) ou data inválida ou futura (INVALID_DATE com fields)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrderError' }
