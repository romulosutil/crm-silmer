Foreground yes
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/crm-clamd/clamd.sock
LocalSocketMode 600
FixStaleSocket yes
MaxThreads 2
MaxQueue 8
ReadTimeout 60
CommandReadTimeout 5
SendBufTimeout 500
MaxFileSize 32M
MaxScanSize 64M
StreamMaxLength 32M
AlertExceedsMax yes
# Updates are coordinated with verified freshness; avoid two engines in memory.
ConcurrentDatabaseReload no
SelfCheck 0
LogFileUnlock yes
