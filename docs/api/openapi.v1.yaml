          application/json:
            schema: { $ref: '#/components/schemas/N8nEventRequest' }
      responses:
        '200':
          description: Evento aplicado, negado pelo fence ou reproduzido idempotentemente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/N8nEventResponse' }
        '400': { $ref: '#/components/responses/N8nProblem' }
        '401': { $ref: '#/components/responses/N8nProblem' }
        '403': { $ref: '#/components/responses/N8nProblem' }
        '409': { $ref: '#/components/responses/N8nProblem' }
        '422': { $ref: '#/components/responses/N8nProblem' }
        '503': { $ref: '#/components/responses/N8nProblem' }
  /conversations/{conversationId}/media:
    post:
      operationId: uploadChatMedia
      summary: Recebe mídia privada sem assumir o atendimento
      description: >-
        Campos kind, origin e expectedVersion precedem um único campo file.
        Arquivo vazio ou declaração inválida usa 422, excesso de bytes 413.
        Inspeção real de formato/codec ocorre no worker após 202. Replay mede
        bytes reais e declaração sem nova reserva; payload diferente ou
        recebimento ainda ativo usa 409. Upload não altera ownership ou epoch.
        Falhas usam application/problem+json com type, title, status e request_id,
        accepted=false e error.code estável (INVALID_CREDENTIALS, FORBIDDEN,
        MEDIA_CONFLICT, MEDIA_TOO_LARGE, MEDIA_INVALID, MEDIA_RATE_LIMITED ou
        SERVICE_UNAVAILABLE conforme o status).
      security:
        - sessionCookie: []
          csrfHeader: []
          idempotencyKey: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [kind, origin, expectedVersion, file]
              properties:
                kind: { type: string, enum: [image, audio, video] }
                origin: { type: string, enum: [attachment, recording] }
                expectedVersion: { type: integer, minimum: 1 }
                file: { type: string, format: binary }
      responses:
        '202':
          description: Upload completo enfileirado, ou replay original
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [mediaId, state, statusUrl]
                properties:
                  mediaId: { type: string, format: uuid }
                  state: { type: string, const: processing }
                  statusUrl: { type: string }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { description: Limite de bytes excedido }
        '422': { description: Declaração ou multipart inválido/vazio }
        '429': { description: Quota ou 12 admissões por sessão/minuto }
        '503': { description: Dependência indisponível ou conclusão incerta }
  /conversations/{conversationId}/media/{mediaId}/content:
    get:
      operationId: getChatMediaContent
      summary: Bytes privados da mídia retida
      description: >-
        Sessão humana e conversation.read obrigatórias. Draft somente autor/admin;
        attached segue leitura da conversa mesmo após oito dias ou encerramento.
        Aceita um único Range bytes fechado, aberto ou sufixo. Respostas usam
        Cache-Control private,no-store, X-Content-Type-Options nosniff e Accept-Ranges bytes.
        Indisponibilidade transitória não altera estado durable ou quota.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: mediaId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Range
          in: header
          schema: { type: string }
      responses:
        '200': { description: Bytes completos, Content-Length exato }
        '206':
          {
            description: Bytes parciais com Content-Range e Content-Length exatos,
          }
        '401': { description: Sessão ausente ou inválida, sem bytes }
        '403': { description: Leitura proibida, sem bytes }
        '404': { description: Mídia não encontrada nesta conversa }
        '409': { description: Mídia ainda não validada/ready }
        '410': { description: Objeto comprovadamente perdido; quota preservada }
        '416':
          {
            description: Range inválido ou fora do objeto,
            Content-Range bytes */size,
          }
        '503':
          {
            description: Storage temporariamente indisponível ou metadata divergente,
          }
  /conversations/{conversationId}/media/{mediaId}:
    get:
      operationId: getChatMediaStatus
      summary: Estado e metadados seguros da mídia privada
      description: >-
        Rascunho somente autor ou COMMERCIAL_ADMIN; mídia vinculada segue a ACL
        de leitura da conversa. Nunca retorna object_key, URL, filename ou
        envelope. Formato inválido depois do202 usa200/state=rejected/reason=invalid_format.
        Sessão ausente/expirada/revogada/inválida401; origem, capacidade ou
        ownership negados403. Dependência indisponível503. Cache private,no-store.
      security:
        - sessionCookie: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string }
        - name: mediaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Estado atual sem chaves ou nomes originais
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  [
                    mediaId,
                    kind,
                    origin,
                    state,
                    validationStatus,
                    mimeType,
                    sizeBytes,
                    durationMs,
                  ]
                properties:
                  mediaId: { type: string, format: uuid }
                  kind: { type: string, enum: [image, audio, video] }
                  origin: { type: string, enum: [attachment, recording] }
                  state:
                    {
                      type: string,
                      enum:
                        [
                          uploaded,
                          processing,
                          ready,
                          attached,
                          rejected,
                          unavailable,
                          lost,
                        ],
                    }
                  validationStatus: { type: string }
                  mimeType: { type: [string, 'null'] }
                  sizeBytes: { type: [integer, 'null'], minimum: 1 }
                  durationMs: { type: [integer, 'null'], minimum: 0 }
                  reason: { type: string }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Mídia ausente na conversa }
        '503': { description: Dependência indisponível }
  /integrations/n8n/store-orders:
    post:
      operationId: recordStoreOrder
      summary: Registra o pedido pago da loja do site (ADR 028)
      description: >-
        Ação store.order.record, só do AUTOMATION_EXECUTOR. O workflow n8n
        "Silmer | Loja | Checkout InfinitePay" chama depois que o
        payment_check da InfinitePay confirma o Pix (paid e amount maior ou
        igual ao valor). O CRM confere o pedido com o próprio catálogo da loja
        e cria um pedido confirmado, travado, sem conversa nem contato, ao
        preço do catálogo. A chave natural é o `pedido_id`: os mesmos dados
        respondem 200 com o mesmo pedido, antes do catálogo; o `receipt_url`
        que antes faltava é gravado e responde 200; dados que diferem só em
        `pagamento.pago_em` (duas execuções do n8n) também respondem 200 com
        o mesmo `numero`, e o pedido mantém o primeiro instante (ADR 031,
        LOJ-37); dados diferentes ou outro comprovante, ou um
        `transaction_nsu` de outro pedido, respondem 409.
        `Idempotency-Key` é o mesmo texto de `pedido_id`. `X-Correlation-Id`
        precisa ser um UUID (ou 16 a 64 hexadecimais) — use o próprio
        `pedido_id`. Até 60 chamadas por minuto (429 RATE_LIMITED com
        Retry-After, antes da credencial). Corpo JSON até 16 KB. Desligada
        (404) até STORE_ORDERS_HMAC_KEY existir. As URLs da resposta partem
        de APP_BASE_URL; sem ela, saem relativas.
      security: [{ automationBasic: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/WorkflowKey'
        - $ref: '#/components/parameters/WorkflowVersion'
        - $ref: '#/components/parameters/ExecutionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreOrderRecord' }
      responses:
        '201':
          description: Pedido criado
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreOrderRecorded' }
        '200':
          description: >-
            Pedido já registrado com os mesmos dados (ou com outro
            `pago_em`, mantido o primeiro); ou o comprovante que faltava foi
            gravado agora (`comprovante_registrado` true).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreOrderRecorded' }
        '400':
          description: >-
            INVALID_REQUEST (corpo malformado, chave faltando ou de tipo
            errado), UNKNOWN_REQUEST_FIELD, UNSUPPORTED_SCHEMA_VERSION,
            INVALID_STORE_NUMBER, INVALID_RECEIPT_URL, INVALID_PAID_AT,
            INVALID_CUSTOMER, INVALID_IDEMPOTENCY_KEY, INVALID_CORRELATION_ID
            e INVALID_X_SILMER_* dos cabeçalhos.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/N8nProblem' }
        '401': { $ref: '#/components/responses/N8nProblem' }
        '403': { $ref: '#/components/responses/N8nProblem' }
        '404': { description: Loja do site não configurada neste ambiente }
        '409':
          description: STORE_ORDER_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/N8nProblem' }
        '413': { $ref: '#/components/responses/N8nProblem' }
        '415': { $ref: '#/components/responses/N8nProblem' }
        '422':
          description: >-
            STORE_CATALOG_MISMATCH, AMOUNT_BELOW_PRICE, TEST_REFUSED ou
            PAYMENT_METHOD_UNSUPPORTED. Nada é gravado.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/N8nProblem' }
        '429':
          description: RATE_LIMITED
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/N8nProblem' }
        '503': { $ref: '#/components/responses/N8nProblem' }
  /conversations/{conversationId}/messages:
    post:
      operationId: sendHumanConversationMessage
      summary: Persiste a intenção humana e agenda o comando idempotente ao n8n
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HumanMessageCommand' }
      responses:
        '202': { description: Estado oficial e outbox gravados atomicamente }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /conversations/{conversationId}/{command}:
    post:
      operationId: changeConversationAutomationMode
      summary: Executa takeover humano
      description: >-
        A conversa com uma pessoa nunca volta para o bot (ADR 015). O comando
        `return-to-ai` foi removido: a rota não existe e responde 404, como
        qualquer rota desconhecida, antes da autenticação e sem tocar a
        conversa.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: command
          in: path
          required: true
          schema: { type: string, enum: [takeover] }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HumanConversationCommand' }
      responses:
        '202': { description: Estado oficial, auditoria e outbox gravados }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          {
            description: 'Comando inexistente, inclusive `return-to-ai` (ADR 015)',
          }
        '409': { $ref: '#/components/responses/Conflict' }
  /conversations/{conversationId}/close:
    post:
      operationId: closeConversation
      summary: Encerra explicitamente o ciclo de atendimento
      description: >-
        Somente o responsável ou administrador. Não altera o estado dos
        pedidos; se houver pendente, requer reconhecimento explícito.
        Nova mensagem válida abre um novo ciclo para a mesma identidade.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseConversationCommand' }
      responses:
        '202': { description: Ciclo encerrado, auditado e notificado ao n8n }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /conversations/{conversationId}/lead-outcome:
    get:
      operationId: getLeadOutcome
      summary: Estado do desfecho declarado do lead (MET-06–08, RFC 048)
      description: >-
        Ação conversation.read com papel relido no PostgreSQL. Somente o
        responsável atual da conversa ou administrador ativo
        (COMMERCIAL_ADMIN); outro vendedor e Financeiro recebem 403. Sem
        sessão válida é 401 INVALID_CREDENTIALS. Para não-administrador,
        conversa inexistente também é 403 (não revela existência); só o
        administrador recebe 404 CONVERSATION_NOT_FOUND. Estado
        derivado, sem escrita no caminho de entrada: `open` (nenhum
        desfecho), `lost` (último evento é perda e a última mensagem do
        cliente ainda é aquela sobre a qual a perda foi declarada),
        `reopened_by_customer` (o cliente escreveu depois da perda) e
        `reopened_manual` (correção manual). Em `reopened_manual`, motivo,
        responsável e autor descrevem a perda corrigida e `reopenedAt` é a
        correção. É a única leitura que devolve o texto de `outro`.
        Qualquer parâmetro de consulta é 400. Privada no-store, limite de 60
        leituras/minuto.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Desfecho atual do lead
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadOutcomeDetail' }
        '400': { $ref: '#/components/responses/LeadOutcomeProblem' }
        '401': { $ref: '#/components/responses/LeadOutcomeProblem' }
        '403': { $ref: '#/components/responses/LeadOutcomeProblem' }
        '404': { $ref: '#/components/responses/LeadOutcomeProblem' }
        '429':
          description: >-
            Mais de 60 leituras por minuto do mesmo cliente; corpo JSON do
            limitador, sem dados da conversa
        '503': { $ref: '#/components/responses/LeadOutcomeProblem' }
    post:
      operationId: recordLeadOutcome
      summary: Declara lead perdido com motivo ou corrige a perda (MET-06–08)
      description: >-
        Ação conversation.transition. Sem sessão válida é 401
        INVALID_CREDENTIALS; Origin/CSRF inválidos são 403. Somente o
        responsável atual ou administrador; para não-administrador,
        conversa inexistente ou alheia é 403 FORBIDDEN e só o administrador
        recebe 404 CONVERSATION_NOT_FOUND. `ownerId` é o responsável no momento e `markedBy`
        quem declarou (actorId no corpo é 400). Exige conversa com
        responsável, em modo humano e aberta (409 LEAD_NOT_ELIGIBLE). Perda
        é recusada com 409 LEAD_HAS_ORDER se o ciclo tiver pedido pendente
        ou confirmado, com 409 LEAD_AWAITING_REPLY se a última mensagem do
        cliente não tiver envio humano efetivo depois dela (ACT-06) e com
        409 LEAD_ALREADY_LOST se já houver perda ativa. Reabertura manual
        sem perda ativa é 409 LEAD_NOT_LOST. `expectedConversationVersion`
        (mensagem nova do cliente incrementa a versão) e
        `expectedOutcomeVersion` divergentes são 409 VERSION_CONFLICT. Não
        altera estado, encerramento ou versão da conversa nem pedido, e não
        usa Negócio. `reasonCode` fora da lista é 422 INVALID_LOSS_REASON;
        `outro` exige `note` normalizada em NFC, de 1–140 caracteres após
        trim, com ao menos uma letra ou número e sem caracteres de
        controle, formatação (bidi, largura zero), uso privado, não
        atribuídos ou separadores de linha (422 INVALID_LOSS_NOTE); `note`
        com outro motivo é 400. Replay da mesma chave por quem perdeu a
        posse é 403, nunca a resposta guardada. O texto é cifrado (AES-256-GCM, AAD do evento) e nunca aparece
        na resposta, em logs, auditoria (`lead.outcome.recorded` com versão
        e código do motivo), idempotência ou agregações. Mesma chave com o
        mesmo comando devolve a mesma resposta; com outro comando é 409
        IDEMPOTENCY_KEY_REUSED. Limite de 30 comandos/minuto.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadOutcomeCommand' }
      responses:
        '200':
          description: Desfecho registrado (ou replay idempotente)
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadOutcomeRecorded' }
        '400': { $ref: '#/components/responses/LeadOutcomeProblem' }
        '401': { $ref: '#/components/responses/LeadOutcomeProblem' }
        '403': { $ref: '#/components/responses/LeadOutcomeProblem' }
        '404': { $ref: '#/components/responses/LeadOutcomeProblem' }
        '409': { $ref: '#/components/responses/LeadOutcomeProblem' }
        '422': { $ref: '#/components/responses/LeadOutcomeProblem' }
        '429':
          description: >-
            Mais de 30 comandos por minuto do mesmo cliente; corpo JSON do
            limitador, sem efeito no domínio
        '503': { $ref: '#/components/responses/LeadOutcomeProblem' }
  /conversations/{conversationId}/reminder:
    post:
      operationId: setConversationReminder
      summary: Adia a conversa para o próprio ator (lembrete pessoal)
      description: >-
        Qualquer Vendedor ativo, com ou sem dono na conversa e com o agente
        ativo. Ação conversation.transition. Grava só a decisão (user_id,
        action_id) do ator, compatível com a Central de ações (ACT-05). Publica
        o evento SSE conversation.reminder_set. Não há texto livre. Sem sessão
        válida é 401 INVALID_CREDENTIALS; Origin/CSRF inválidos são 403. Conversa
        fora do universo aberto é 409 ACTION_NOT_AVAILABLE. Mesma chave com o
        mesmo comando devolve a mesma resposta; com outro comando é 409
        IDEMPOTENCY_KEY_REUSED. Limite de 30 comandos/minuto.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [remindAt, expectedVersion]
              properties:
                remindAt:
                  type: string
                  format: date-time
                  description: ISO 8601 com offset, futuro, até 90 dias
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Lembrete gravado (ou replay idempotente)
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema:
                type: object
                required: [conversationId, remindAt, decisionVersion]
                properties:
                  conversationId: { type: string }
                  remindAt: { type: string, format: date-time }
                  decisionVersion: { type: integer, minimum: 1 }
        '400':
          description: INVALID_REQUEST ou INVALID_IDEMPOTENCY_KEY
        '401':
          description: INVALID_CREDENTIALS
        '403':
          description: FORBIDDEN ou CSRF_INVALID
        '404':
          description: CONVERSATION_NOT_FOUND
        '409':
          description: VERSION_CONFLICT, ACTION_NOT_AVAILABLE ou IDEMPOTENCY_KEY_REUSED
        '422':
          description: INVALID_REMINDER_DATE
        '429':
          description: Mais de 30 comandos por minuto do mesmo cliente; corpo JSON do limitador, sem efeito no domínio
  /conversations/{conversationId}/archive:
    post:
      operationId: archiveConversation
      summary: Retira uma conversa ativa da Caixa de Entrada sem encerrá-la
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HumanConversationCommand' }
      responses:
        '202':
          {
            description: 'Conversa arquivada, com auditoria e atualização em tempo real',
          }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /conversations/{conversationId}/unarchive:
    post:
      operationId: unarchiveConversation
      summary: Restaura uma conversa arquivada à Caixa de Entrada
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HumanConversationCommand' }
      responses:
        '202':
          {
            description: 'Conversa desarquivada, com auditoria e atualização em tempo real',
          }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /handoffs/{handoffId}/claim:
    post:
      operationId: claimHumanHandoff
      summary: Reivindica atomicamente um handoff compatível ainda sem responsável
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - name: handoffId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandoffClaimRequest' }
      responses:
        '200': { description: Handoff atribuído à pessoa autenticada }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /orders:
    get:
      operationId: listOrders
      summary: Lista pedidos por status, com busca e paginação
      description: >-
        Ação order.read. Sem status, retorna Todos. A busca aceita número do
        pedido ou nome do cliente. Telefone completo deve ser enviado em
        POST /orders/search para não entrar em URL e logs. O nome do cliente
        é buscado também nos pedidos manuais sem conversa. Um pedido da loja
        é achado pelo número ou pelo número da loja (LJ-XXXXXXXX, ADR 028).
        `counts` traz o total de cada grupo
        (Confirmados e Pendentes) para a busca atual, independentemente da
        página. OLIST-T23: `cancellation` seleciona active (padrão), cancelled
        ou all; o mesmo universo é filtrado antes das contagens e paginação.
        O status comercial continua pendente/confirmado mesmo no histórico cancelado.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - name: cancellation
          in: query
          description: Situação local, independente do status comercial; active é o padrão.
          schema:
            { type: string, enum: [active, cancelled, all], default: active }
        - {
            name: status,
            in: query,
            schema: { $ref: '#/components/schemas/OrderStatus' },
          }
        - name: origin
          in: query
          description: >-
            ADR 027: `loja` mostra só os pedidos da loja do site (filtro "Loja
            do site"); `atendimento`, os pedidos de atendimento, inclusive manuais.
          schema: { $ref: '#/components/schemas/OrderOrigin' }
        - name: delivery
          in: query
          description: >-
            Painel: `overdue` lista os pedidos confirmados cuja previsão
            de entrega já passou sem "Entregue em"; `due_soon`, os previstos de
            hoje até seis dias depois (dias de São Paulo). Ordena pela previsão
            de entrega, devolve até 100 itens sem cursor e não combina com
            `status`, `origin`, `q` ou `cursor`. Pedido da loja não tem previsão
            de entrega e fica fora.
          schema: { type: string, enum: [overdue, due_soon] }
        - name: owner
          in: query
          description: >-
            Painel ("Meus pedidos pendentes"): `me` mantém só os pedidos da
            pessoa da sessão — o pedido manual de que ela é dona ou o pedido
            de uma conversa atribuída a ela. Nenhum outro valor é aceito; o
            dono nunca viaja na URL. Combina com `status` e `q`, não com
            `delivery`.
          schema: { type: string, enum: [me] }
        - {
            name: q,
            in: query,
            schema: { type: string, minLength: 1, maxLength: 128 },
          }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
      responses:
        '200':
          description: Página de pedidos
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createManualOrderForContact
      summary: Cria pedido pendente para um cliente sem exigir conversa
      description: >-
        Ação order.create. O vendedor autenticado é o responsável inicial.
        Cada chave de idempotência identifica um único pedido; a ficha nasce
        editável pelas rotas usuais do pedido.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualOrderCreateRequest' }
      responses:
        '201':
          description: Pedido criado ou repetição idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
  /orders/search:
    post:
      operationId: searchOrdersPrivate
      summary: Busca privada de pedidos, inclusive por telefone completo
      description: Ação order.read. Telefone é comparado por HMAC nas fontes disponíveis; a consulta exige sessão, Origin e CSRF e não pode ser armazenada em cache.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [q]
              properties:
                q: { type: string, minLength: 1, maxLength: 128 }
                status: { $ref: '#/components/schemas/OrderStatus' }
                cancellation:
                  {
                    type: string,
                    enum: [active, cancelled, all],
                    default: active,
                  }
                origin: { $ref: '#/components/schemas/OrderOrigin' }
                cursor: { type: string, maxLength: 1024 }
                limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Página de pedidos da consulta privada
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { description: Limite temporário de buscas privadas excedido }
  /orders/summary:
    get:
      operationId: getOrdersSummary
      summary: Retorna indicadores globais dos pedidos
      description: >-
        Ação order.read. Totais de todos os pedidos, sem recorte pela página,
        busca ou status da listagem. Vendas e peças somam somente pedidos
        confirmados; pendentes são contados à parte. Valores em centavos. Os
        pedidos da loja do site contam como qualquer venda; pedidos de teste
        (isTest) ficam fora (ADR 027). storeNewCount conta os pedidos novos do
        site — da loja, sem teste, com a ficha nunca impressa — e
        storeNewOldestPaidAt é o instante em que a InfinitePay confirmou o Pix
        do mais antigo deles, nulo quando não há (ADR 031). `period` soma as
        vendas confirmadas cujo dia do pedido cai no período escolhido;
        `deliveries` conta as entregas com previsão vencida sem "Entregue em" e
        as dos próximos sete dias. `daily` (PNL-05) traz as vendas confirmadas
        de cada um dos últimos sete dias, terminando hoje, independente de
        `period`. Os dias são de São Paulo e calculados no servidor.
        Cancelados locais ficam fora de todos os indicadores ativos, inclusive
        vendas, valor, peças, pendências, entregas e dias de `daily` (OLIST-19/46).
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - name: period
          in: query
          description: >-
            Painel: `hoje`, `7dias` (hoje e os seis dias anteriores) ou `mes`
            (do dia 1 até hoje). Padrão `hoje`.
          schema: { type: string, enum: [hoje, 7dias, mes], default: hoje }
      responses:
        '200':
          description: Indicadores globais de pedidos
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrdersSummary' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Retorna um pedido com a ficha completa
      description: Ação order.read. Preserva a consulta de pedidos cancelados e seus snapshots, motivo, autoria, histórico e pagamento no escopo comercial anterior.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Pedido
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
  /conversations/{conversationId}/order:
    get:
      operationId: getConversationOrder
      summary: Retorna o pedido atual da conversa
      description: >-
        Ação order.read. Devolve o pedido pendente da conversa ou, se não
        houver, o último confirmado. `order` é null quando a conversa não tem
        pedido.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Pedido atual ou null
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationOrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /conversations/{conversationId}/orders:
    post:
      operationId: createConversationOrder
      summary: Cria manualmente o pedido pendente da conversa
      description: >-
        Ação order.create, restrita ao dono da conversa ou a COMMERCIAL_ADMIN.
        O pedido nasce pendente, com número NN-CRM reservado, pré-preenchido
        com a pré-ficha atual da conversa. Se a conversa já tem pedido
        pendente, responde 200 com o pedido existente.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreateRequest' }
      responses:
        '200':
          description: Pedido pendente já existente ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '201':
          description: Pedido pendente criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
  /orders/{orderId}/sections/{section}:
    patch:
      operationId: patchOrderSection
      summary: Substitui uma seção inteira da ficha de um pedido pendente
      description: >-
        Ação order.edit, restrita ao dono da conversa ou a COMMERCIAL_ADMIN.
        `value` substitui a seção inteira; total de peças e campos faltantes
        são recalculados. Pedido confirmado não aceita edição (409); é preciso
        reabrir. OLIST-T10: snapshot Olist reservado, enviado, vinculado ou com
        efeito incerto bloqueia alteração (409 ORDER_OLIST_LOCKED). OLIST-T20/T21: size-pricing recebe um comando fechado de
        composição, não uma substituição. initialize adota explicitamente só
        pendente nunca confirmado; não infere valores históricos. Demais ações
        referenciam IDs emitidos pelo servidor. Após adoção, items legado é
        recusado e a projeção automática não sobrescreve a composição humana.
        Total monetário é calculado e gravado junto da ficha; mudar o total
        anterior invalida quitação/check sem apagar histórico. Sem interface
        de adoção ou envio Olist nesta entrega.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - name: section
          in: path
          required: true
          schema: { $ref: '#/components/schemas/OrderSection' }
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderSectionPatchRequest' }
      responses:
        '200':
          description: Seção gravada ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
        '422': { $ref: '#/components/responses/OrderUnprocessable' }
  /orders/{orderId}/price-breakdown:
    get:
      operationId: getOrderPriceBreakdown
      summary: Consulta composição suplementar de legado ou loja
      description: >-
        OLIST-T26/T24. Ação order.read no escopo comercial existente; loja exige
        Admin comercial. Retorna revisão/autor e IDs estáveis, com pendências
        explícitas se ausente, incompleta ou obsoleta. Na loja inclui cadastro
        suplementar cifrado em repouso, sem criar Contato nem alterar checkout,
        ficha, total ou gateway. Cache privado no-store. pricing.complete indica
        só preços; issues ainda pode conter pendências fiscais e comerciais.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Fonte suplementar, sem HMAC/envelope interno
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPriceBreakdown' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
    post:
      operationId: saveOrderPriceBreakdown
      summary: Enriquece legado ou loja sem regravar a ficha
      description: >-
        OLIST-T26. Humano responsável/Admin com order.edit, sessão, CSRF,
        Origin, Idempotency-Key e expectedVersion. Autoridade atual é revalidada
        antes de replay e sob lock. initialize em legado emite IDs sem inferir
        preços; set_subtotals exige cobertura completa por identidade e soma
        igual ao total preservado quando completo. Preços null salvam rascunho.
        Alteração comercial da fonte exige initialize explícito e nova revisão.
        Loja exige Admin comercial ativo: initialize toma o total persistido da
        única linha validada, sem rateio ou catálogo atual; set_store_details
        salva previsão, Aplicação por groupId e cadastro fiscal explícitos.
        Campos ausentes permanecem pendência; dados originais presentes não
        podem ser substituídos por valores diferentes. Loja recusa set_subtotals
        e mantém suas travas de edição/reabertura/confirmação. Composição T21
        não usa esta mutação. Reserva/efeito Olist em qualquer conta bloqueia.
        Revisão cifrada append-only, incremento
        da versão do Pedido, evento, auditoria e recibo compartilham transação.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, value]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                value:
                  { $ref: '#/components/schemas/OrderPriceBreakdownCommand' }
      responses:
        '200':
          description: Revisão gravada ou replay autorizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPriceBreakdown' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
        '422': { $ref: '#/components/responses/OrderUnprocessable' }
  /orders/{orderId}/store-correction:
    post:
      operationId: correctStoreOrderQuantity
      summary: Corrige quantidade confirmada pelo usuario num pedido da loja
      description: >-
        LOJ-39/40/41. Sessao humana com COMMERCIAL_ADMIN, CSRF, Origin e
        Idempotency-Key; guarda order.edit e administrador validado na transacao.
        Somente produto unitario, um item e uma grade, sem teste. Exige versao
        e valores anteriores exatos. Calcula subtotal pelo catalogo, recusa
        pagamento insuficiente (422 AMOUNT_BELOW_PRICE). Preserva IDs, pagamento,
        confirmacao, primeira impressao e fingerprint original. Audita sem PII.
        Snapshot Olist reservado, enviado/vinculado ou incerto bloqueia a
        correção com 409 ORDER_OLIST_LOCKED.
        Mesma chave/corpo retorna o resultado. Outra chave com snapshot obsoleto
        retorna 409 VERSION_CONFLICT ou STORE_ORDER_CONFLICT. Chave reutilizada
        com outro corpo retorna 409 IDEMPOTENCY_KEY_REUSED. Campos invalidos
        retornam 400 INVALID_REQUEST, INVALID_EXPECTED_VERSION ou INVALID_CORRECTION_REASON.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  expectedVersion,
                  expectedQuantity,
                  expectedAmountCents,
                  quantity,
                  reason,
                ]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                expectedQuantity: { type: integer, minimum: 1 }
                expectedAmountCents: { type: integer, minimum: 1 }
                quantity: { type: integer, minimum: 1, maximum: 10 }
                reason: { type: string, const: USER_CONFIRMED_QUANTITY }
      responses:
        '200':
          description: Pedido corrigido ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
        '422': { $ref: '#/components/responses/OrderUnprocessable' }
  /orders/{orderId}/confirm:
    post:
      operationId: confirmOrder
      summary: Confirma o pedido pelo total calculado e condição de pagamento
      description: >-
        Ação order.confirm, restrita ao dono da conversa ou a COMMERCIAL_ADMIN.
        OLIST-T21: calcula o total de subtotais completos/revisados, sem
        fallback para preço livre ou rateio de legado. amountText pode ser
        omitido; declaração antiga só é aceita se igual à soma calculada.
        Exige forma de pagamento válida (campo paymentCondition), ao menos um item e,
        em cada item, os pontos principais das ADRs 016 e 020 (tipo, cor,
        aplicação em tipo_servico, ao menos um tecido, ao menos uma linha de
        tamanho e gola), quem faz a arte do pedido (chave artwork) e a previsão
        de entrega do resumo como dia AAAA-MM-DD; paidOn e deliveredOn não
        bloqueiam. Recusa com 422 ORDER_NOT_CONFIRMABLE e as chaves de
        Order.missingFields que faltam. Grava valor, forma de pagamento,
        autor, horário e data do pedido. Numa nova confirmação depois
        de reabrir, autor, horário e data passam a ser os da nova confirmação.
        Confirmações concorrentes sobre a mesma versão: uma vence e a outra
        recebe 409. OLIST-T10: pendente já exportado/vinculado só confirma com
        ficha, cliente congelado, total e condição idênticos; o envelope original
        e o snapshot Olist permanecem intactos. Divergência recebe 409
        ORDER_OLIST_SNAPSHOT_MISMATCH; operação ainda em curso/incerta recebe
        ORDER_OLIST_LOCKED. Confirmação não declara quitação nem inicia exportação Olist.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderConfirmRequest' }
      responses:
        '200':
          description: Pedido confirmado ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
        '422': { $ref: '#/components/responses/OrderUnprocessable' }
  /orders/{orderId}/cancel:
    post:
      operationId: cancelOrderLocally
      summary: Cancela o pedido localmente antes da reserva de venda no ERP
      description: >-
        OLIST-T23 / ADR 061. Ação order.cancel com ACL comercial atual:
        responsável humano ativo ou COMMERCIAL_ADMIN; loja exige Admin ativo.
        Habilitação Olist não concede cancelamento alheio. Motivo obrigatório,
        aparado, de 1 a 1000 caracteres e sem caracteres de controle; fica cifrado.
        Versão, cancelamento terminal, invalidação da exportação ainda não reservada,
        evento, auditoria e recibo idempotente compartilham a transação.
        Revalida autoridade antes do replay. Mesma chave/corpo repete a resposta;
        corpo divergente ou versão obsoleta conflitam. Reserva de venda, tentativa
        não rejeitada, ID remoto observado, vínculo, confirmação ou resultado incerto
        em qualquer conta bloqueiam a ação. Não exclui, reabre, estorna, desfaz
        pagamento/Nota criada ou cancela no ERP. Snapshots, checkout e recursos
        remotos já criados permanecem. Pedidos pagos/loja mantêm o pagamento e
        qualquer obrigação financeira/fiscal anterior.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, reason]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  pattern: '^[^\u0000-\u001f\u007f]+$'
      responses:
        '200':
          description: Pedido cancelado ou replay idempotente; effectiveStatus cancelado e status comercial preservado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
        '422': { $ref: '#/components/responses/OrderUnprocessable' }
  /orders/{orderId}/reopen:
    post:
      operationId: reopenOrder
      summary: Reabre um pedido confirmado
      description: >-
        Ação order.reopen, restrita ao dono da conversa ou a COMMERCIAL_ADMIN.
        Só a partir de confirmado. Volta a pendente mantendo número, valor e
        condição, registra autor e horário da reabertura e bloqueia a
        impressão. Pedido cancelado é terminal e recebe 409 ORDER_CANCELLED.
        Snapshot Olist reservado, enviado/vinculado ou com efeito incerto
        impede reabertura (409 ORDER_OLIST_LOCKED).
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderReopenRequest' }
      responses:
        '200':
          description: Pedido reaberto ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
  /orders/delivery-tasks:
    get:
      operationId: listManualOrderDeliveryTasks
      summary: Lista as entregas a confirmar pelo vendedor da sessão
      description: >-
        PLA-10 / T136. Somente pedidos manuais sem conversa, confirmados, sem
        Entregue em e que não são testes, cujo responsável é a pessoa da sessão.
        Ordenados pela previsão de entrega e número; pedidos sem prazo vêm ao fim.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Afazeres de entrega do responsável
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /orders/{orderId}/delivery-confirmation:
    post:
      operationId: confirmManualOrderDelivery
      summary: Confirma a entrega e registra o dia de hoje em São Paulo
      description: >-
        PLA-11 / T136. Autoriza com order.milestones, restrito ao responsável ou
        COMMERCIAL_ADMIN. Apenas pedido manual confirmado e fora de teste.
        Preserva Pago em, status e snapshot; não aceita data do cliente.
        Auditoria order.delivery.confirm, controle de versão e replay idempotente.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Entrega confirmada ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
  /orders/{orderId}/milestones:
    patch:
      operationId: recordOrderMilestones
      summary: Registra quando o cliente pagou e quando o pedido foi entregue
      description: >-
        Ação order.milestones, restrita ao dono da conversa ou a
        COMMERCIAL_ADMIN (ADR 008). Vale para pedido pendente ou confirmado,
        sem reabrir, e nunca muda o status nem bloqueia a confirmação. As duas
        datas vão juntas para pedidos com conversa; em pedidos manuais sem
        conversa somente paidOn é aceito e deliveredOn é preservado (ADR 039).
        null limpa a data editável. Data inválida ou depois
        de hoje (horário de São Paulo) responde 422 INVALID_DATE com os campos
        recusados.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderMilestonesRequest' }
      responses:
        '200':
          description: Datas gravadas ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
        '422': { $ref: '#/components/responses/OrderUnprocessable' }
  /orders/{orderId}/print:
    get:
      operationId: printOrder
      summary: Retorna a ficha de pedido no template ficha-canonical-v3
      description: >-
        Ação order.print, disponível a qualquer usuário operacional. Só para
        pedido confirmado; pendente responde 409 ORDER_NOT_CONFIRMED. HTML A4
        paisagem, duas páginas, impresso pelo navegador. O documento não traz
        valor, condição de pagamento nem a faixa de amostra sintética; vendedor
        é quem confirmou, data é a data do pedido e o controle de produção sai
        em branco. Um pedido da loja do site (ADR 027) sai na ficha
        simplificada ficha-loja-v1 (A4 retrato, uma página, só os campos
        padrão). Com download=1, o mesmo documento vem como anexo
        pedido-NN-CRM.html. ADR 031: a primeira impressão ou download da ficha
        de um pedido da loja por uma pessoa grava fichaFirstPrintedAt e
        fichaFirstPrintedBy, publica o evento order.ficha_first_printed (ao
        vivo inbox.order.changed) e audita order.ficha.first_print, sem PII;
        as seguintes não mudam nada. A autorização não muda.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/HumanReadOrigin'
        - name: download
          in: query
          schema: { type: string, const: '1' }
      responses:
        '200':
          description: Documento HTML pronto para impressão
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-cache' } }
          content:
            text/html:
              schema: { type: string }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
  /orders/{orderId}/pdf:
    get:
      operationId: downloadOrderPdf
      summary: Gera a ficha de pedido em PDF para baixar ou compartilhar
      description: >-
        ADR 037. Usa order.print e o mesmo template da rota HTML, somente para
        pedido confirmado. Responde com o anexo privado pedido-NN-CRM.pdf.
        A geração bem-sucedida da primeira ficha de um pedido da loja registra
        o primeiro acesso da ADR 031; HEAD, falha e acesso negado não registram.
        O servidor não armazena o PDF nem envia ao WhatsApp.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Ficha em PDF
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-store' } }
            Content-Disposition: { schema: { type: string } }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /orders/{orderId}/files:
    get:
      operationId: listOrderFiles
      summary: Lista a arte final e os arquivos da arte do pedido (ADR 023)
      description: >-
        Ação order.read. Sem OBJECT_STORAGE_* configurado responde 503 e o
        resto do pedido continua disponível.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Arquivos do pedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderFiles' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      operationId: uploadOrderFile
      summary: Envia um arquivo da arte ou a arte final
      description: >-
        Ação order.edit, restrita ao dono da conversa ou a COMMERCIAL_ADMIN e
        ao pedido pendente (409 ORDER_STATUS_CONFLICT). Até 5 arquivos
        `reference` (409 FILE_LIMIT_REACHED) e uma arte `final`, que substitui
        a anterior; 10 MB cada (413 FILE_TOO_LARGE). A extensão precisa estar
        na allowlist e o conteúdo precisa ter a assinatura dela (422
        FILE_TYPE_NOT_ALLOWED ou FILE_CONTENT_MISMATCH). A sessão é checada
        antes de o corpo ser lido. Replay com a mesma Idempotency-Key e os
        mesmos bytes devolve a primeira resposta.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/OrderFileUpload' }
      responses:
        '201':
          description: Arquivo guardado ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderFiles' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
        '413': { $ref: '#/components/responses/OrderUnprocessable' }
        '422': { $ref: '#/components/responses/OrderUnprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /orders/{orderId}/files/{fileId}:
    delete:
      operationId: removeOrderFile
      summary: Remove um arquivo da arte ou a arte final
      description: >-
        Ação order.edit, mesmas regras do envio. Apaga a linha e os objetos
        (arquivo e miniatura) do RustFS.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/OrderFileId'
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: Arquivos que restaram ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderFiles' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409': { $ref: '#/components/responses/OrderConflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /orders/{orderId}/files/{fileId}/content:
    get:
      operationId: downloadOrderFile
      summary: Baixa o arquivo original como anexo
      description: >-
        Ação order.read, também para pedido confirmado. Sempre anexo, com
        nosniff e CSP sandbox; o download entra na auditoria.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/OrderFileId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Bytes do arquivo
          headers:
            Content-Disposition:
              { schema: { type: string, pattern: '^attachment; ' } }
            Content-Security-Policy:
              { schema: { type: string, const: "default-src 'none'; sandbox" } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /orders/{orderId}/files/{fileId}/thumbnail:
    get:
      operationId: getOrderFileThumbnail
      summary: Miniatura WebP de uma imagem enviada
      description: >-
        Ação order.read. Só existe para PNG, JPEG e WebP enviados com
        miniatura; os demais respondem 404 FILE_NOT_FOUND.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/OrderFileId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Miniatura de até 320 px
          content:
            image/webp:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /finance/orders:
    get:
      operationId: listFinanceOrders
      summary: Lista confirmados integralmente pagos e não teste (FINQ-04–06)
      description: >-
        Financeiro ou Admin ativo. Legados manuais não revisados ficam fora.
        Aguardando ordena paidOn ascendente; concluídos completedAt descendente,
        com número e id como desempate. Contagens usam o mesmo universo.
        OLIST-46: cancelados ficam fora antes de contar e paginar, preservando
        consulta histórica por ID sob a elegibilidade financeira anterior.
        Respostas privadas no-store; nenhuma conversa, arte ou dado fiscal.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - in: query
          name: status
          schema: { type: string, enum: [waiting, completed], default: waiting }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 1024 }
      responses:
        '200':
          description: Página da fila financeira
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancePage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /finance/orders/{orderId}:
    get:
      operationId: getFinanceOrder
      summary: Consulta mínima e histórico financeiro de pedido elegível
      description: >-
        OLIST-46: pedido cancelado que satisfaz a elegibilidade financeira anterior
        permanece consultável por ID, com cancelledAt e canManage false. Pagamento,
        Nota criada e eventos anteriores permanecem; cancelamento não é estorno.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/HumanReadOrigin'
      responses:
        '200':
          description: Consulta; canManage false para Admin e pedido cancelado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceResponse' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /finance/orders/{orderId}/complete:
    post:
      operationId: completeFinanceOrder
      summary: Declara rotina concluída (Nota criada); exclusivo Financeiro
      description: >-
        Não comprova autorização Sefaz. Revalida ator, elegibilidade e versões
        sob lock; estado, histórico, auditoria e idempotência na mesma transação.
        Limite 30 comandos/minuto. Admin não recebe esta ação.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinanceCommand' }
      responses:
        '200':
          description: Conclusão ou replay do mesmo comando
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { description: Limite de comandos excedido }
        '503': { $ref: '#/components/responses/Unavailable' }
  /finance/orders/{orderId}/reopen:
    post:
      operationId: reopenFinanceOrder
      summary: Desfaz check preservando histórico; exclusivo Financeiro
      description: >-
        Usa as mesmas garantias transacionais de complete. Não reabre o
        pedido comercial. Conflito ou resposta incerta exige releitura.
      security: [{ sessionCookie: [], csrfHeader: [], idempotencyKey: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinanceCommand' }
      responses:
        '200':
          description: Correção ou replay do mesmo comando
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { description: Limite de comandos excedido }
        '503': { $ref: '#/components/responses/Unavailable' }
  /dashboard/metrics/service:
    get:
      operationId: getDashboardServiceMetrics
      summary: Tempos de atendimento no expediente e conversas sem resposta (RFC 048)
      description: >-
        Ação conversation.read com papel relido no PostgreSQL (PERF-07).
        Vendedor ativo recebe só a própria linha; administrador ativo
        (COMMERCIAL_ADMIN) recebe a equipe e o bloco `team`. Financeiro e
        conta desativada recebem 403. Qualquer chave além de `days`
        (actorId, userId, scope) é 400 INVALID_REQUEST; outro valor de
        `days` é 400 INVALID_FILTER. Janela de 7 ou 30 dias civis até hoje
        em São Paulo; coorte = pedidos de atendimento (handoffs) criados na
        janela. Minutos são de expediente pela política `expediente-v1`
        (`crm.business_minutes_v1`, ADR 061): segunda a sexta, 09:00–12:00 e
        13:00–18:00 America/Sao_Paulo, sem feriados. Tempo para assumir vai
        do pedido até a tomada. A 1ª resposta não se sobrepõe a ele: começa
        na tomada se havia mensagem do cliente sem resposta humana efetiva
        naquele instante, senão na primeira mensagem do cliente posterior, e
        termina no primeiro envio humano efetivo depois desse início; aberta
        e encerrada sem resposta usam a mesma base. Ambos são creditados a
        quem assumiu; tomada direta sem pedido não gera amostra. Resposta efetiva é envio humano
        `sent` sem entrega `failed`/`outcome_unknown`; bot e sistema não
        contam. Mediana e p90 por percentil contínuo, em minutos com uma
        casa; sem amostra é nulo e p90 é nulo com menos de 5 amostras.
        `unansweredNow` é o retrato das conversas abertas do vendedor em
        modo humano cuja espera do cliente passa de 15 minutos de
        expediente. `unansweredEpisodes` conta cada espera que passou de 15
        minutos e cujo instante de cruzamento caiu na janela, creditada a
        quem era dono da conversa nesse instante. Contas inativas preservam
        autoria. Leitura privada no-store, limite de 60 leituras/minuto.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - in: query
          name: days
          schema: { type: string, enum: ['7', '30'], default: '7' }
      responses:
        '200':
          description: Métricas de atendimento do período
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardServiceMetrics' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { description: Limite de leituras excedido }
        '503': { $ref: '#/components/responses/Unavailable' }
  /dashboard/metrics/losses:
    get:
      operationId: getDashboardLossMetrics
      summary: Leads perdidos declarados no período, por motivo (MET-06–08)
      description: >-
        Mesmo escopo e validação de `/dashboard/metrics/service`: vendedor
        ativo recebe só a própria linha, administrador ativo recebe a equipe
        e `totals`, Financeiro recebe 403 e sem sessão válida é 401
        INVALID_CREDENTIALS (corpo application/problem+json com `code`); chave além de `days` é 400
        INVALID_REQUEST e outro valor de `days` é 400 INVALID_FILTER. Uma
        perda é efetiva salvo quando a versão seguinte é uma reabertura
        manual (correção). Cada conversa conta uma vez, pela última perda
        efetiva marcada na janela, que define o responsável (dono no momento
        da marcação) e o motivo. Perda reaberta pelo cliente continua
        contando e soma também em `reopenedByCustomerCount`. Só códigos de
        motivo; o texto livre nunca é lido. Privada no-store, limite de 60
        leituras/minuto.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/HumanReadOrigin'
        - in: query
          name: days
          schema: { type: string, enum: ['7', '30'], default: '7' }
      responses:
        '200':
          description: Perdas declaradas do período
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardLossMetrics' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          description: >-
            Mais de 60 leituras por minuto do mesmo cliente; corpo JSON do
            limitador
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    automationBasic:
      type: http
      scheme: basic
      description: Credencial exclusiva e rotacionável do AUTOMATION_EXECUTOR.
    sessionCookie:
      type: apiKey
      in: cookie
      name: crm_session
      description: Cookie opaco HttpOnly, Secure e SameSite=Lax.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Deve corresponder ao cookie Secure crm_csrf.
    idempotencyKey:
      type: apiKey
      in: header
      name: Idempotency-Key
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema: { type: string, format: uri }
    OriginOptional:
      name: Origin
      in: header
      required: false
      description: Obrigatório para autenticação humana; não usado pelo ator técnico.
      schema: { type: string, format: uri }
    OrderFileId:
      name: fileId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 512 }
    HumanReadOrigin:
      name: Origin
      in: header
      required: false
      description: >-
        Se presente, deve pertencer à allowlist. Se ausente, o navegador deve
        enviar Sec-Fetch-Site same-origin ou none.
      schema: { type: string, format: uri }
    BootstrapToken:
      name: X-Bootstrap-Token
      in: header
      required: true
      schema: { type: string, minLength: 32 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    WorkflowKey:
      name: X-Silmer-Workflow-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    WorkflowVersion:
      name: X-Silmer-Workflow-Version
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    ExecutionId:
      name: X-Silmer-Execution-Id
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    ContentSha256:
      name: X-Silmer-Content-SHA256
      in: header
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{64}$' }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ContactId:
      name: contactId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    DealId:
      name: dealId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  schemas:
    OlistExistingPreview:
      type: object
      additionalProperties: false
      required:
        [
          orderId,
          eligible,
          sale,
          versions,
          expiresAt,
          previewToken,
          creationEnabled,
        ]
      properties:
        orderId: { type: string }
        eligible: { const: true }
        creationEnabled: { const: false }
        sale:
          type: object
          additionalProperties: false
          required: [id, number]
          properties:
            id: { type: string, pattern: '^[1-9][0-9]{0,15}$' }
            number: { type: string }
        versions:
          type: object
          additionalProperties: false
          required: [order, operation, settings, connection, authorization]
          properties:
            order: { type: integer, minimum: 1 }
            operation: { type: integer, minimum: 0 }
            settings: { type: integer, minimum: 0 }
            connection: { type: integer, minimum: 0 }
            authorization: { type: integer, minimum: 0 }
        expiresAt: { type: string, format: date-time }
        previewToken:
          { type: string, maxLength: 262144, pattern: '^[A-Za-z0-9_-]+$' }
    OlistExistingLinkReceipt:
      type: object
      additionalProperties: false
      required: [operationId, orderId, state, stage, number, creationEnabled]
      properties:
        operationId: { type: string, format: uuid }
        orderId: { type: string }
        state: { enum: [linked, confirmed] }
        stage: { const: complete }
        number:
          {
            type: string,
            description: Número ERP conferido; nenhum link compartilhável é inferido.,
          }
        creationEnabled: { const: false }
    OlistReadRequest:
      type: object
      additionalProperties: false
      required: [id, requestId, exportId, resourceId, stage, status, version]
      properties:
        id: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        exportId: { type: string, format: uuid }
        resourceId: { type: [string, 'null'], format: uuid }
        stage: { enum: [customer, product, variation, sale] }
        status: { enum: [queued, succeeded, blocked] }
        version: { type: integer, minimum: 1 }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$' }
        actorId:
          { type: string, description: Presente no diagnóstico administrativo. }
    OlistAdministration:
      type: object
      additionalProperties: false
      required:
        [operation, resources, requests, attempts, attemptHistoryTruncated]
      properties:
        operation:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [id, actorId, version, state, stage, number]
              properties:
                id: { type: string, format: uuid }
                actorId: { type: string }
                version: { type: integer, minimum: 1 }
                state:
                  {
                    enum:
                      [
                        queued,
                        resolving,
                        ready,
                        reserved,
                        confirmed,
                        linked,
                        uncertain,
                        rejected,
                        invalidated,
                      ],
                  }
                stage: { enum: [customer, product, variation, sale, complete] }
                number: { type: [string, 'null'] }
                errorCode: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$' }
        resources:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [id, kind, state, version, remoteId, parentId]
            properties:
              id: { type: string, format: uuid }
              kind: { enum: [customer, product, variation] }
              state:
                { enum: [pending, reserved, confirmed, uncertain, rejected] }
              version: { type: integer, minimum: 0 }
              remoteId: { type: [string, 'null'] }
              parentId: { type: [string, 'null'], format: uuid }
        requests:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/OlistReadRequest' }
        attemptHistoryTruncated: { type: boolean }
        attempts:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
              [
                id,
                resourceId,
                stage,
                outcome,
                observedRemoteId,
                code,
                createdAt,
                finishedAt,
              ]
            properties:
              id: { type: string, format: uuid }
              resourceId: { type: [string, 'null'], format: uuid }
              stage: { enum: [customer, product, variation, sale] }
              outcome: { enum: [reserved, uncertain, confirmed, rejected] }
              observedRemoteId: { type: [string, 'null'] }
              code: { type: [string, 'null'] }
              createdAt: { type: string, format: date-time }
              finishedAt: { type: [string, 'null'], format: date-time }
    OlistExportCommandReceipt:
      type: object
      additionalProperties: false
      required: [operationId, orderId, number, state, stage, creationEnabled]
      properties:
        operationId: { type: string, format: uuid }
        orderId: { type: string }
        number: { type: string }
        state:
          {
            enum:
              [
                queued,
                resolving,
                ready,
                reserved,
                confirmed,
                linked,
                uncertain,
                rejected,
                invalidated,
              ],
          }
        stage: { enum: [customer, product, variation, sale, complete] }
        creationEnabled: { const: false }
    OlistPreviewResolution:
      type: object
      additionalProperties: false
      required: [action, remoteId]
      properties:
        action: { enum: [reuse, create, blocked] }
        remoteId: { type: [string, 'null'] }
    OlistPreview:
      type: object
      additionalProperties: false
      required:
        [
          orderId,
          number,
          status,
          eligible,
          creationEnabled,
          issues,
          commercial,
          customer,
          registrations,
          versions,
          expiresAt,
          previewToken,
        ]
      properties:
        orderId: { type: string }
        number: { type: string }
        status: { enum: [pendente, confirmado] }
        eligible: { type: boolean }
        creationEnabled: { const: false }
        issues:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, field]
            properties:
              code: { type: string }
              field: { type: string }
        customer:
          oneOf:
            - { type: 'null' }
            - type: object
              additionalProperties: false
              required: [name, documentSuffix]
              properties:
                name: { type: string }
                documentSuffix: { type: string, minLength: 4, maxLength: 4 }
        commercial:
          type: object
          additionalProperties: false
          required:
            [groups, totalCents, orderDate, deliveryOn, paymentCondition]
          properties:
            totalCents: { type: [integer, 'null'], minimum: 1 }
            orderDate: { type: [string, 'null'], format: date }
            deliveryOn: { type: [string, 'null'], format: date }
            paymentCondition: { type: [string, 'null'] }
            groups:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [groupId, attributes, lines]
                properties:
                  groupId: { type: string, format: uuid }
                  attributes:
                    type: object
                    additionalProperties: false
                    required:
                      [garment, color, fabric, application, collar, audience]
                    properties:
                      garment: { type: string }
                      color: { type: string }
                      fabric: { type: string }
                      application: { type: string }
                      collar: { type: string }
                      audience: { type: string }
                  lines:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        [
                          groupId,
                          lineId,
                          size,
                          quantity,
                          subtotalCents,
                          unitCents,
                          unitLexeme,
                        ]
                      properties:
                        groupId: { type: string, format: uuid }
                        lineId: { type: string, format: uuid }
                        size: { type: string }
                        quantity: { type: integer, minimum: 1 }
                        subtotalCents: { type: integer, minimum: 1 }
                        unitCents: { type: integer, minimum: 1 }
                        unitLexeme:
                          { type: string, pattern: '^[0-9]+\.[0-9]{2}$' }
        registrations:
          oneOf:
            - { type: 'null' }
            - type: object
              additionalProperties: false
              required: [customer, groups, issues]
              properties:
                customer:
                  { $ref: '#/components/schemas/OlistPreviewResolution' }
                issues:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [code, field]
                    properties:
                      code: { type: string }
                      field: { type: string }
                groups:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [groupId, action, remoteId, lines]
                    properties:
                      groupId: { type: string, format: uuid }
                      action: { enum: [reuse, create, blocked] }
                      remoteId: { type: [string, 'null'] }
                      lines:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          required: [lineId, action, remoteId]
                          properties:
                            lineId: { type: string, format: uuid }
                            action: { enum: [reuse, create, blocked] }
                            remoteId: { type: [string, 'null'] }
        versions:
          type: object
          additionalProperties: false
          required: [order, source, buyer, settings, connection, authorization]
          properties:
            order: { type: integer, minimum: 1 }
            source: { type: integer, minimum: 0 }
            buyer: { type: [integer, 'null'], minimum: 1 }
            settings: { type: integer, minimum: 0 }
            connection: { type: integer, minimum: 0 }
            authorization: { type: integer, minimum: 0 }
        expiresAt: { type: [string, 'null'], format: date-time }
        previewToken: { type: [string, 'null'], maxLength: 262144 }

    OlistEmptyCommand:
      type: object
      additionalProperties: false
      maxProperties: 0
    OlistVersionCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    OlistSettings:
      type: object
      additionalProperties: false
      required:
        [
          sellerId,
          operationNatureId,
          warehouseId,
          paymentMethodId,
          priceListId,
          originId,
          paymentTerms,
          purchaseOrder,
        ]
      properties:
        sellerId:
          { type: [integer, 'null'], minimum: 1, maximum: 9007199254740991 }
        operationNatureId:
          { type: [integer, 'null'], minimum: 1, maximum: 9007199254740991 }
        warehouseId:
          { type: [integer, 'null'], minimum: 1, maximum: 9007199254740991 }
        paymentMethodId:
          { type: [integer, 'null'], minimum: 1, maximum: 9007199254740991 }
        priceListId:
          { type: [integer, 'null'], minimum: 1, maximum: 9007199254740991 }
        originId:
          { type: [integer, 'null'], minimum: 1, maximum: 9007199254740991 }
        productFiscal:
          description: Política explícita para novos produtos, sem default e cifrada na revisão central; campo aditivo opcional.
          oneOf:
            - { type: 'null' }
            - type: object
              additionalProperties: false
              required: [ncm, origin, unit]
              properties:
                ncm: { type: string, pattern: '^[0-9]{8}$' }
                origin: { type: integer, minimum: 0, maximum: 8 }
                unit: { type: string, pattern: '^[A-Z0-9]{1,6}$' }
        paymentDueOn:
          description: Vencimento único explícito do total no ERP; não é data de recebimento nem deriva da legenda paymentTerms.
          type: [string, 'null']
          format: date
        receivingMethodId:
          { type: [integer, 'null'], minimum: 1, maximum: 9007199254740991 }
        paymentTerms: { type: [string, 'null'], minLength: 1, maxLength: 120 }
        purchaseOrder: { type: [string, 'null'], minLength: 1, maxLength: 120 }
    OlistStatus:
      type: object
      additionalProperties: false
      required:
        [
          configured,
          connected,
          reconnectRequired,
          environment,
          version,
          generation,
          expiresAt,
          accountConfigured,
          creationEnabled,
          settingsVersion,
          settings,
        ]
      properties:
        configured: { type: boolean }
        connected: { type: boolean }
        reconnectRequired: { type: boolean }
        environment: { const: production }
        version: { type: integer, minimum: 0 }
        generation: { type: integer, minimum: 0 }
        expiresAt: { type: [string, 'null'], format: date-time }
        accountConfigured: { type: boolean }
        creationEnabled:
          {
            const: false,
            description: Inclusões ERP permanecem desligadas na fase 2.,
          }
        settingsVersion: { type: integer, minimum: 0 }
        settings: { $ref: '#/components/schemas/OlistSettings' }
    OlistOrderProjection:
      type: object
      additionalProperties: false
      required:
        [orderId, number, status, creationEnabled, pendingFields, operation]
      properties:
        orderId: { type: string }
        number: { type: string }
        status: { enum: [pendente, confirmado] }
        creationEnabled: { const: false }
        pendingFields:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, label]
            properties:
              code: { const: OLIST_CREATION_DISABLED }
              label: { const: Geração Olist ainda indisponível. }
        operation:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [state, stage, number]
              properties:
                state:
                  {
                    enum:
                      [
                        queued,
                        resolving,
                        ready,
                        reserved,
                        confirmed,
                        linked,
                        uncertain,
                        rejected,
                        invalidated,
                      ],
                  }
                stage: { enum: [customer, product, variation, sale, complete] }
                number: { type: [string, 'null'] }
                errorCode: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$' }
    OlistProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type: { const: 'about:blank' }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code:
          type: string
          description: Código público allowlisted; exceções desconhecidas retornam SERVICE_UNAVAILABLE, sem payload ou mensagem do provedor.
    OlistBoundaryError:
      type: object
      description: Resposta de limite do servidor HTTP, antes do handler de domínio.
      required: [statusCode, error, message]
      properties:
        statusCode: { type: integer, enum: [413, 429] }
        error: { type: string }
        message: { type: string }
    ConversationShippingQuoteResponse:
      type: object
      additionalProperties: false
      required: [quote]
      properties:
        quote:
          oneOf:
            - type: 'null'
            - type: object
              required:
                [
                  id,
                  conversationId,
                  subjectId,
                  orderId,
                  orderVersion,
                  input,
                  services,
                  unavailable,
                  totalPieces,
                  createdAt,
                  createdBy,
                  selectedServiceId,
                  stale,
                ]
              properties:
                id: { type: string }
                conversationId: { type: string }
                subjectId: { type: string }
                orderId: { type: string }
                orderVersion: { type: integer }
                environment: { type: string, enum: [sandbox, production] }
                input:
                  type: object
                  description: CEPs, peso, medidas e seguro informados; cifrados na persistência
                services:
                  type: array
                  items:
                    type: object
                    required: [id, company, name, priceCents, deliveryDays]
                    properties:
                      id: { type: integer }
                      company: { type: string }
                      name: { type: string }
                      priceCents: { type: integer, minimum: 0 }
                      deliveryDays: { type: integer, minimum: 0 }
                unavailable:
                  type: array
                  items: { type: object }
                totalPieces: { type: integer }
                selectedServiceId: { type: [integer, 'null'] }
                selectedAt: { type: [string, 'null'], format: date-time }
                createdAt: { type: string, format: date-time }
                createdBy:
                  type: object
                  required: [id, name]
                  properties:
                    id: { type: string }
                    name: { type: string }
                stale: { type: boolean }
    FinanceCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion, expectedFinanceVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        expectedFinanceVersion: { type: integer, minimum: 0 }
    DashboardTimeMetric:
      type: object
      additionalProperties: false
      required: [samples, medianMinutes, p90Minutes]
      properties:
        samples: { type: integer, minimum: 0 }
        medianMinutes: { type: [number, 'null'], minimum: 0 }
        p90Minutes:
          type: [number, 'null']
          minimum: 0
          description: Nulo com menos de 5 amostras.
    DashboardServiceMetricsRow:
      type: object
      additionalProperties: false
      required:
        [userId, name, active, firstResponse, claim, unansweredNow, unansweredEpisodes]
      properties:
        userId: { type: string }
        name: { type: [string, 'null'] }
        active: { type: boolean }
        firstResponse:
          allOf:
            - $ref: '#/components/schemas/DashboardTimeMetric'
            - type: object
              required: [openCount, oldestOpenMinutes, closedWithoutReply]
              properties:
                openCount: { type: integer, minimum: 0 }
                oldestOpenMinutes: { type: [number, 'null'], minimum: 0 }
                closedWithoutReply: { type: integer, minimum: 0 }
        claim: { $ref: '#/components/schemas/DashboardTimeMetric' }
        unansweredNow:
          type: object
          additionalProperties: false
          required: [count, oldestWaitingMinutes]
          properties:
            count: { type: integer, minimum: 0 }
            oldestWaitingMinutes: { type: [number, 'null'], minimum: 0 }
        unansweredEpisodes:
          type: object
          additionalProperties: false
          required: [count]
          properties:
            count: { type: integer, minimum: 0 }
    DashboardServiceMetrics:
      type: object
      additionalProperties: false
      required:
        [from, to, days, scope, generatedAt, businessHours, rows]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        days: { type: integer, enum: [7, 30] }
        scope: { type: string, enum: [team, self] }
        generatedAt: { type: string, format: date-time }
        businessHours:
          type: object
          additionalProperties: false
          required: [policy, weekdays, blocks, unansweredThresholdMinutes]
          properties:
            policy: { type: string, const: expediente-v1 }
            weekdays:
              type: array
              items: { type: integer, minimum: 1, maximum: 7 }
            blocks:
              type: array
              items:
                type: array
                minItems: 2
                maxItems: 2
                items: { type: string, pattern: '^\d{2}:\d{2}$' }
            unansweredThresholdMinutes: { type: integer, const: 15 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/DashboardServiceMetricsRow' }
        team:
          type: object
          description: >-
            Somente para administrador (scope team). `unclaimedHandoffs` conta
            todo pedido de atendimento pendente de ciclo aberto, inclusive em
            conversa que já tem dono por tomada direta (MET-02, nunca omitido).
          additionalProperties: false
          required: [unclaimedHandoffs]
          properties:
            unclaimedHandoffs:
              type: object
              additionalProperties: false
              required: [count, oldestWaitingMinutes]
              properties:
                count: { type: integer, minimum: 0 }
                oldestWaitingMinutes: { type: [number, 'null'], minimum: 0 }
    LeadLossReason:
      type: string
      enum: [preco, prazo, concorrente, silencio, indisponivel, outro]
    LeadOutcomeCommand:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            [outcome, reasonCode, expectedConversationVersion, expectedOutcomeVersion]
          properties:
            outcome: { type: string, const: lost }
            reasonCode: { $ref: '#/components/schemas/LeadLossReason' }
            note:
              type: string
              description: >-
                Obrigatório só com `outro`: NFC, 1–140 caracteres após trim,
                ao menos uma letra ou número, sem caracteres de controle,
                formatação, uso privado ou não atribuídos. Proibido com
                outro motivo.
            expectedConversationVersion: { type: integer, minimum: 1 }
            expectedOutcomeVersion: { type: integer, minimum: 0 }
        - type: object
          additionalProperties: false
          required: [outcome, expectedConversationVersion, expectedOutcomeVersion]
          properties:
            outcome: { type: string, const: reopened }
            expectedConversationVersion: { type: integer, minimum: 1 }
            expectedOutcomeVersion: { type: integer, minimum: 1 }
    LeadOutcomeRecorded:
      type: object
      additionalProperties: false
      required:
        [conversationId, outcome, outcomeVersion, reasonCode, hasNote, ownerId, markedBy, markedAt]
      properties:
        conversationId: { type: string }
        outcome: { type: string, enum: [lost, reopened] }
        outcomeVersion: { type: integer, minimum: 1 }
        reasonCode:
          oneOf:
            - { $ref: '#/components/schemas/LeadLossReason' }
            - { type: 'null' }
        hasNote: { type: boolean }
        ownerId: { type: string }
        markedBy: { type: string }
        markedAt: { type: string, format: date-time }
    LeadOutcomeDetail:
      type: object
      additionalProperties: false
      required:
        [state, outcomeVersion, reasonCode, ownerId, markedBy, markedAt, reopenedAt]
      properties:
        state:
          type: string
          enum: [open, lost, reopened_by_customer, reopened_manual]
        outcomeVersion: { type: integer, minimum: 0 }
        reasonCode:
          oneOf:
            - { $ref: '#/components/schemas/LeadLossReason' }
            - { type: 'null' }
        note:
          type: string
          description: Só quando o motivo descrito é `outro`.
        ownerId: { type: [string, 'null'] }
        markedBy: { type: [string, 'null'] }
        markedAt: { type: [string, 'null'], format: date-time }
        reopenedAt: { type: [string, 'null'], format: date-time }
    LeadLossReasonCounts:
      type: object
      additionalProperties: false
      required: [preco, prazo, concorrente, silencio, indisponivel, outro]
      properties:
        preco: { type: integer, minimum: 0 }
        prazo: { type: integer, minimum: 0 }
        concorrente: { type: integer, minimum: 0 }
        silencio: { type: integer, minimum: 0 }
        indisponivel: { type: integer, minimum: 0 }
        outro: { type: integer, minimum: 0 }
    DashboardLossMetrics:
      type: object
      additionalProperties: false
      required: [from, to, days, scope, generatedAt, rows]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        days: { type: integer, enum: [7, 30] }
        scope: { type: string, enum: [team, self] }
        generatedAt: { type: string, format: date-time }
        rows:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              [userId, name, active, lostCount, reopenedByCustomerCount, byReason]
            properties:
              userId: { type: string }
              name: { type: [string, 'null'] }
              active: { type: boolean }
              lostCount: { type: integer, minimum: 0 }
              reopenedByCustomerCount: { type: integer, minimum: 0 }
              byReason: { $ref: '#/components/schemas/LeadLossReasonCounts' }
        totals:
          type: object
          description: Somente para administrador (scope team).
          additionalProperties: false
          required: [lostCount, reopenedByCustomerCount, byReason]
          properties:
            lostCount: { type: integer, minimum: 0 }
            reopenedByCustomerCount: { type: integer, minimum: 0 }
            byReason: { $ref: '#/components/schemas/LeadLossReasonCounts' }
    FinancePage:
      type: object
      additionalProperties: false
      required: [items, counts, nextCursor]
      properties:
        items:
          type: array
          items:
            allOf: [{ $ref: '#/components/schemas/FinanceOrder' }]
            unevaluatedProperties: false
        counts:
          type: object
          additionalProperties: false
          required: [waiting, completed]
          properties:
            waiting: { type: integer, minimum: 0 }
            completed: { type: integer, minimum: 0 }
        nextCursor: { type: [string, 'null'] }
    FinanceOrder:
      type: object
      required:
        [
          id,
          number,
          clientName,
          origin,
          isManual,
          ownerName,
          totalPieces,
          finalAmountCents,
          paidOn,
          deliveryOn,
          version,
          financeVersion,
          completedAt,
          completedByName,
        ]
      properties:
        id: { type: string }
        number: { type: string }
        clientName: { type: string }
        origin: { $ref: '#/components/schemas/OrderOrigin' }
        isManual: { type: boolean }
        ownerName: { type: string }
        totalPieces: { type: integer, minimum: 1 }
        finalAmountCents: { type: integer, minimum: 1 }
        paidOn: { type: string, format: date }
        deliveryOn: { type: [string, 'null'], format: date }
        version: { type: integer, minimum: 1 }
        financeVersion: { type: integer, minimum: 0 }
        completedAt: { type: [string, 'null'], format: date-time }
        completedByName: { type: [string, 'null'] }
        cancelledAt:
          type: string
          format: date-time
          description: Presente somente na consulta histórica de pedido cancelado; impede comandos financeiros.
    FinanceResponse:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order:
          unevaluatedProperties: false
          allOf:
            - $ref: '#/components/schemas/FinanceOrder'
            - type: object
              required: [canManage, items, history]
              properties:
                canManage: { type: boolean }
                items:
                  type: array
                  items: { $ref: '#/components/schemas/FinanceItem' }
                history:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, action, actorName, occurredAt, reason]
                    properties:
                      id: { type: string }
                      action:
                        {
                          type: string,
                          enum: [completed, reopened, invalidated],
                        }
                      actorName: { type: string }
                      occurredAt: { type: string, format: date-time }
                      reason: { type: string }
    FinanceItem:
      type: object
      additionalProperties: false
      properties:
        tipo: { type: string }
        cor: { type: string }
        grade:
          type: array
          items: { $ref: '#/components/schemas/FichaGradeLine' }
        malhas:
          type: array
          items: { type: string }
        tipo_servico: { type: string }
        gola: { type: string }
        publico: { type: string }
    N8nMode:
      type: string
      enum: [ai_active, handoff_pending, human_active, closed]
    N8nInboundRequest:
      type: object
      additionalProperties: false
      allOf:
        - if:
            properties: { channel: { const: site_chat } }
          then:
            required: [provider]
            properties:
              provider: { const: site }
              contact:
                required: [external_id]
                not: { required: [wa_id] }
          else:
            not: { required: [site_contact] }
      required:
        [
          schema_version,
          event_id,
          occurred_at,
          channel,
          contact,
          message,
          metadata,
        ]
      properties:
        schema_version: { type: string, const: '1.0' }
        event_id: { type: string, minLength: 1, maxLength: 512 }
        occurred_at: { type: string, format: date-time }
        channel: { type: string, enum: [whatsapp, site_chat] }
        provider:
          type: string
          description: Para site_chat, usar site. WhatsApp mantém o provedor do canal.
        contact:
          type: object
          anyOf:
            - required: [external_id]
            - required: [wa_id]
          properties:
            external_id: { type: string, minLength: 1, maxLength: 512 }
            wa_id: { type: string, minLength: 1, maxLength: 512 }
            name: { type: string, maxLength: 512 }
        site_contact:
          type: object
          additionalProperties: false
          required: [name, phone]
          description: Obrigatório no primeiro ingresso site_chat da Conversa; nos demais, se enviado, deve repetir a mesma declaração. Declaração não confirmada; não vincula identidade WhatsApp.
          properties:
            name: { type: string, minLength: 1, maxLength: 120 }
            phone: { type: string, minLength: 1, maxLength: 32 }
        message:
          type: object
          additionalProperties: true
          required: [external_id, type]
          properties:
            external_id: { type: string, minLength: 1, maxLength: 512 }
            type:
              type: string
              enum: [text, image, audio, video, document, button, interactive]
            text: { type: string, maxLength: 65536 }
        metadata:
          type: object
          additionalProperties: true
          anyOf:
            - required: [provider_account_id]
            - required: [phone_number_id]
    N8nInboundResponse:
      type: object
      additionalProperties: true
      required:
        [
          accepted,
          duplicate,
          conversation_id,
          source_revision,
          automation_epoch,
          mode,
          recent_messages,
          briefing,
          subjects,
          source_subject_ids,
        ]
      properties:
        accepted: { type: boolean, const: true }
        duplicate: { type: boolean }
        conversation_id: { type: string }
        source_revision: { type: integer, minimum: 1 }
        conversation_version: { type: integer, minimum: 1 }
        contact_id: { type: string }
        automation_epoch: { type: integer, minimum: 0 }
        mode: { $ref: '#/components/schemas/N8nMode' }
        recent_messages: { type: array, items: { type: object } }
        briefing_version: { type: integer, minimum: 0 }
        briefing:
          type: object
          additionalProperties: true
          description: Compatibilidade legada. Novos workflows usam o briefing de cada Assunto em subjects.
        subjects:
          type: array
          description: Assuntos visíveis da Conversa, cada um com seu Pedido e briefing próprios.
          items:
            type: object
            additionalProperties: true
            required: [subject_id, order_id, briefing]
            properties:
              subject_id: { type: string }
              order_id: { type: [string, 'null'] }
              order_number: { type: [string, 'null'] }
              order_status: { type: [string, 'null'] }
              kind: { type: string }
              is_current: { type: boolean }
              selected_source:
                type: [string, 'null']
                enum: [human, agent, null]
              position: { type: integer }
              briefing_version: { type: integer, minimum: 0 }
              briefing: { type: object, additionalProperties: true }
        source_subject_ids:
          type: array
          items: { type: string }
          description: Assuntos ligados à mensagem recebida; mais de um exige esclarecimento ou transferência.
        site_contact:
          type: object
          additionalProperties: false
          properties:
            name: { type: string }
          description: Só nome da declaração do site; telefone e candidatos não são devolvidos ao workflow.
        site_contact_match:
          type: string
          enum: [new, existing, ambiguous]
          description: Classificação interna; não enviar ao modelo ou visitante.
        automation_message_count:
          type: integer
          minimum: 0
          description: Mensagens do agente já reservadas nesta Conversa (ADR 009).
        automation_message_cap:
          type: integer
          minimum: 2
          description: Teto de mensagens do agente; a última vaga é do aviso de transferência.
        sellers:
          type: array
          description: Vendedores ativos, só id e primeiro nome (ADR 009).
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
    N8nAttachmentRequest:
      type: object
      additionalProperties: false
      required: [schema_version, external_id, file]
      properties:
        schema_version: { type: string, const: '1.0' }
        external_id: { type: string, minLength: 1, maxLength: 512 }
        filename: { type: string, minLength: 1, maxLength: 255 }
        mime_type: { type: string, minLength: 1, maxLength: 255 }
        file: { type: string, format: binary }
    N8nEventRequest:
      type: object
      additionalProperties: false
      required: [schema_version, event_id, event_type, occurred_at]
      properties:
        schema_version: { type: string, const: '1.0' }
        event_id: { type: string, minLength: 1, maxLength: 512 }
        event_type:
          type: string
          enum:
            [
              message.send.requested,
              message.sent,
              message.delivered,
              message.read,
              message.failed,
              message.send.unknown,
              handoff.requested,
              workflow.failed,
              order.assistance.observed,
            ]
        occurred_at: { type: string, format: date-time }
        conversation_id: { type: [string, 'null'] }
        observation:
          type: object
          additionalProperties: false
          required: [signal]
          description: OA-02. Somente order.assistance.observed; não autoriza envio nem criação.
          properties:
            signal:
              {
                enum:
                  [
                    purchase_confirmed,
                    not_ready,
                    withdrawn,
                    unsupported,
                    uncertain,
                    analysis_failed,
                  ],
              }
            product_summary: { type: [string, 'null'], maxLength: 256 }
            evidence_message_id: { type: [string, 'null'] }
            subject_id: { type: [string, 'null'] }
            briefing_patch:
              {
                type: [object, 'null'],
                description: Mesma allowlist de qualificação; texto até 2000 caracteres,
                sem preço/pagamento/status,
              }
        automation_epoch: { type: integer, minimum: 0 }
        source_revision: { type: integer, minimum: 1 }
        target_contract:
          type: string
          const: subject-v1
          description: Ativa o contrato de alvo explícito por Assunto para eventos do novo workflow.
        subject_id:
          type: string
          description: Obrigatório com order_id em alterações de briefing pelo agente sob target_contract subject-v1.
        order_id:
          type: string
          description: Pedido explicitamente escolhido para a alteração; deve pertencer ao subject_id.
        command_id: { type: string, maxLength: 512 }
        external_message_id: { type: string, maxLength: 512 }
        message:
          type: object
          additionalProperties: true
          description: >-
            message.send.requested humano deve reproduzir a message da outbox.
            Texto conserva o shape legado. Mídia retida usa somente media_id,
            sha256, mime_type, size_bytes, type, text e caption (null para audio),
            com filename/media_url null. Metadados vêm da chat_media vinculada,
            nunca do cliente. Aliases attachment_id/attachmentId/mediaId e URL/key
            arbitrárias são negados409. Legenda/variante/epoch/source divergentes
            não reservam. Replay retorna send_authorized=false.
          properties:
            media_id: { type: string, format: uuid }
            sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
            mime_type: { type: string }
            size_bytes: { type: integer, minimum: 1 }
            caption: { type: [string, 'null'], maxLength: 1024 }
        briefing_patch:
          type: object
          additionalProperties: false
          properties:
            artwork_locations: {}
            artwork_status: {}
            artwork_technique: {}
            briefing_status: {}
            city_or_postal_code: {}
            collar: {}
            colors: {}
            customer_name: {}
            customizations: {}
            delivery_address: {}
            delivery_mode: {}
            fabrics: {}
            needed_by: {}
            next_required_field: {}
            notes: {}
            numbers: {}
            order_name: {}
            pickup_location: {}
            product_model: {}
            product_type: {}
            purchase_profile: {}
            purpose: {}
            quantity: {}
            segment: {}
            sizes: {}
            sponsors: {}
        handoff:
          type: object
          additionalProperties: true
          properties:
            reason: { type: string }
            summary: { type: string }
            notice:
              type: object
              additionalProperties: false
              required: [command_id, text]
              description: Aviso ao cliente reservado na mesma transação do handoff (ADR 009).
              properties:
                command_id: { type: string, minLength: 1, maxLength: 512 }
                text: { type: string, minLength: 1, maxLength: 4096 }
        failure:
          type: object
          additionalProperties: true
          description: >-
            Generic workflow.failed is diagnostic only. The explicit
            phase=before_message_send requires command_id and conversation_id,
            only phase/code keys and one allowlisted code: MEDIA_DOWNLOAD_FAILED,
            MEDIA_INTEGRITY_MISMATCH, MEDIA_UPLOAD_FAILED,
            MEDIA_PREFLIGHT_REJECTED or MEDIA_PREFLIGHT_UNAVAILABLE. It concludes
            processing/sending under the original reservation execution with
            retryable=false and retry_safe=false, even after epoch invalidation.
            It cannot regress sent/delivered/read/outcome_unknown. Use only on
            branches proven to precede Meta/messages; errors after invocation
            require message.send.unknown, never this completion.
        open_order:
          type: boolean
          description: >-
            ADR 056 supersede ADR 014. Campo legado somente em reserva/handoff.
            Runtime publicado não cria Pedido: true retorna awaiting_human
            com opened nulo, sem erro técnico ou reserva de numeração.
    N8nEventResponse:
      type: object
      additionalProperties: true
      required: [accepted]
      properties:
        accepted: { type: boolean }
        duplicate: { type: boolean }
        send_authorized: { type: boolean }
        reason: { type: string }
        handoff_id: { type: string }
        notice:
          type: object
          description: Só envie o aviso quando send_authorized for true; replay e teto gasto devolvem false.
          properties:
            send_authorized: { type: boolean }
            command_id: { type: [string, 'null'] }
        order:
          description: >-
            ADR 056. Runtime publicado responde awaiting_human ao contrato
            legado, sem criação. Formatos históricos são preservados abaixo.
          oneOf:
            - type: object
              additionalProperties: false
              required: [opened, status]
              properties:
                opened: { type: 'null' }
                status: { const: awaiting_human }
            - type: object
              additionalProperties: false
              required: [opened, id, subject_id, created]
              properties:
                opened: { type: boolean, const: true }
                id: { type: string }
                subject_id: { type: string }
                created: { type: boolean }
            - type: object
              additionalProperties: false
              required: [opened, error]
              properties:
                opened: { type: boolean, const: false }
                error: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
    N8nProblem:
      type: object
      additionalProperties: false
      required:
        [type, title, status, detail, instance, accepted, error, request_id]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        accepted: { type: boolean, const: false }
        error:
          type: object
          additionalProperties: false
          required: [code]
          properties: { code: { type: string } }
        request_id: { type: string }
    HumanMessageCommand:
      type: object
      additionalProperties: false
      required: [content, expectedVersion, messageType, reason]
      properties:
        content: { type: object, additionalProperties: true }
        expectedVersion: { type: integer, minimum: 1 }
        messageType: { type: string, enum: [text, image, audio, video] }
        reason: { type: string, minLength: 1, maxLength: 512 }
      description: >-
        CHAT_MEDIA_ENABLED=false impede novos envios image/audio/video (403),
        preservando texto e leitura. Mídia só aceita referência canônica mediaId;
        chave, URL, filename e attachmentId arbitrários são proibidos.
      oneOf:
        - properties:
            messageType: { const: text }
        - properties:
            messageType: { enum: [image, video] }
            content:
              type: object
              additionalProperties: false
              required: [mediaId]
              properties:
                mediaId: { type: string, format: uuid }
                caption: { type: string, maxLength: 1024 }
        - properties:
            messageType: { const: audio }
            content:
              type: object
              additionalProperties: false
              required: [mediaId]
              properties:
                mediaId: { type: string, format: uuid }
    HumanConversationCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 512 }
    CloseConversationCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion, outcome, acknowledgePending]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        outcome: { type: string, enum: [concluido, sem_pedido] }
        acknowledgePending: { type: boolean }
    HandoffClaimRequest:
      type: object
      additionalProperties: false
      required: [expectedHandoffVersion, reasonCode]
      properties:
        expectedHandoffVersion: { type: integer, minimum: 1 }
        expectedConversationVersion: { type: integer, minimum: 1 }
        reasonCode: { type: string, minLength: 1, maxLength: 512 }
    Channel:
      type: string
      enum: [instagram, whatsapp, site_chat]
    ConversationState:
      type: string
      enum:
        [
          nova,
          em_analise,
          em_atendimento,
          requer_atencao,
          convertida_em_lead,
          sem_lead,
          encerrada,
        ]
    ContactIdentityView:
      type: object
      additionalProperties: false
      required: [id, channel, kind, externalId, displayHandle, phoneStatus]
      properties:
        id: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        kind: { type: string }
        externalId: { type: string }
        displayHandle: { type: [string, 'null'] }
        phoneStatus: { type: [string, 'null'] }
    ContactView:
      type: object
      additionalProperties: false
      required:
        [
          id,
          label,
          provisional,
          version,
          identities,
          activeDealCount,
          createdAt,
          updatedAt,
          archivedAt,
          latestActivityAt,
        ]
      properties:
        id: { type: string }
        label: { type: string }
        phone:
          {
            type: [string, 'null'],
            description: Telefone operacional do contato. O campo phoneSource indica se foi declarado no site,
            cadastrado manualmente ou confirmado no WhatsApp.,
          }
        phoneSource:
          type: [string, 'null']
          enum: [manual, whatsapp, site_unverified, null]
          description: site_unverified é um telefone informado pela pessoa no chat, sem prova de posse ou correlação com outro contato.
        email: { type: [string, 'null'] }
        registrationStatus:
          type: string
          enum: [complete, incomplete]
          description: >-
            CP-26. complete exige os campos obrigatórios do cadastro, celular
            e e-mail. É o único dado do cadastro exposto na lista.
        registration:
          description: >-
            Somente no detalhe (GET /contacts/{contactId}, servido com
            Cache-Control private, no-store); nunca na lista nem na busca. null
            quando o cadastro nunca foi preenchido.
          oneOf:
            - { $ref: '#/components/schemas/ContactRegistration' }
            - { type: 'null' }
        provisional: { type: boolean }
        version: { type: integer, minimum: 1 }
        identities:
          type: array
          items: { $ref: '#/components/schemas/ContactIdentityView' }
        activeDealCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        latestActivityAt: { type: string, format: date-time }
    InboxMessageView:
      type: object
      additionalProperties: false
      required:
        [id, direction, type, preview, status, deliveryStatus, occurredAt]
      properties:
        id: { type: string }
        direction: { type: string, enum: [inbound, outbound] }
        type: { type: string }
        preview: { type: string }
        status: { type: string }
        deliveryStatus: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        authorKind: { type: [string, 'null'] }
        authorId: { type: [string, 'null'] }
        deliveryMode:
          type: [string, 'null']
          enum: [dev, official, null]
          description: Origem do único recibo de reserva; DEV não comprova entrega real.
        media:
          oneOf:
            - { $ref: '#/components/schemas/InboxPersistentMedia' }
            - { type: 'null' }
    InboxPersistentMedia:
      type: object
      additionalProperties: false
      required:
        [mediaId, kind, state, mimeType, sizeBytes, durationMs, contentUrl]
      properties:
        mediaId: { type: string, format: uuid }
        kind: { type: string, enum: [image, audio, video] }
        state: { type: string }
        mimeType: { type: [string, 'null'] }
        sizeBytes: { type: [integer, 'null'], minimum: 0 }
        durationMs: { type: [integer, 'null'], minimum: 0 }
        contentUrl:
          type: [string, 'null']
          description: Rota relativa CRM com ACL; null quando indisponível, nunca URL storage.
    InboxConversationView:
      type: object
      additionalProperties: false
      required:
        [
          id,
          state,
          automationState,
          automationEpoch,
          version,
          channel,
          contact,
          lastMessage,
          requiresAttention,
          openedAt,
          updatedAt,
          bucket,
          turnSince,
          turnBusinessMinutes,
          turnAsOf,
          assistantStalled,
          lostOutcome,
          reminder,
        ]
      properties:
        id: { type: string }
        state: { $ref: '#/components/schemas/ConversationState' }
        automationState: { type: string, enum: [assistant, human] }
        automationEpoch: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
        channel: { $ref: '#/components/schemas/Channel' }
        contact:
          type: object
          additionalProperties: false
          required: [id, label, externalId, displayHandle]
          properties:
            id: { type: string }
            label: { type: string }
            externalId: { type: string }
            displayHandle: { type: [string, 'null'] }
        assignedUser:
          {
            oneOf:
              [
                { $ref: '#/components/schemas/OperationalUserRef' },
                { type: 'null' },
              ],
          }
        deal: { type: [object, 'null'] }
        handoff:
          type: [object, 'null']
          description: Handoff aberto (pendente ou aceito) da conversa.
          properties:
            id: { type: string }
            status: { type: string, enum: [pending, accepted] }
            reasonCode:
              type: string
              description: Motivo da parada do agente (crm.handoffs.reason_code).
            createdAt:
              type: string
              format: date-time
              description: Início da espera; base do tempo parado.
            dueAt: { type: string, format: date-time }
            targetRole: { type: string }
            version: { type: integer, minimum: 1 }
        order:
          description: >-
            Pedido atual da conversa: o pendente ou, se não houver, o último
            confirmado.
          oneOf:
            - type: object
              additionalProperties: false
              required: [id, number, status]
              properties:
                id: { type: string }
                number: { type: string, pattern: '^[0-9]{2,}-CRM$' }
                status: { $ref: '#/components/schemas/OrderStatus' }
                readyForConfirmation:
                  type: boolean
                  description: Validação persistida do pedido pendente; não é inferida do handoff ou da pré-ficha.
            - { type: 'null' }
        lastMessage:
          {
            oneOf:
              [
                { $ref: '#/components/schemas/InboxMessageView' },
                { type: 'null' },
              ],
          }
        reviewOrder:
          type: [object, 'null']
          additionalProperties: false
          description: Pedido elegível para revisão, com alvo explícito; não substitui order canônico.
          properties:
            id: { type: string }
            number: { type: string }
            status: { type: string, const: pendente }
            readyForConfirmation: { type: boolean, const: true }
        hasPendingOrder:
          type: boolean
          description: >-
            Há pedido pendente ligado diretamente à conversa ou por Assunto,
            mesmo que order seja null ou confirmado. Exige confirmação
            consciente para encerrar o atendimento sem alterar os pedidos
            (CP-10); não substitui a validação transacional do comando.
        requiresAttention: { type: boolean }
        waitingSince:
          type: [string, 'null']
          format: date-time
          description: Espera humana; avisos do bot não reiniciam o instante.
        queuePosition:
          type: string
          format: date-time
          description: Instante estável de ordenação/cursor das filas workQueue.
        deliveryIssue:
          type: [object, 'null']
          additionalProperties: false
          properties:
            status: { type: string, enum: [failed, outcome_unknown] }
            occurredAt: { type: string, format: date-time }
        openedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: [string, 'null'], format: date-time }
        terminalAt: { type: [string, 'null'], format: date-time }
        closureOutcome:
          { type: [string, 'null'], enum: [concluido, sem_pedido, null] }
        closedBy: { type: [string, 'null'] }
        bucket:
          description: >-
            INBOX-VEZ-01. Aba da conversa; null fora do universo aberto
            (arquivada, terminal, convertida_em_lead, sem_lead ou encerrada).
          oneOf:
            - { $ref: '#/components/schemas/InboxBucket' }
            - { type: 'null' }
        turnSince:
          type: [string, 'null']
          format: date-time
          description: >-
            Início da vez atual, truncado a milissegundos. respond: saída
            com falha, ou a menor entre a primeira mensagem do cliente sem
            resposta e o handoff pendente; awaiting e silent: última saída
            efetiva (ou openedAt); awaiting com o agente na janela: a mensagem
            do cliente; lost: instante da perda. Nulo fora do universo.
        turnBusinessMinutes:
          type: [integer, 'null']
          minimum: 0
          description: floor(crm.business_minutes_v1(turnSince, turnAsOf)); nulo fora do universo.
        turnAsOf:
          type: [string, 'null']
          format: date-time
          description: Relógio do servidor usado no cálculo; o mesmo em toda a resposta.
        assistantStalled:
          type: boolean
          description: >-
            Agente sozinho (sem handoff aberto), cliente sem resposta efetiva
            e última mensagem do cliente com ASSISTANT_STALL_MINUTES ou mais.
            Regra por linha, mais simples que o contador do painel.
        lostOutcome:
          type: [object, 'null']
          additionalProperties: false
          required: [reasonCode, occurredAt, version]
          description: Só com perda ativa (MET-07). A nota nunca é exposta.
          properties:
            reasonCode: { type: string }
            occurredAt: { type: string, format: date-time }
            version: { type: integer, minimum: 1 }
        reminder:
          type: [object, 'null']
          additionalProperties: false
          required: [remindAt, mine]
          description: >-
            Lembrete ativo (D2): futuro e da versão atual da conversa; o do
            leitor tem prioridade, depois o mais próximo. Só o próprio muda a
            aba (mine=true).
          properties:
            remindAt: { type: string, format: date-time }
            mine: { type: boolean }
    InboxBucket:
      type: string
      enum: [respond, awaiting, silent, lost]
    InboxBuckets:
      type: object
      additionalProperties: false
      required: [respond, awaiting, silent, lost]
      properties:
        respond: { type: integer, minimum: 0 }
        awaiting: { type: integer, minimum: 0 }
        silent: { type: integer, minimum: 0 }
        lost: { type: integer, minimum: 0 }
    InboxPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, totalCount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InboxConversationView' }
        nextCursor: { type: [string, 'null'] }
        totalCount: { type: integer, minimum: 0 }
    InboxConversationDetail:
      type: object
      additionalProperties: false
      required: [conversation, messages, suggestion]
      properties:
        conversation: { $ref: '#/components/schemas/InboxConversationView' }
        messages:
          type: array
          items: { $ref: '#/components/schemas/InboxMessageView' }
        suggestion: { type: [object, 'null'] }
    ConversationSubject:
      type: object
      additionalProperties: false
      required:
        [
          id,
          kind,
          orderId,
          orderNumber,
          orderStatus,
          position,
          isCurrent,
          selectedSource,
          version,
        ]
      properties:
        id: { type: string }
        kind: { type: string, enum: [pedido, geral] }
        orderId: { type: [string, 'null'] }
        orderNumber: { type: [string, 'null'] }
        orderStatus: { type: [string, 'null'] }
        position: { type: integer, minimum: 1 }
        isCurrent: { type: boolean }
        selectedSource: { type: [string, 'null'], enum: [human, agent, null] }
        version: { type: integer, minimum: 1 }
    ConversationSubjects:
      type: object
      additionalProperties: false
      required:
        [
          currentSubjectId,
          subjects,
          orders,
          ordersHasMore,
          links,
          needsSubjectMessageIds,
        ]
      properties:
        currentSubjectId: { type: [string, 'null'] }
        subjects:
          type: array
          items: { $ref: '#/components/schemas/ConversationSubject' }
        orders:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, number, status]
            properties:
              id: { type: string }
              number: { type: string }
              status: { $ref: '#/components/schemas/OrderStatus' }
        ordersHasMore: { type: boolean }
        links:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [messageId, subjectId, assignedByKind]
            properties:
              messageId: { type: string }
              subjectId: { type: string }
              assignedByKind:
                type: string
                enum: [human, agent]
                description: >-
                  `agent` quando o agente registrou o assunto do turno que
                  respondeu (CP-12); `human` quando uma pessoa salvou.
        needsSubjectMessageIds:
          type: array
          description: >-
            Mensagens recebidas que o agente marcou como ambíguas (CP-16),
            com revisão aberta, ainda sem vínculo nem decisão humana. A
            revisão só é aberta quando a Conversa já tem ao menos um Assunto.
          items: { type: string }
    CreateConversationSubject:
      type: object
      additionalProperties: false
      properties:
        orderId: { type: [string, 'null'] }
        select:
          type: boolean
          default: true
          description: >-
            CP-31: false cria o assunto sem torná-lo o atual nem mudar o
            assunto que o agente usa ("separar como novo assunto"). Faz
            parte da impressão digital da Idempotency-Key.
    HandoffView:
      type: object
      additionalProperties: false
      required:
        [
          id,
          conversationId,
          conversationVersion,
          contact,
          status,
          version,
          reasonCode,
          summary,
          targetRole,
          dueAt,
          slaMinutes,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        conversationId: { type: string }
        conversationVersion: { type: integer, minimum: 1 }
        contact:
          type: object
          additionalProperties: false
          required: [id, label, externalId]
          properties:
            id: { type: string }
            label: { type: string }
            externalId: { type: string }
        status: { type: string, const: pending }
        version: { type: integer, minimum: 1 }
        reasonCode: { type: string }
        summary: { type: string }
        targetRole: { type: string }
        dueAt: { type: string, format: date-time }
        slaMinutes: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        dealId: { type: [string, 'null'] }
        automationEpoch: { type: integer, minimum: 0 }
    HandoffPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, totalCount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HandoffView' }
        nextCursor: { type: [string, 'null'] }
        totalCount: { type: integer, minimum: 0 }
    ContactPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, totalCount]
      properties:
        items:
          type: array
