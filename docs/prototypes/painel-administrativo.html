      h2,

        line-height: 1.3;
        letter-spacing: -0.025em;
      }
      h3 {
        font-size: 16px;
      }
      small,
      .muted {
        color: var(--muted, #635e71);
        font-size: 13px;

      .top {
        background: #19132f;
        color: #fff;
        padding: 0 max(4vw, 16px);
        min-height: 66px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;

      .wordmark {
        height: 29px;
        width: 91px;
        display: block;
        fill: currentColor;

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .brand span {
        border-left: 1px solid #6c647b;
        padding-left: 16px;
        font-weight: 600;
      }
      .top small {
        color: #e3ddec;
      }
      .wrap {
        max-width: 1600px;
        margin: auto;
        padding: 26px 4vw 44px;
      }
      .mast,
      .row,
      .tabs,
      .tools,
      .inline {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .mast,
      .between {
        justify-content: space-between;
      }
      .mast {
        margin-bottom: 20px;
      }
      .mast p {
        margin-top: 5px;
        color: #635e71;
      }
      .tabs {
        gap: 4px;
        border-bottom: 1px solid #d6d2dc;
        margin-bottom: 22px;
      }
      .tabs button {
        padding: 0 15px;
        border-bottom: 3px solid transparent;

      .tabs button[aria-pressed='true'] {
        color: #221438;
        border-bottom-color: #473258;

        padding: 5px 13px;
        background: var(--paper, #fff);

      .mainbtn {
        background: #312147;
        color: white;
        border-color: #312147;
      }
      .mainbtn:hover {
        background: #4b3268;
      }
      #work {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 272px;
        gap: 18px;
        align-items: start;

      .preview,
      .notes,
      .doc {
        border-radius: 16px;
        border: 1px solid #dad6e0;
        background: white;
        overflow: hidden;
      }
      .screen {

        --bg: #faf9fc;
        --ink: #201735;
        --muted: #645d70;
        --line: #dfdbe5;
        --tint: #f0ecf7;
        --hover: #f0ecf7;
        --accent: #583a78;
        --warm: #fff1dd;
        --warmink: #704005;
        --bar: #7860a1;
        --green: #24684d;
        background: var(--bg);
        color: var(--ink);
        container-type: inline-size;
        min-width: 0;
      }
      .screen.night {
        --paper: #272139;
        --bg: #1a1628;
        --ink: #f7f3ff;
        --muted: #c1b9cd;
        --line: #4d435c;
        --tint: #3a304c;
        --hover: #41364e;
        --accent: #d9b8ff;
        --warm: #443220;
        --warmink: #ffdbad;
        --bar: #ba9ae0;
        --green: #95ddbc;

        font-weight: 600;
      }
      #stage {
        padding: 22px;

        align-items: center;
        gap: 12px;
      }
      .hero b {
        font-size: 26px;
        display: block;
        letter-spacing: -0.035em;
        line-height: 1.2;

      .hero > div:first-child b {
        font-size: clamp(30px, 3.2vw, 48px);

      .hero span {
        color: #ded2ea;

        color: #fff;
        font-size: 13px;

        display: flex;

        height: 110px;
        margin: 15px 0 2px;
        border-bottom: 1px solid var(--line);
        padding: 0 2px;

      .chart i {
        flex: 1;
        background: var(--bar);
        border-radius: 3px 3px 0 0;
      }
      .chart i:last-child {
        background: #c8530a;

        width: 10px;
        height: 10px;
        border-radius: 3px;
        margin-right: 6px;

        border-radius: 5px;

        align-items: center;
        min-height: 26px;
        border-radius: 20px;
        background: var(--tint);
        padding: 2px 10px;
        color: var(--accent);
        font-size: 13px;
      }
      .pill.good {
        color: var(--green);
      }
      .pill.warn {
        background: var(--warm);
        color: var(--warmink);

        font-weight: 600;
        color: var(--muted);

        padding: 2px;
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(125px, 1fr));
        gap: 12px;
        margin-top: 12px;
      }
      .metrics div {
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }
      .metrics b {
        display: block;
        font-size: 21px;
      }
      .entry {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;

        border-bottom: 1px solid var(--line);

        gap: 14px;

        font-size: 13px;
      }
      .notes details {
        margin-top: 10px;
      }

        font-weight: 600;
        padding: 10px 0;

      details p {
        margin: 5px 0;

        margin-top: 20px;

      }
      .doc textarea {
        width: 100%;
        margin: 8px 0;
      }
      .doc label {
        display: block;
        margin: 12px 0 4px;

      .doc .entry {

      .notes h2 {
        font-size: 18px;
      }

        display: none !important;
      }

        height: 1px;

        color: #6a6175;
        font-size: 13px;
      }

        color: #51356b;
      }

          font-size: 21px;
        }

          padding: 13px;
        }
        td,

          align-items: flex-start;
          flex-direction: column;
        }
        .chart {
          gap: 2px;
        }
        .entry {
          align-items: flex-start;
        }

        .teamtable th:nth-child(6) {
          display: none;
        }

          padding: 0 8px;
        }
        .teamtable td,
        .teamtable th {
          font-size: 12px;
        }

        .top small {

        .top .rfcname {
          display: none;
        }
        .tools {
          gap: 5px;
        }
      }
      .sales-context {
        color: var(--muted);
        font-size: 13px;
        padding: 0 2px;
      }
      details.sales-context > summary {
        color: var(--accent);
        padding: 10px 0;
      }
      .sales-context table {
        max-width: 40rem;
      }
      @media print {
        .top,
        .tools,
        .tabs,
        .notes,
        .appnav,
        .alertlink {
          display: none;
        }
        #work,
        .wrap {
          display: block;
        }
        .wrap {
          padding: 0;
        }

    <main class="wrap">

    </main>
    <script>
      (() => {
        'use strict';
        const $ = (id) => document.getElementById(id);
        const today = 18;
        const team = ['Lia', 'Caio', 'Bia', 'Ivo'];
        const sources = [...team, 'Loja do site', 'Sem atribuição'];
        const colors = ['#725397', '#df772f', '#a99db9'];
        const labels = { hoje: 'Hoje', semana: '7 dias', mes: 'Mês' };
        const money = (n) =>
          (n / 100).toLocaleString('pt-BR', {
            style: 'currency',
            currency: 'BRL',
          });
        const integer = (n) => n.toLocaleString('pt-BR');
        const date = (day) =>
          new Date(Date.UTC(2026, 10, day)).toLocaleDateString('pt-BR', {
            day: '2-digit',
            month: '2-digit',
            timeZone: 'UTC',
          });
        const rangeLabel = (a, b) =>
          a === b ? date(a) : date(a) + ' a ' + date(b);
        const sum = (rows) => rows.reduce((total, r) => total + r.cents, 0);
        const ticket = (rows) =>
          rows.length ? money(Math.round(sum(rows) / rows.length)) : '—';
        const minuteLabel = (n) => (n === null ? '—' : integer(n) + ' min');
        const orders = [],
          activity = [];
        for (let day = -30; day <= today; day++) {
          const n = day === today ? 5 : Math.abs(day * 11 + 7) % 8;
          for (let i = 0; i < n; i++) {
            const person = [0, 1, 2, 4, 5, 0, 1][(Math.abs(day) + i) % 7];
            orders.push({
              id: 'P-' + (1201 + orders.length),
              day,
              person,
              cents: (250 + ((Math.abs(day) * 37 + i * 103) % 1340)) * 100,
            });
          }
          for (let p = 0; p < team.length; p++) {
            for (let j = 0; j < 2 + (Math.abs(day * 2 + p) % 6); j++) {
              activity.push({
                day,
                p,
                first: 2 + ((Math.abs(day) + p * 4 + j * 2) % 25),
                claim: 1 + ((Math.abs(day) + j) % 8),
                assumed: j % 3 !== 0,
                closed: j % 3 === 1,
                lost: j === 3,
                reason: j === 3 ? (day % 2 ? 'Prazo' : 'Preço') : '',
              });
            }
          }
        }
        function stats(rows) {
          const values = rows.map((r) => r.first).sort((a, b) => a - b);
          const median = (v) =>
            v.length
              ? (v[Math.floor((v.length - 1) / 2)] +
                  v[Math.floor(v.length / 2)]) /
                2
              : null;
          return {
            n: rows.length,
            median: median(values),
            claim: median(
              rows
                .filter((r) => r.assumed)
                .map((r) => r.claim)
                .sort((a, b) => a - b),
            ),
            p90:
              values.length >= 5
                ? values[Math.ceil(values.length * 0.9) - 1]
                : null,
            late: rows.filter((r) => r.first > 15).length,
            assumed: rows.filter((r) => r.assumed).length,
            closed: rows.filter((r) => r.closed).length,
            lost: rows.filter((r) => r.lost).length,
          };
        }
        let page = 'painel',
          view = 'resultado',
          period = 'hoje',
          filter = 'all',
          selected = '',
          scenario = 'normal',
          sort = 'sold',
          desc = true;
        let live = false,
          step = 0,
          visibleStep = 0,
          replayed = false;
        let playback = 0;
        function stopPlayback() {
          clearInterval(playback);
          playback = 0;
        }
        function advance() {
          step = Math.min(changes.length, step + 1);
          if (!live) visibleStep = step;
          if (step === changes.length) stopPlayback();
        }
        const queue = [
          {
            id: 'AT-041',
            state: 'Sem responsável',
            label: 'Solicitação de atendimento',
            age: 24,
          },
          {
            id: 'AT-042',
            state: 'Sem responsável',
            label: 'Solicitação de atendimento',
            age: 12,
          },
          {
            id: 'AT-039',
            firstOwner: 1,
            state: 'Aguardando resposta',
            label: 'Conversa de Caio',
            age: 18,
          },
          {
            id: 'AT-046',
            firstOwner: 2,
            state: 'Aguardando resposta',
            label: 'Conversa de Bia',
            age: 14,
          },
        ];
        const facts = [
          {
            id: 'EV-18',
            time: '14h31',
            name: 'Atendimento assumido',
            ref: 'AT-038',
            detail: 'Lia assumiu a conversa da fila geral.',
          },
          {
            id: 'EV-17',
            time: '14h29',
            name: 'Entrega registrada',
            ref: 'P-1197',
            detail:
              'A equipe registrou a entrega de um pedido anterior ao recorte.',
          },
        ];
        const changes = [
          {
            id: 'EV-19',
            time: '14h33',
            name: 'Atendimento assumido',
            ref: 'AT-041',
            detail: 'Lia assumiu o atendimento que estava sem responsável.',
          },
          {
            id: 'EV-20',
            time: '14h34',
            name: 'Pedido confirmado',
            ref: 'P-1501',
            detail: 'Venda de R$ 640,00 atribuída a Caio na confirmação.',
          },
          {
            id: 'EV-21',
            time: '14h35',
            name: 'Resposta humana enviada',
            ref: 'AT-039',
            detail: 'Caio respondeu à conversa e encerrou a espera.',
          },
        ];
        const nowTime = () => ['14h32', '14h33', '14h34', '14h35'][visibleStep];
        function snapshotOrders() {
          return scenario === 'zero'
            ? []
            : visibleStep >= 2
              ? [...orders, { id: 'P-1501', day: 18, person: 1, cents: 64000 }]
              : orders;
        }
        function interval() {
          return [period === 'hoje' ? 18 : period === 'semana' ? 12 : 1, today];
        }
        function periodOrders(a, b) {
          return snapshotOrders().filter((r) => r.day >= a && r.day <= b);
        }
        function periodActivity(person) {
          const [a, b] = interval();
          return activity.filter(
            (r) =>
              r.day >= a &&
              r.day <= b &&
              (person === undefined || r.p === person),
          );
        }
        function btn(label, key, val, cls = 'button') {
          return `<button class="${cls}" data-${key}="${val}">${label}</button>`;
        }
        function area(title, body) {
          return `<section class="paper"><h3>${title}</h3>${body}</section>`;
        }
        function heading(title, sub) {
          return `<div><h2 tabindex="-1" id="viewtitle">${title}</h2><small>${sub}</small></div>`;
        }
        function announce(msg) {
          $('announce').textContent = msg;
        }
        function dates() {
          return rangeLabel(...interval()) + ' · novembro de 2026';
        }
        function periodSwitch() {
          return `<div class="seg" role="group" aria-label="Período comercial">${Object.entries(
            labels,
          )
            .map(
              ([key, label]) =>
                `<button data-period="${key}" aria-pressed="${period === key}">${label}</button>`,
            )
            .join('')}</div>`;
        }
        function filteredLink(f, label) {
          return btn(label, 'orders', f, 'textbtn');
        }
        function comparison() {
          const [start] = interval();
          if (period === 'hoje')
            return `<small class="sales-context">Ontem, dia completo · ${money(sum(periodOrders(17, 17)))}</small>`;
          const previousStart = period === 'mes' ? -30 : start - 6;
          const previousEnd = period === 'mes' ? -14 : start - 1;
          const current = periodOrders(start, 17);
          const previous = periodOrders(previousStart, previousEnd);
          const base = sum(previous);
          const diff = sum(current) - base;
          const pct =
            base > 0
              ? ' (' +
                ((Math.abs(diff) * 100) / base).toLocaleString('pt-BR', {
                  maximumFractionDigits: 1,
                }) +
                '%)'
              : '';
          const summary =
            diff === 0
              ? 'Mesmo valor vendido'
              : money(Math.abs(diff)) +
                (diff > 0 ? ' a mais' : ' a menos') +
                pct;
          const recentDates = rangeLabel(start, 17),
            priorDates = rangeLabel(previousStart, previousEnd);
          return `<details class="sales-context"><summary>${summary} · ${recentDates} vs. ${priorDates}</summary><p>${recentDates} comparado a ${priorDates}. Hoje entra no total acima.</p><table><caption class="sr">Vendas nos dois intervalos fechados</caption><thead><tr><th>Indicador</th><th>${recentDates}</th><th>${priorDates}</th></tr></thead><tbody><tr><th>Vendido</th><td>${money(sum(current))}</td><td>${money(base)}</td></tr><tr><th>Pedidos</th><td>${current.length}</td><td>${previous.length}</td></tr><tr><th>Ticket médio</th><td>${ticket(current)}</td><td>${ticket(previous)}</td></tr></tbody></table></details>`;
        }
        function chart(rows) {
          const [start, end] = interval();
          if (start === end) {
            const sums = [
                sum(rows.filter((r) => r.person < 4)),
                sum(rows.filter((r) => r.person === 4)),
                sum(rows.filter((r) => r.person === 5)),
              ],
              total = sum(rows);
            return area(
              'Quem compõe o vendido de hoje',
              `<div class="stack" aria-hidden="true">${sums.map((s, i) => `<i style="width:${total ? (100 * s) / total : 0}%;background:${colors[i]}"></i>`).join('')}</div><div class="legend">${sums.map((s, i) => `<span><i class="key" style="background:${colors[i]}"></i>${['Equipe', 'Loja do site', 'Sem atribuição'][i]} · <b>${money(s)}</b></span>`).join('')}</div>`,
            );
          }
          const days = Array.from({ length: end - start + 1 }, (_, i) => {
            const d = start + i,
              s = rows.filter((r) => r.day === d);
            return { day: d, cents: sum(s), n: s.length };
          });
          const max = Math.max(1, ...days.map((d) => d.cents));
          return area(
            'Vendas por dia',
            `<p class="muted">${dates()} · ${money(sum(rows))}</p><div class="chart" aria-hidden="true">${days.map((d) => `<i style="height:${(100 * d.cents) / max}%" title="${date(d.day)} · ${money(d.cents)}"></i>`).join('')}</div><div class="row between"><small>${date(start)}</small><small>${date(end)} · hoje</small></div><details><summary>Conferir valores por dia</summary>${days.map((d) => `<div class="entry"><span>${date(d.day)} · ${d.n} pedidos</span>${filteredLink('d' + d.day, money(d.cents))}</div>`).join('')}</details>`,
          );
        }
        function teamRows(rows) {
          return sources.map((name, p) => {
            const sales = rows.filter((r) => r.person === p),
              m = stats(periodActivity(p));
            return {
              name,
              p,
              attended: m.n,
              orders: sales.length,
              sold: sum(sales),
              avg: sales.length ? sum(sales) / sales.length : null,
              response: m.median,
            };
          });
        }
        function teamTable(rows) {
          const people = teamRows(rows);
          const compare = (a, b) => {
            if (a[sort] === null) return b[sort] === null ? 0 : 1;
            if (b[sort] === null) return -1;
            return (
              (typeof a[sort] === 'string'
                ? a[sort].localeCompare(b[sort])
                : a[sort] - b[sort]) * (desc ? -1 : 1)
            );
          };
          const cols = [
            ['name', 'Pessoa'],
            ['attended', 'Atendeu'],
            ['orders', 'Pedidos'],
            ['sold', 'Vendido'],
            ['avg', 'Ticket'],
            ['response', '1ª resposta'],
          ];
          return area(
            'Desempenho da equipe',
            `<p class="muted">Selecione uma pessoa para conferir vendas e atendimento.</p><table class="teamtable"><thead><tr>${cols.map(([key, label]) => `<th scope="col" ${sort === key ? `aria-sort="${desc ? 'descending' : 'ascending'}"` : ''}>${btn(label + (sort === key ? (desc ? ' ↓' : ' ↑') : ''), 'sort', key, '')}</th>`).join('')}</tr></thead><tbody>${[...people.slice(0, 4).sort(compare), ...people.slice(4)].map((r) => `<tr><td>${r.p < 4 ? btn(r.name, 'seller', r.p, '') : r.name}</td><td>${r.p < 4 ? r.attended : '—'}</td><td>${r.orders}</td><td>${money(r.sold)}</td><td>${r.avg === null ? '—' : money(Math.round(r.avg))}</td><td>${r.p < 4 ? minuteLabel(r.response) : '—'}</td></tr>`).join('')}</tbody><tfoot><tr><th>Total</th><td>—</td><td>${rows.length}</td><td>${money(sum(rows))}</td><td>${ticket(rows)}</td><td>—</td></tr></tfoot></table>`,
          );
        }
        function activeQueue() {
          return queue
            .filter(
              (q) =>
                !(q.id === 'AT-041' && visibleStep >= 1) &&
                !(q.id === 'AT-039' && visibleStep >= 3),
            )
            .map((q) => ({ ...q, age: q.age + visibleStep }));
        }
        function result() {
          const rows = periodOrders(...interval()),
            count = activeQueue().filter(
              (q) => q.state === 'Sem responsável',
            ).length;
          return `<div class="row between datehead">${heading('Resultado comercial', dates() + ' · São Paulo')}${periodSwitch()}</div>${btn(count + ' ' + (count === 1 ? 'conversa espera' : 'conversas esperam') + ' vendedor · Abrir central →', 'view', 'central', 'alertlink')}${scenario === 'erro' ? area('Vendas indisponíveis', `<p>A leitura do período falhou.</p>${btn('Tentar novamente', 'recover', '1')}`) : `<div class="hero"><div><span>Vendido no período</span><b>${money(sum(rows))}</b>${btn('Conferir pedidos →', 'orders', 'all', '')}</div><div><span>Pedidos confirmados</span><b>${integer(rows.length)}</b></div><div><span>Ticket médio</span><b>${ticket(rows)}</b></div></div>${comparison()}${chart(rows)}${teamTable(rows)}`}`;
        }
        function metrics(pairs) {
          return `<div class="metrics">${pairs.map(([k, v]) => `<div><small>${k}</small><b>${v}</b></div>`).join('')}</div>`;
        }
        // Os ciclos históricos da amostra já completaram a janela de 15 min.
        // Na fila, AT-039 e AT-046 são primeiras respostas; AT-039 continua
        // fora do prazo depois da resposta tardia no terceiro evento.
        function responseIndicator(person, rows) {
          const cutoff = 15;
          const onTime = rows.filter((r) => r.first <= cutoff).length;
          const lateInDemo = queue.filter(
            (q) => q.firstOwner === person && q.age + visibleStep > cutoff,
          ).length;
          const eligible = rows.length + lateInDemo;
          const openLate = activeQueue().filter(
            (q) => q.firstOwner === person && q.age > cutoff,
          ).length;
          const value =
            eligible < 10
              ? 'Base insuficiente'
              : ((100 * onTime) / eligible).toLocaleString('pt-BR', {
                  maximumFractionDigits: 1,
                }) + '%';
          return area(
            'Primeira resposta no prazo',
            `<p><strong>${value}</strong> · ${onTime} de ${eligible} ciclos no prazo</p><p class="muted">${openLate} ainda em espera acima do prazo. Indicador proposto.</p><details><summary>Como é calculado</summary><p>Uma oportunidade por ciclo, atribuída a quem assumiu. Entram as janelas de 15 minutos de expediente que já terminaram no período. Conta no numerador a primeira resposta humana efetiva em até 15 minutos úteis. A espera vencida entra mesmo em aberto. O percentual aparece a partir de 10 ciclos.</p></details>`,
          );
        }
        function seller() {
          const p = Number(selected),
            sales = periodOrders(...interval()).filter((r) => r.person === p),
            activityRows = periodActivity(p),
            m = stats(activityRows);
          return (
            btn('← Resultado comercial', 'view', 'resultado', 'textbtn') +
            heading(team[p] + ' · desempenho', dates()) +
            area(
              'Vendas atribuídas',
              metrics([
                ['Vendido', money(sum(sales))],
                ['Confirmados', sales.length],
                ['Ticket médio', ticket(sales)],
              ]) + filteredLink('p' + p, 'Conferir pedidos de ' + team[p]),
            ) +
            responseIndicator(p, activityRows) +
            area(
              'Atendimento no expediente',
              metrics([
                ['Conversas atendidas', m.n],
                ['Assumidas', m.assumed],
                ['Encerradas', m.closed],
                ['1ª resposta · mediana', minuteLabel(m.median)],
                ['1ª resposta · p90', minuteLabel(m.p90)],
                ['Amostras de resposta', m.n],
                ['Para assumir · mediana', minuteLabel(m.claim)],
                ['Esperas acima de 15 min', m.late],
              ]),
            ) +
            area(
              'Perdas declaradas',
              `<p>${m.lost} no período · ${['Preço', 'Prazo'].map((reason) => reason + ' ' + activityRows.filter((r) => r.reason === reason).length).join(' · ')}</p>`,
            )
          );
        }
        function ordersView() {
          let rows = periodOrders(...interval());
          if (filter.startsWith('p'))
            rows = rows.filter((r) => r.person === Number(filter.slice(1)));
          if (filter.startsWith('d'))
            rows = rows.filter((r) => r.day === Number(filter.slice(1)));
          const origin = filter.startsWith('p')
            ? team[Number(filter.slice(1))]
            : filter.startsWith('d')
              ? date(Number(filter.slice(1)))
              : 'Todas as origens';
          return (
            (filter.startsWith('p')
              ? btn(
                  '← Desempenho de ' + origin,
                  'seller',
                  filter.slice(1),
                  'textbtn',
                )
              : btn('← Resultado comercial', 'view', 'resultado', 'textbtn')) +
            heading('Pedidos confirmados', dates() + ' · ' + origin) +
            area(
              rows.length + ' pedidos · ' + money(sum(rows)),
              rows.length
                ? rows
                    .slice()
                    .reverse()
                    .map(
                      (r) =>
                        `<div class="entry"><span><b>${r.id}</b><small>${date(r.day)} · ${sources[r.person]}</small></span><strong>${money(r.cents)}</strong></div>`,
                    )
                    .join('')
                : '<p>Nenhum pedido confirmado neste recorte.</p>',
            )
          );
        }
        function central() {
          const q = activeQueue(),
            unclaimed = q.filter((r) => r.state === 'Sem responsável'),
            late = q.filter(
              (r) => r.state === 'Aguardando resposta' && r.age > 15,
            );
          const events = [...changes.slice(0, visibleStep).reverse(), ...facts];
          return (
            heading(
              'Central ao vivo',
              '18 de novembro de 2026 · relógio simulado de São Paulo',
            ) +
            `<div class="row"><span class="pill ${live ? 'warn' : 'good'}">${live ? 'Reconectando' : 'Ao vivo · simulação'}</span><small>Última leitura válida às ${nowTime()}</small></div>` +
            area(
              'Operação agora',
              metrics([
                ['Sem responsável', unclaimed.length],
                ['Resposta acima de 15 min úteis', late.length],
                [
                  'Espera mais antiga',
                  minuteLabel(Math.max(...q.map((r) => r.age))),
                ],
                ['Entregas atrasadas', '1'],
              ]),
            ) +
            `<div class="twocol">${area(
              'Fila de atenção',
              q
                .toSorted((a, b) => b.age - a.age)
                .map(
                  (r) =>
                    `<button class="entry" data-record="${r.id}"><span>${r.state}<small>${r.id} · ${r.label}</small></span><span class="pill ${r.age > 15 ? 'warn' : ''}">${r.age} min</span></button>`,
                )
                .join('') +
                btn(
                  'P-1198 · Entrega atrasada →',
                  'record',
                  'P-1198',
                  'textbtn',
                ),
            )}${area('Atividade recente', events.map((e) => `<button class="entry" data-record="${e.id}"><span>${e.name}<small>${e.ref}</small></span><small>${e.time}</small></button>`).join(''))}</div>` +
            area(
              'Outras pendências',
              btn(
                'Pedido da loja aguardando primeira impressão →',
                'record',
                'LOJA',
                'textbtn',
              ) +
                '<br>' +
                btn(
                  'Consultar atendimento do agente →',
                  'record',
                  'AGENTE',
                  'textbtn',
                ),
            )
          );
        }
        function record() {
          const fact = [...changes, ...facts].find((e) => e.id === selected),
            q = activeQueue().find((r) => r.id === selected);
          const aux = {
            'P-1198': [
              'Entrega atrasada',
              'Entrega prometida para 17/11. Conferir o pedido com o responsável.',
            ],
            LOJA: [
              'Pedido da loja',
              'Um pedido da loja aguarda a primeira impressão da ficha.',
            ],
            AGENTE: [
              'Atendimento do agente',
              'Duas conversas em modo agente na amostra.',
            ],
          };
          const [title, detail] = fact
            ? [fact.name, fact.detail]
            : q
              ? [q.state, q.label + ' · ' + q.age + ' minutos úteis de espera.']
              : aux[selected] || ['Atendimento', 'O estado da fila mudou.'];
          return (
            btn('← Central ao vivo', 'view', 'central', 'textbtn') +
            heading(title, 'Detalhe simulado · ' + (fact?.ref || selected)) +
            area(
              'Registro da operação',
              `<p>${detail}</p><p class="muted">${fact ? 'Horário do fato · ' + fact.time : 'Última leitura · ' + nowTime()}</p>`,
            )
          );
        }
        const notes = {
          resultado: [
            'Resultado comercial',
            'Troque para Mês e abra Conferir pedidos. A soma da lista deve bater com o valor em destaque. Ivo aparece mesmo quando atende e fecha zero vendas.',
            'Pedidos confirmados entram pela data comercial e pelo valor final com frete. Testes, cancelados e pendentes ficam fora. O ticket divide o vendido pelo número de pedidos.',
          ],
          seller: [
            'Detalhe da pessoa',
            'Confira a quantidade de amostras junto à mediana e abra os pedidos da pessoa. Voltar recupera o período.',
            'O crédito fica com o responsável na confirmação. Cada conversa com resposta humana efetiva conta uma vez por pessoa. O p90 exige cinco amostras.',
          ],
          orders: [
            'Conferência do valor',
            'Compare o cabeçalho com os pedidos listados. Se chegou por um vendedor ou dia, só esse recorte aparece.',
            'O produto precisará transportar período, dia e atribuição na URL e revalidar cada filtro na API.',
          ],
          central: [
            'Operação ao vivo',
            'Avance um evento. O primeiro tira uma conversa da fila. O segundo acrescenta R$ 640 ao vendido. Desconecte e avance para testar a recuperação.',
            'O aviso traz a hora da última leitura. A conexão retomada relê fila e fatos antes de voltar ao vivo. Um replay preserva o total.',
          ],
          record: [
            'Detalhe operacional',
            'Confira a referência e o horário que explicam a linha escolhida. Voltar recupera a fila.',
            'No produto, o destino será o pedido ou a conversa autorizada. A simulação usa registros fictícios e não contém mensagens de clientes.',
          ],
        };
        const changesDoc = [
          [
            'Período comercial',
            'Ao escolher Mês, só o card Vendido e seus detalhes mudam. A série e a equipe continuam em sete dias.',
            'O seletor governa total, pedidos, ticket, gráfico, equipe e listas. Hoje mostra composição e os intervalos maiores mostram dias.',
            'Mude de Hoje para Mês e confira a lista de pedidos.',
          ],
          [
            'Atuação dos vendedores',
            'O resumo mostra até cinco pessoas. Atendimento, pedidos, ticket e perdas ficam distribuídos em leituras com períodos diferentes.',
            'O resumo cruza esforço e resultado. A linha abre atividade, tempos úteis, amostras e perdas da mesma pessoa.',
            'Abra Ivo e compare atendimentos com zero pedidos.',
          ],
          [
            'Pendências e entregas',
            'Próximo passo, atendimento, fila de espera e entregas competem pela primeira dobra.',
            'Uma chamada compacta leva à urgência. A Central reúne filas, entrega, loja e atividade recente.',
            'Assuma um atendimento pelo simulador e observe a fila.',
          ],
          [
            'Confiança no número',
            'O link do card abre todos os confirmados. O gráfico da semana pode divergir do total selecionado.',
            'A lista explica o número. Loja e sem atribuição fecham a soma. A variação usa intervalos fechados identificados.',
            'Na série diária, abra um dia e confira pedidos e montante.',
          ],
        ];
        function beforeDoc() {
          return `<h2 tabindex="-1" id="doctitle">Antes e depois</h2><p>Quatro mudanças para avaliar no painel administrativo.</p>${changesDoc.map(([title, old, next, test], i) => `<section><h3>${title}</h3><div class="decgrid"><article><b>Hoje no CRM</b><p>${old}</p></article><article><b>Proposta</b><p>${next}</p></article></div><p>${test}</p>${btn('Experimentar →', 'journey', ['mes', 'ivo', 'central', 'serie'][i], 'textbtn')}</section>`).join('')}`;
        }
        const phases = [
          [
            'P0 · Período e resultado',
            'Refatorar a resolução de datas no servidor. Estender resumo, série e consultas de equipe. Carregar o recorte nos links e retirar a legenda “Vale para Vendido”.',
            'Cartão, série, lista e equipe reconciliam em centavos na virada do mês e após troca rápida de período.',
            'PNL-02/05 · FIN-02 · PERF-02',
          ],
          [
            'P0 · Equipe',
            'Reutilizar desempenho, serviço e perdas. Preservar crédito histórico, inativos com atividade e linhas de loja e sem atribuição.',
            'Uma transferência conserva o crédito. Reabertura retira o pedido. Reconfirmação conta uma vez. A tabela inclui atendimento sem venda.',
            'PERF-01–08 · MET-01–08/12',
          ],
          [
            'P1 · Central ao vivo',
            'Agrupar as releituras pelo SSE existente. Obter fatos verificáveis com horário, ID estável e destino autorizado. Recalcular idade e prazo mesmo sem novas mensagens.',
            'Uma tomada atualiza a fila e o histórico uma vez. A meta proposta é até 5 s com conexão saudável. Após queda, reler antes de declarar Ao vivo.',
            'PNL-01/03/06 · ACT-09–12 · ADR 095',
          ],
          [
            'P2 · Comparação',
            'Mostrar diferença absoluta e percentual entre intervalos completos. Evidenciar pedidos e ticket de cada base.',
            'Base zero omite percentual. No primeiro dia do mês, indicar ausência de dias completos. Dias em curso ficam no total principal.',
            'FIN-02 · PERF-02/08',
          ],
        ];
        const decisions = [
          'Abrir em Resultado comercial, com atalho para a urgência',
          'Aplicar Hoje, 7 dias e Mês a todo o resultado',
          'Adotar a composição da tabela e o detalhe de atendimento',
          'Entregar a Central ao vivo e sua ordem de prioridade',
          'Mostrar a comparação compacta junto ao vendido',
          'Experimentar a taxa de primeira resposta no prazo por vendedor',
        ];
        let choices = decisions.map(() => 'Em revisão'),
          comment = '';
        function planDoc() {
          return `<h2 tabindex="-1" id="doctitle">Plano de entrega e parecer</h2><p>A RFC 073 está em revisão. Use esta ficha para registrar quais pontos podem seguir e quais precisam de ajuste.</p>
 <section><h3>Cobertura da RFC 073</h3><div class="decgrid"><article><b>Dá para experimentar</b><p>Hoje, 7 dias e Mês, composição e série diária, lista conciliada por dia e pessoa, equipe e detalhe, fila, simulação de venda, queda e retomada. O novo indicador de resposta é uma proposta adicional.</p></article><article><b>Prévia parcial</b><p>A equipe tem quatro pessoas ativas. O detalhe usa o recorte herdado e ainda falta o atalho de 30 dias. A fila exemplifica entrega atrasada, loja e agente. Pedidos a confirmar, próximas entregas e a baixa do aviso na primeira impressão aguardam demonstração.</p></article><article><b>Cenários a validar</b><p>A amostra usa 18/11. Faltam virada de mês, mês curto, inativo com venda, reabertura, transferência, reconfirmação e cancelamento. Há simulação de falha inicial; a falha parcial com retenção da última leitura comercial precisa de prova.</p></article><article><b>Depende do CRM integrado</b><p>Permissões por linha e papel, cálculo oficial no servidor, listas reais, atualização de prazos em fila silenciosa, tempo de ponta a ponta e recuperação de lacunas do SSE. A aprovação visual cobre a composição e as interações demonstradas.</p></article></div></section>
 <section><h3>O que entra em cada entrega</h3>${phases.map(([title, what, proof, refs]) => `<details><summary>${title}</summary><p>${what}</p><p><b>Aceite.</b> ${proof}</p><p class="meta">${refs}</p></details>`).join('')}</section>
 <section><h3>Regras para a implementação</h3><div class="decgrid"><article><b>Quais datas entram?</b><p>São Paulo. Mês começa no dia 1. Sete dias inclui hoje. Para comparar, usar até ontem e igual número de dias fechados da base. Hoje apresenta ontem como dia completo.</p></article><article><b>Quem pode ver?</b><p>O servidor aplica a permissão a totais, filas, eventos e destinos. A supervisão de outras linhas pessoais requer a conta designada pela ADR 095. O pedido tem autorização comercial própria.</p></article><article><b>Como tratar ausência?</b><p>Venda zero aparece como R$ 0 e ticket sem base como traço. Falha de consulta aparece com nova tentativa. A reconexão identifica o horário da leitura anterior.</p></article><article><b>O que depende de homologação?</b><p>Latência real, permissões no servidor, reconciliação após lacuna e comparação com o checkpoint dependem de integração e testes. Os eventos deste arquivo avançam pelo simulador.</p></article></div></section>
 <section><h3>Parecer sobre a proposta</h3><p>As escolhas ficam nesta sessão. Baixe o texto para guardar ou compartilhar seu parecer.</p>${decisions.map((d, i) => `<label for="pick${i}">${d}</label><select id="pick${i}" data-choice="${i}">${['Em revisão', 'Aceitar', 'Pedir ajuste', 'Adiar'].map((c) => `<option ${choices[i] === c ? 'selected' : ''}>${c}</option>`).join('')}</select>`).join('')}<label for="comment">Ajustes e observações</label><textarea id="comment" rows="3"></textarea>${btn('Baixar parecer em texto', 'download', '1', 'button mainbtn')}</section>`;
        }
        function updateSim() {
          $('sim').innerHTML =
            `<p class="meta">${step} de 3 eventos · ${live ? 'sem conexão' : 'conectado'}</p>${step < 3 ? btn('Avançar · ' + changes[step].name, 'advance', '1') : ''}${btn(live ? 'Reconectar' : 'Simular desconexão', 'connection', '1')}${visibleStep > 0 ? btn('Repetir último evento', 'replay', '1') : ''}${btn('Reiniciar simulação', 'reset', '1')}${replayed ? '<p>Evento já recebido. Fila e total preservados.</p>' : ''}`;
        }
        function playbackControl() {
          if (step < changes.length)
            $('sim').insertAdjacentHTML(
              'beforeend',
              btn(
                playback
                  ? 'Pausar sequência'
                  : 'Reproduzir sequência automática',
                'play',
                '1',
              ),
            );
        }
        function stateURL(replace = false) {
          const q = new URLSearchParams({ page, view, period });
          if (selected) q.set('id', selected);
          if (filter !== 'all') q.set('filter', filter);
          if (location.hash.slice(1) !== q.toString())
            location[replace ? 'replace' : 'assign']('#' + q.toString());
        }
        function readURL() {
          const q = new URLSearchParams(location.hash.slice(1));
          page = ['antes', 'plano'].includes(q.get('page'))
            ? q.get('page')
            : 'painel';
          period = Object.hasOwn(labels, q.get('period'))
            ? q.get('period')
            : 'hoje';
          view = Object.hasOwn(notes, q.get('view'))
            ? q.get('view')
            : 'resultado';
          const id = q.get('id') || '',
            f = q.get('filter') || 'all';
          selected = [
            ...changes.map((x) => x.id),
            ...facts.map((x) => x.id),
            ...queue.map((x) => x.id),
            'LOJA',
            'AGENTE',
            'P-1198',
            '0',
            '1',
            '2',
            '3',
          ].includes(id)
            ? id
            : '';
          filter = /^(all|p[0-3]|d(?:[1-9]|1[0-8]))$/.test(f) ? f : 'all';
          if (view === 'seller' && !/^[0-3]$/.test(selected))
            view = 'resultado';
          if (view === 'record' && !selected) view = 'central';
        }
        function render() {
          const focused = document.activeElement;
          const identity =
            focused?.tagName === 'BUTTON'
              ? Object.entries(focused.dataset)[0]
              : null;
          document
            .querySelectorAll('[data-page]')
            .forEach((b) =>
              b.setAttribute('aria-pressed', String(b.dataset.page === page)),
            );
          document
            .querySelectorAll('.appnav [data-view]')
            .forEach((b) =>
              b.setAttribute(
                'aria-pressed',
                String(
                  b.dataset.view ===
                    (['central', 'record'].includes(view)
                      ? 'central'
                      : 'resultado'),
                ),
              ),
            );
          $('work').hidden = page !== 'painel';
          $('document').hidden = page === 'painel';
          if (page !== 'painel') {
            $('document').innerHTML =
              page === 'antes' ? beforeDoc() : planDoc();
            if ($('comment')) $('comment').value = comment;
          } else {
            if (scenario === 'erro' && ['orders', 'seller'].includes(view))
              view = 'resultado';
            $('stage').innerHTML = {
              resultado: result,
              central,
              seller,
              orders: ordersView,
              record,
            }[view]();
            const [title, test, rule] = notes[view];
            $('inspector').innerHTML =
              `<p><strong>${title}</strong></p><p>${test}</p><details><summary>Regra desta tela</summary><p>${rule}</p></details>`;
            updateSim();
            playbackControl();
          }
          if (identity && !focused.isConnected) {
            const [k, v] = identity;
            Array.from(document.querySelectorAll('button'))
              .find((b) => b.dataset[k] === v && !b.closest('[hidden]'))
              ?.focus({ preventScroll: true });
          }
        }
        function nav() {
          page = page || 'painel';
          stateURL();
          render();
          (page === 'painel' ? $('viewtitle') : $('doctitle'))?.focus({
            preventScroll: true,
          });
        }
        document.addEventListener('click', (e) => {
          const b = e.target.closest('button');
          if (!b) return;
          const d = b.dataset;
          if (d.page) {
            page = d.page;
            nav();
            return;
          }
          if (d.journey) {
            page = 'painel';
            scenario = 'normal';
            $('scenario').value = scenario;
            view =
              d.journey === 'central'
                ? 'central'
                : d.journey === 'ivo'
                  ? 'seller'
                  : 'resultado';
            selected = view === 'seller' ? '3' : '';
            period = d.journey === 'serie' ? 'semana' : 'mes';
            nav();
            return;
          }
          if (d.view) {
            view = d.view;
            filter = 'all';
            selected = '';
            nav();
            return;
          }
          if (d.period) {
            period = d.period;
            stateURL();
            render();
            announce('Resultado atualizado para ' + labels[period]);
            return;
          }
          if (d.sort) {
            desc = sort === d.sort ? !desc : d.sort !== 'name';
            sort = d.sort;
            render();
            return;
          }
          if (d.seller !== undefined) {
            view = 'seller';
            selected = d.seller;
            nav();
            return;
          }
          if (d.orders) {
            view = 'orders';
            filter = d.orders;
            nav();
            return;
          }
          if (d.record) {
            view = 'record';
            selected = d.record;
            nav();
            return;
          }
          if (d.recover) {
            scenario = 'normal';
            $('scenario').value = scenario;
            render();
            announce('Leitura comercial recuperada');
            return;
          }
          if (d.download) {
            const out = [
              'RFC 073 · Parecer sobre o protótipo',
              ...decisions.map((t, i) => choices[i] + ' — ' + t),
              comment,
            ].join('\n\n');
            const u = URL.createObjectURL(
              new Blob([out], { type: 'text/plain;charset=utf-8' }),
            );
            const a = document.createElement('a');
            a.href = u;
            a.download = 'parecer-painel-administrativo.txt';
            a.click();
            setTimeout(() => URL.revokeObjectURL(u), 1000);
            announce('Parecer preparado para download');
            return;
          }
          replayed = false;
          if (d.advance) {
            advance();
          } else if (d.play) {
            if (playback) stopPlayback();
            else
              playback = setInterval(() => {
                advance();
                if (
                  page === 'painel' &&
                  (view === 'central' || view === 'resultado')
                )
                  render();
              }, 3000);
          } else if (d.connection) {
            live = !live;
            if (!live) visibleStep = step;
          } else if (d.replay) {
            replayed = true;
          } else if (d.reset) {
            stopPlayback();
            step = visibleStep = 0;
            live = false;
          } else return;
          render();
          announce(
            replayed
              ? 'Evento já contabilizado'
              : live
                ? 'Simulação sem conexão'
                : 'Central atualizada às ' + nowTime(),
          );
          if (
            !document.activeElement ||
            document.activeElement === document.body
          )
            $('sim').querySelector('button')?.focus({ preventScroll: true });
        });
        document.addEventListener('change', (e) => {
          const el = e.target;
          if (el.id === 'device')
            $('screen').classList.toggle('mobile', el.value === 'mobile');
          if (el.id === 'theme')
            $('screen').classList.toggle('night', el.value === 'Escuro');
          if (el.id === 'scenario') {
            scenario = el.value;
            view = 'resultado';
            page = 'painel';
            stateURL();
            render();
            announce('Cenário atualizado');
          }
          if (el.dataset.choice !== undefined)
            choices[Number(el.dataset.choice)] = el.value;
        });
        document.addEventListener('input', (e) => {
          if (e.target.id === 'comment') comment = e.target.value;
        });
        globalThis.addEventListener('hashchange', () => {
          const q = new URLSearchParams(location.hash.slice(1));
          if (
            q.get('page') === page &&
            q.get('period') === period &&
            q.get('view') === view &&
            (q.get('id') || '') === selected &&
            (q.get('filter') || 'all') === filter
          )
            return;
          readURL();
          render();
        });
        readURL();
        render();
      })();
    </script>
  </body>
</html>
